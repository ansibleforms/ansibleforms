      - name: varsFiles
        type: array
        with_types: ansible, awx
        group: basic
        allowed: list of file paths (absolute or relative)
        short: Load YAML files as constants
        version: 6.1.0
        description: |
          Load one or more YAML files as constants that will be merged with the base config constants.
          Files must contain a dictionary (not a list) and must have .yml or .yaml extension.
          
          **Path Resolution:**
          - Absolute paths: used as-is (e.g., `/opt/shared/vars/database.yaml`)
          - Relative paths: resolved against VARS_FILES_PATH environment variable (default: `persistent/vars/`)
          
          **Use Cases:**
          - Share common variables across multiple forms
          - Separate sensitive configuration from form definitions
          - Centralize environment-specific settings
          
          **Note:** Files are merged in order. Later files override earlier ones if keys conflict.
          Variables from varsFiles are merged with base config constants.
        examples:
        - name: Load single vars file
          code: |
            varsFiles:
              - common/database.yaml    # relative to VARS_FILES_PATH
        - name: Load multiple vars files with absolute paths
          code: |
            varsFiles:
              - /opt/shared/globals.yaml
              - /etc/ansibleforms/env-prod.yaml
        - name: Mix relative and absolute paths
          code: |
            varsFiles:
              - common/shared.yaml           # relative
              - /opt/custom/overrides.yaml   # absolute
      - name: fields
        type: array
        group: basic
        allowed: valid field object
        short: fields
        objectLink: forms/form/formfield
        docsObjectLink: "/formfields/"
        description: |
          It makes sense that a form has 1 or more formfields.  Read more about them in the separate formfield section.
        examples:
        - name: Examples
          code: |
            fields:
              - name : name
                label: Your name
                type: text
                required: true
              - name : email
                label: Your email
                type: text
                regex:
                  expression: '^[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,4}$'
                  description: Please enter a valid email address
                required: true
      help:
        - name: Step
          itemName: attribute
          link: forms/form/step
          
          icon: fas,list-ol
          description: |
            Each step is a new form destination.  And steps are executed sequentially.  
            Use specific properties like `continue`, `always` and `ifExtraVar` to control the flow of a multistep form.  
            
            When a step has `type: ansible`, all [ansible-specific form properties](/forms/ansible.html) apply to that step (e.g. `playbook`, `playbookSubPath`, `ansibleCredentials`, `vaultCredentials`, `inventory`, `check`, `diff`, `tags`, `varsFiles`, `approval`, `notifications`, ...).  
            When a step has `type: awx`, all [awx-specific form properties](/forms/awx.html) apply to that step (e.g. `template`, `awx`, `awxCredentials`, `executionEnvironment`, `instanceGroups`, `scmBranch`, `inventory`, `check`, `diff`, `tags`, `approval`, `notifications`, ...).
          items:
          - name: name
            type: string
            required: true
            group: basic
            allowed: alphanumeric + dash + underscore + space
            short: The name of the form
            description: | 
              The name of the step.  Used for logging and visualization.
          - name: type
            type: string
            group: basic
            choices:
            - name: ansible
              description: | 
                Targets an Ansible playbook, run on a runner of type rte (Connections > Runners).
            - name: awx
              description: |
                Targets a job or workflow template on a runner of type awx (Connections > Runners).
            short: Step type
            description: | 
              Every step can be an ansible-playbook or an awx-template
            examples:
            - name: Run AWX Template Helloworld
              code: |
                name: Create vm
                type: awx
                roles:
                  - public
                fields: []
                template: Create VM       
            - name: Run Ansible playbook
              code: |
                name: Delete vm
                type: ansible
                roles:
                  - public
                fields: []
                playbook: delete_vm.yaml
          - name: key
            type: string
            allowed: valid extravar reference
            group: workflow
            short: Extravar key
            description: |
              Ansible Forms can model the extravars into objects using the formfield `model` attribute.  In a multistep form, by default, every step gets the full extravars payload.  However, using this `key` attribute you can choose which step receives which part of the extravars.  
              Study the example below to understand how the `key` property works.
            examples:
            - name: Resize volume
              code: |
                name: Resize volume
                type: multistep
                roles:
                  - public
                steps:
                - name: Create datastore
                  type: awx
                  template: create_datastore
                  key: datastore        # to create the datastore, we only send the datastore info        
                - name: Create vm
                  type: awx
                  template: create_vm
                fields:
                  - name: datastore
                    type: text
                    model: datastore.name
                  - name: datastore_size
                    type: number
                    model: datastore.size
                  - name: vm
                    type: text
                    model: vm.name
                  - name: vm_size
                    type: number
                    model: vm.size

                # the extravars of the above example will be somewhat like this :
                # datastore: 
                #     name: ds1
                #     size: 123
                # vm:        
                #     name: vm1
                #     size: 100

                # Step 1 will not receive the full set of extravars, due to the 'key: datastore'  
                #        it will receive only 'name' (ds1) and 'size' (123) (the contents of key 'datastore')
                # Step 2 has no key set, and will receive the full extravars
                # Extra : Every step can reference its own key and thus send a piece of the extravars
          - name: ifExtraVar
            type: extravar reference
            group: workflow
            short: Run step if ...
            description: |
              In a mulitstep form, by default, Ansible Forms will try to run every step sequentially one after the other.  
              Using this property you choose if a step should be run or not by setting the property to a part of the extravars that resolves into a boolean (expression or checkbox).  This way you can dynamically skip steps.
            examples: 
            - name: Run step based on checkbox
              code: |
                name: Create something
                type: multistep
                roles:
                  - public
                steps:
                - name: Create
                  type: awx
                  template: create
                - name: Send email
                  type: awx
                  template: send mail
                  ifExtraVar: sendmail
                fields:
                - name: name
                  type: text
                  label: What to create ?
                - name: sendmail
                  type: checkbox
                  label: Should I send an email ?
          - name: continue
            type: boolean
            group: workflow
            default: false
            short: Continue on fail
            description: |
              In a mulitstep form, by default, if 1 step fails, the multistep is stopped.  However, if you want to continue to the next step, even if the current step failed, use this attribute and set it to true and the multistep will goto the next step.  If this happens the status becomes 'partially success'.
            examples: 
            - name: 
              code: |
                name: Resize volume
                type: multistep
                roles:
                  - public
                fields: []
                steps:
                - name: Send email
                  type: awx
                  template: email
                  continue: true       # if email send fails, we still continue
                - name: Resize volume
                  type: awx
                  template: volume resize
          - name: always
            type: boolean
            group: workflow
            default: false
            short: Always run
            description: |
              In a mulitstep form, by default, if 1 step fails, the multistep is stopped.  However, if you always want to run a certain step, even if a step failed somewhere, use this attribute and set it to true and the specific step will always run.  
            examples: 
            - name: 
              code: |
                name: Resize volume
                type: multistep
                roles:
                  - public
                fields: []
                steps:
                - name: Load cmdb
                  type: awx
                  template: load cmdb
                - name: Resize volume
                  type: awx
                  template: volume resize
                - name: Send email
                  type: awx
                  template: email
                  always: true       # whether step 1 or 2 fails, this step always runs          
        - name: Wizard step
          itemName: attribute
          link: forms/form/wizard
          icon: fas,wand-magic-sparkles
          description: |
            Each wizard step references a [`subform`](/forms/subform.html) and is rendered as its own page with **Back** and **Next** navigation. The user must validate one step before moving to the next; data from earlier steps is available in later steps via [`__parent__`](/faq.html#how-do-i-access-parent-form-data-inside-a-subform).  
            <br>
            **Review step is automatic.** A read-only summary page that lists every step's input is appended as the last page of the wizard. You do **not** declare it in YAML — its title is taken from the active locale ("Summary" / "Samenvatting" / "Zusammenfassung" / ...).  
            <br>
            **Wizard vs Multistep.** [`steps`](/forms/multistep.html) splits the **execution** into multiple sequential jobs (each step is its own playbook/template). `wizard` splits the **input** of a single form into multiple pages — only one job runs at the end. The two can be combined: a `type: multistep` form can also have a `wizard:` block to gather its extravars across pages.
          items:
          - name: subform
            type: string
            required: true
            group: basic
            allowed: a valid subform name
            short: Subform reference
            description: |
              The name of a [`type: subform`](/forms/subform.html) form to render on this wizard page. The subform's fields become this step's inputs.
            examples:
            - name: Reference a subform
              code: |
                wizard:
                  - subform: basics
                  - subform: network
          - name: name
            type: string
            group: basic
            allowed: alphanumeric + dash + underscore
            short: Step namespace key
            description: |
              The key under which this step's values are exposed to later steps via `$(__parent__.<name>.<field>)`.  
              Defaults to the value of `subform` when omitted.  
              Set this explicitly when you reuse the same subform multiple times in the same wizard, or when you want a stable key independent of the subform name.
            examples:
            - name: Override the namespace
              code: |
                wizard:
                  - subform: address
                    name: shipping
                  - subform: address
                    name: billing
          - name: title
            type: string
            group: basic
            allowed: free text
            short: Page title in the stepper
            description: |
              Title shown in the wizard stepper and at the top of the page.  
              Defaults to the subform's `description`, or to the step's `name` if no description is set.
            examples:
            - name: Custom title
              code: |
                wizard:
                  - subform: basics
                    title: Tell us about your host
          - name: help
            type: string
            group: basic
            allowed: free text (markdown supported)
            short: Help text shown on this page
            description: |
              Help text rendered on the wizard page. Defaults to the subform's own `help` when omitted.
          - name: showHelp
            type: boolean
            group: basic
            allowed: "true, false"
            default: false
            short: Show help on load
            description: |
              When `true`, the help block is expanded by default when the user lands on this page. Falls back to the subform's `showHelp` when omitted.
          - name: defaultModel
            type: string
            group: basic
            allowed: a model path (dot notation allowed)
            short: Wrap this step's output under a prefix
            description: |
              Wraps every field of this step under the given object key in the final extravars payload. Useful when you reuse a generic subform and want its values namespaced.  
              Without `defaultModel`, fields are merged into the top level of the extravars (still grouped per step under `__parent__` for cross-step references).
            examples:
            - name: Wrap network fields under `net`
              code: |
                wizard:
                  - subform: network
                    defaultModel: net

                # The subform has fields `hostname` and `ipv4`.
                # Final extravars contain:
                #   net:
                #     hostname: ...
                #     ipv4: ...
          - name: when
            type: expression
            group: workflow
            allowed: a JavaScript expression returning truthy/falsy
            short: Conditionally show this step
            description: |
              When the expression evaluates falsy, the step is **hidden entirely** — the user never sees it and its values are not collected.  
              The expression has access to all earlier steps via `__parent__.<stepname>.<field>`. Steps after a hidden one are renumbered automatically.  
              Note: `when` is purely about **visibility**; it is unrelated to [`optional`](#wizard_optional), which is about whether the user is allowed to skip a visible step.
            examples:
            - name: Only show when kind is "vm"
              code: |
                wizard:
                  - subform: basics       # has a `kind` enum field
                  - subform: advanced
                    when: $(__parent__.basics.kind) === 'vm'
          - name: optional
            type: boolean
            group: workflow
            allowed: "true, false"
            default: false
            short: Allow skipping this step
            description: |
              When `true`, the user can press **Next** even if the step's fields are not (yet) valid, and **Submit** is allowed without ever visiting this step.  
              The step is still shown in the stepper — use [`when`](#wizard_when) if you want to hide it altogether.
            examples:
            - name: Optional advanced page
              code: |
                wizard:
                  - subform: basics
                  - subform: advanced
                    optional: true
          examples:
          - name: Minimal wizard (review page is auto-added)
            code: |
              - name: Provision host
                type: ansible
                roles:
                  - public
                playbook: provision.yml
                wizard:
                  - subform: basics
                  - subform: network

              - name: basics
                type: subform
                fields:
                  - name: hostname
                    type: text
                    required: true

              - name: network
                type: subform
                fields:
                  - name: ipv4
                    type: text
          - name: Cross-step reference and namespace prefix
            code: |
              wizard:
                - subform: basics
                  title: Basics
                - subform: network
                  title: Network
                  defaultModel: net          # wraps network fields under `net`

              # In the `network` subform you can reference fields
              # from the `basics` step like this:
              #   default: $(__parent__.basics.hostname).local
        - name: Formfield
          itemName: attribute
          link: forms/form/formfield
          icon: fas,font
          description: |
            Each form contains 1 or more formfields.  Each formfield can be heavily tuned with the below parameters.  
          items:
          - name: name
            type: string
            required: true
            group: basic
            unique: true
            allowed: Alfanumeric + underscore + dash
            short: Field name
            description: This attribute represents the name of the form field.
          - name: type
            type: string
            required: true
            group: basic
            choices:
              - name: text
                description: A text input field
                examples:
                - name: Text
                  code: |
                    - type: text
                      name: username
                      label: Username
                      default: ansibleguy
                      placeholder: type a username
                      required: true
                      minLength: 4
                      maxLength: 10
                      regex:
                        expression: "^[a-zA-Z]*$"
                        description: Must be alpha numeric
                      icon: user
                      help: A help message     
              - name: textarea
                description: A textarea input field
                examples:
                - name: Textarea
                  code: |
                    - type: textarea
                      name: comments
                      label: Comments
                      default: |
                        Line 1
                        Line 2
                      placeholder: add your comments
                      required: true
                      help: A help message       
              - name: datetime
                description: A datetime input field
                examples:
                - name: DateTime
                  code: |
                    - type: datetime
                      dateType: date
                      name: mydate
                      label: Date
                      default: "2023-12-01"
                      required: true
                      help: A help message 
                    - type: datetime
                      dateType: datetime
                      name: mydateandtime
                      line: Demo1
                      label: I will default to now
                      evalDefault: true
                      default: "new Date().toISOString().substring(0,19).replace('T',' ')"
                      required: true                      
                    - type: datetime
                      dateType: datetime
                      name: mydateandtime
                      label: DateTime
                      default: "2023-12-01 13:01:00"
                      required: true
                      help: A help message       
                    - type: datetime
                      dateType: time
                      name: mytime
                      label: Time
                      default: "13:01:00"
                      required: true
                      help: A help message    
                    - type: datetime
                      dateType: week
                      name: myweek
                      label: Week
                      help: yyyy-W## format
                      icon: calendar-week
                      required: true
                      default: "2026-W01"
                    - type: datetime
                      dateType: month
                      name: mymonth
                      label: Month
                      help: yyyy-mm
                      icon: calendar
                      required: true
                      default: "2026-01"                       
              - name: html
                description: |
                  An HTML field.
                  The html is sanitized before it is rendered : `<script>`, event handlers (`onclick`, `onerror`, ...) and `javascript:` links are always removed.
                  A link may carry `target="_blank"` to open in a new tab ; `rel="noopener noreferrer"` is added automatically.
                version: 4.0.9
                examples:
                - name: Alert
                  code: |
                    - type: html
                      name: alert
                      expression: |
                        '<div class="alert alert-danger" role="alert"> 
                          danger mister robinson !
                        </div>'
                    - type: html   
                      name: image
                      expression: |
                        '<img src="https://dummyimage.com/16:9x1080" />' 
                    - name: header
                      type: html
                      expression: | 
                        '<h3 class="title is-3">Your own title</h3>'          
                - name: Link opening in a new tab
                  code: |
                    - type: html
                      name: documentation
                      expression: |
                        '<a href="https://ansibleforms.com/" target="_blank">Read the documentation</a>'
              - name: file
                description: A file upload field, the file is uploaded prior to the job start and the extravars will contain the uploaded file info.
                version: 4.0.16
                examples:
                - name: Software Image Upload
                  code: |
                    - type: file
                      name: software_image
                      label: Upload software image
              - name: number
                description: A number input field
                examples:
                - name: Number
                  code: |
                    - type: number
                      name: numberfield
                      label: Number
                      default: '1'
                      required: true
                      minValue: 0
                      maxValue: 10
                      help: A help message    
              - name: password
                description: A password masked input field
                examples:
                - name: Password   
                  code: |
                    - type: password
                      name: mypassword
                      label: Password
                      default: ''
                      required: true
                      minLength: 8
                      maxLength: 20
                      regex:
                        expression: "^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#\\$%\\^&\\*])"
                        description: Must contain at least 1 numeric, 1 special, 1 upper and 1 lower character
                      icon: lock
                    - type: password
                      name: mypassword_verify
                      label: Verify Password
                      default: ''
                      sameAs: mypassword       # sameas-validation : value must be the same as the field 'mypassword'
                      icon: lock     
              - name: checkbox
                description: A checkbox field
                examples:
                - name: Checkbox
                  code: |
                    - type: checkbox
                      name: areyousure
                      label: Confirmation
                      default: false
                      switch: true
                      placeholder: are you sure?
              - name: radio
                description: A radio field (multi options)
                examples:
                - name: Radio
                  code: |
                    - type: radio
                      name: linuxfavourite
                      label: Choose your favorite linux flavour
                      values:
                      - CentOS
                      - Ubuntu
                      - Red Hat
                      - Debian
                      default: CentOS
                      required: true 
                - name: Radio with labels
                  version: 5.0.0
                  code: |
                    - type: radio
                      name: linuxfavourite
                      label: Choose your favorite linux flavour
                      values:
                      - label: CentOS
                        value: c_os
                      - label: Ubuntu
                        value: ubu
                      - label: Red Hat
                        value: rht
                      - label: Debian
                        value: deb
                      default: c_os
                      required: true                       
              - name: enum
                description: A multi-column filterable dropdown box
                extra: |
                  The enum field will create a powerfull dropdown box with multi-column, multiselect and filter capabilities. The enum field can be used in 3 ways.

                  * **fixed list** : simply use the `values` property to set a fixed list
                  * **database query** : you can use the query and dbConfig property to query a mysql, mssql, postgres, oracle or mongodb.
                  * **expression** : you can use the expression property to create data. in this case the output of the expression can be :
                    * **single item** : a single item like a string, integer, ...
                    * **array of items** : an array of strings, integers, ...
                    * **object** : a single 1-dimensional javascript object like `{"name":"ansibleforms","description":"is awesome"}`
                    * **array of objects** : an array of objects like `[{"name":"ansibleforms","description":"is awesome"},{"name":"ansibleguy","description":"is the best"}]`  
                    
                  **Filtering** : 
                  You can just start typing when on an enum field, filtering will happen automatically.  
                  You can tune with `filterColumns`. Otherwise filtering falls back to the `previewColumn` or the first visible column.  
                  
                  **Multiselect** :
                  Use `multiple` to allow multiselect
                examples:    
                - name: Queries
                  code: |
                    since queries are so diverse, there is a separate section on queries with examples.
              - name: expression
                description: A powerfull javascript driven expression field
                help: |
                  The expression field is the most powerfull field. It can calculate, manipulate, get, post, ... The expression can hold any type of information, array, objects, ... And the extravars-output will takeover the information. The expression field can be used in 2 ways.  
                    
                  * **database query** : you can use the query and dbConfig property to query a mysql, mssql server, postgres, oracle or mongodb.
                  * **expression** : you can use the expression property to create or retrieve data. in this case the output of the expression can be any type.  
                  The expression itself is pure javascript. You can do inline javascript or you can use a function. Read more on security concerns about expressions You can extend the functions with your own in the custom.js file. You can have synchronous and asynchronous functions. This allows you to retrieve any kind of data, whether it's reading a file or accessing a rest-api, or querying a foreign database. You can run the expression locally (`runLocal`) in the browser for simple expressions. This is faster and there is no limitation on the expression.  
                  Use the alias type `local` to quickly make an expression type with runLocal, hide and output false.  
                  Use the alias type `local_out` to quickly make an expression type with runLocal, hide.  
                  Use the alias type `credential` to quickly make an expression type with runLocal, hide, asCredential.  
                    
                  Advanced helper functions (local and remote) are available, to query from rest for example.  
                  Explore the separate section on Expressions for multiple demo's.  
                    
                  Alias : `local` (type='expression', runLocal=true, hide=true, output=false) // since version 4.0.10
                  Alias : `local_out` (type='expression', runLocal=true, hide=true) // since version 4.0.12
                  Alias : `credential` (type='expression', runLocal=true, hide=true, asCredential=true) // since version 4.0.10
                examples:    
                - name: Expressions
                  code: |
                    since expressions are so diverse, there is a separate section on expressions with examples.
              - name: list
                description: A list of structured rows edited through a reusable subform (supersedes `table`)
                extra: |
                  A `list` field shows a table of rows where each row is edited through a separate **subform** pane.  
                  The subform itself is a top-level form of type `subform`, referenced by name via the `subform` property.  
                  Subforms can be nested (a list field inside a subform) and can be reused across multiple forms (e.g. a single `Address` subform shared by customers, suppliers, ...).  
                  Use the `columns` property to pick which subform fields appear in the table. Other properties (`allowInsert`, `allowDelete`, `insertMarker`, `deleteMarker`, `updateMarker`) behave the same as in the deprecated `table` field.

                  **Pre-population.** A list can be seeded with rows in three ways:

                  * `default` — a static array of objects (keys must match subform field names). Useful for fixed seeds, possibly combined with placeholders + `evalDefault`.
                  * `expression` (+ optional `runLocal`) — server- or browser-evaluated javascript that must return an array of objects.
                  * `query` + `dbConfig` — pull rows from MySQL / MSSQL / Postgres / Oracle / MongoDB.

                  See the examples below for each mode.
                examples:
                - name: List with a shared Address subform
                  code: |
                    # Top-level forms in the same file
                    - name: Address
                      type: subform
                      fields:
                        - name: street
                          type: text
                          label: Street
                        - name: city
                          type: text
                          label: City
                        - name: country
                          type: text
                          label: Country

                    - name: Create customer
                      type: ansible
                      roles:
                        - public
                      playbook: customer.yaml
                      fields:
                        - name: name
                          type: text
                          label: Customer name
                        - name: addresses
                          type: list
                          label: Addresses
                          subform: Address
                          columns:
                            - city
                            - country
                          titleAdd: Add address
                          titleEdit: Edit address
                          allowInsert: true
                          allowDelete: true
                - name: List with marker tracking
                  code: |
                    - name: people
                      type: list
                      label: People
                      subform: Person
                      allowDelete: false          # preloaded rows are locked
                      insertMarker: added         # session-added rows stay removable
                      updateMarker: updated
                      deleteMarker: removed
                      columns:
                        - name
                        - email
                - name: Pre-populate a list with a static default
                  code: |
                    # Each row must match the referenced subform's fields.
                    - name: addresses
                      type: list
                      label: Addresses
                      subform: Address
                      columns:
                        - city
                        - country
                      default:
                        - street: Main 1
                          city: Brussels
                          country: BE
                        - street: Side 22
                          city: Paris
                          country: FR
                - name: Pre-populate a list from a REST API (expression)
                  code: |
                    # The expression must return an array of objects whose keys
                    # line up with the subform's field names.
                    - name: users
                      type: list
                      label: Users
                      subform: User
                      columns:
                        - username
                        - email
                      expression: fn.fnRestBasic('get','https://api.example.com/users','','my_api_cred','')
                - name: Pre-populate a list from a database query
                  code: |
                    - name: servers
                      type: list
                      label: Servers
                      subform: Server
                      columns:
                        - hostname
                        - role
                      dbConfig: CMDB_CONN
                      query: SELECT hostname, role FROM servers WHERE active = 1
                - name: Pre-populate a list from a local expression
                  code: |
                    # runLocal evaluates in the browser sandbox and gives full JS power.
                    - name: ports
                      type: list
                      label: Open ports
                      subform: Port
                      columns:
                        - port
                        - protocol
                      runLocal: true
                      expression: |
                        [
                          { port: 22,  protocol: 'tcp' },
                          { port: 80,  protocol: 'tcp' },
                          { port: 443, protocol: 'tcp' }
                        ]
              - name: yaml
                description: A YAML editor field with syntax highlighting and validation
                extra: |
                  A yaml field allows you to work with structured YAML configuration data.  
                  It provides a dedicated editor with syntax highlighting and always-on validation.  
                  You can load data from multiple sources:  

                  * **database query** : you can use the query and dbConfig property to query a mysql, mssql server, postgres, oracle or mongodb.
                  * **expression** : you can use the expression property to create or retrieve data (local or remote). The output must be an object or array.
                  * **manual editing** : users can directly edit YAML in an AceEditor (monokai theme) or view read-only syntax-highlighted display
                  * **file import** : load YAML from .yml or .yaml files using the optional showLoadButton
                  * **file export** : download field content as YAML using the optional showDownloadButton

                  The field performs continuous YAML syntax validation and supports custom error messages via the yamlError property.
                  In readonly mode, the field displays prettified syntax-highlighted YAML without editing capabilities.
                examples:
                - name: Manual YAML editing
                  code: |
                    - type: yaml
                      name: config
                      label: Application Configuration
                      default:
                        database:
                          host: localhost
                          port: 5432
                        features:
                          - authentication
                          - logging
                      showLoadButton: true
                      showDownloadButton: true
                      yamlError:
                        description: "Please enter valid YAML configuration"
                      required: true
                - name: YAML from expression
                  code: |
                    - type: yaml
                      name: users
                      label: User List
                      expression: fn.fnRestBasic('get','https://api.example.com/users','','','')
                      showDownloadButton: true
                      readonly: true
                - name: YAML from local expression
                  code: |
                    - type: yaml
                      name: computed_config
                      label: Computed Config
                      runLocal: true
                      expression: |
                        (()=>{
                          return {
                            env: 'production',
                            settings: $(environment_field)
                          };
                        })()
                      showDownloadButton: true
                - name: YAML from query
                  code: |
                    - type: yaml
                      name: database_data
                      label: Database Records
                      query: "SELECT * FROM servers"
                      dbConfig: mydb
                      showDownloadButton: true
            short: Field type
            description: Other attributes might only be available for some field types.
            examples:
            - name: Text
              code: |
                - type: text
                  name: username
                  label: Username
                  default: ansibleguy
                  placeholder: type a username
                  required: true
                  minLength: 4
                  maxLength: 10
                  regex:
                    expression: "^[a-zA-Z]*$"
                    description: Must be alpha numeric
                  icon: user
                  help: A help message    

                # more examples per type, check out the links at the top of the page                                                 
          - name: dateType
            type: string
            version: 4.0.2
            group: basic
            required: false
            choices:
              - name: date
                description: A single date
              - name: datetime
                description: A date and time              
              - name: time
                description: A time
              - name: month
                description: A month
              - name: year
                description: A year
            short: DateType of the datetime picker
            description: The datetime picker can pick several types
            with_types: datetime
          - name: convertToUtc
            type: boolean
            version: 6.1.4
            group: basic
            required: false
            default: false
            short: Convert datetime to UTC
            description: |
              When enabled, the selected date/time will be converted to UTC timezone before being sent to Ansible.
              When disabled, the date/time will be used as entered without timezone conversion (local time as ISO string without timezone info).
              
              **Important:** Only works when `dateType` is set to `datetime`. Has no effect for other dateTypes (date, year, month, week, time).
              
              **Use case:** If a user in GMT+2 timezone picks 14:00 with convertToUtc enabled, the field will show 14:00 but the output will be 12:00 UTC (timezone-aware conversion). Without conversion, the output would be 14:00 (server's local time).
            with_types: datetime
          - name: label
            type: string
            group: basic
            allowed: Free text
            with_types: text, textarea, datetime, number, password, checkbox, radio, enum, expression, list, file, html, yaml
            short: Field label
            description: |
              A friendly name/label for the field.  Note: if not set, the field name is used as label, but not when type is html.
              
              **Since 6.0.3:** Supports placeholders for dynamic labels (e.g., `Label: $(fieldname)`).
          - name: placeholder
            type: string
            group: basic
            allowed: Free text
            with_types: text, textarea, datetime, number, password, checkbox, radio, enum, expression, file
            short: In-field help value
            description: |
              Some form fields allow an in-field hint value.
              
              **Since 6.0.3:** Supports placeholders for dynamic hints (e.g., `Enter password (min $(minLength) chars)`).
          - name: help
            type: string
            group: basic
            allowed: Free text
            with_types: text, textarea, datetime, number, password, checkbox, radio, enum, expression, list, file, yaml
            short: Field help message
            description: |
              Some fields require additional help information.
              This help message will be shown below the field.
              
              **Since 6.0.3:** Supports placeholders for dynamic help text (e.g., `This field depends on $(fieldname)`).
          - name: icon
            type: string
            group: visualization
            allowed: Free fontawesome 6 icon
            short: Field icon
            description: |
              Some formfields can hold a nice looking icon.  The icon name is a free fontawesome 6 icon.
              You can find more information at [www.fontawesome.com](https://www.fontawesome.com)
            with_types: text, number, expression, password, enum, file
          - name: group
            type: string
            group: visualization
            allowed: Free text
            short: The field group name
            description: | 
              With this attribute you can group fields together.  
              When all fields in a group are hidden (due to dependencies), the group is also hidden.
          - name: line
            type: string
            version: 4.0.3
            group: visualization
            allowed: Free text
            short: The field line name
            description: | 
              With this attribute you can group fields in a single line together.  
              Use together with the `width` parameter to set the width, if not, the width is auto.  
          - name: width
            type: string
            version: 4.0.3
            group: visualization
            allowed: A valid Bootstrap Column width
            short: The field width
            description: | 
              With this attribute you can set the width of a field.  
              Use together wit the `line` parameter to put fields on 1 line.  see [https://getbootstrap.com/](https://getbootstrap.com/)
            choices:
              - name: col-1
              - name: col-2
              - name: col-3
              - name: col-4
              - name: col-5
              - name: col-6
              - name: col-7
              - name: col-8
              - name: col-9
              - name: col-10
              - name: col-11
              - name: col-12
            examples:
            - name: Name and lastname
              code: |
                - type: text
                  name: name
                  label: Firstname
                  group: login
                  line: names
                - type: text
                  name: lastname
                  label: Lastname
                  group: login
                  line: names
          - name: dependencyFn
            type: string
            version: 4.0.0
            group: interaction
            choices:
              - name: and
                description: Uses the logical `and` operand to evaluate multiple dependencies
              - name: or
                description: Uses the logical `and` operand to evaluate multiple dependencies
            short: The dependency logical function
            default: and
            description: This attribute represents the logical function between multiple dependencies.
          - name: dependencies
            type: list / elements=object
            group: interaction
            allowed: Reference to other formfields and their values
            short: Show/hide this field based on the values or other fields
            description: |
              Each dependency element is either an object with the following 2 attributes:
              * `name` : holds the fieldname.
              * `values` : a list of valid values for the referenced field.

              Or with the following 2 attributes:  
              * `name` : holds the fieldname.
              * `isValid` : a boolean to check if the referenced is validated or not.
                
              Use in combination with attribute `dependencyFn`.
            changelog:
              - version: 4.0.0
                type: added
                description: Add an exlamation mark `!` before the referencing field's name, to invert the match.  Wrap it in quotes because the `!` mark has special meaning in YAML.
              - version: 4.0.13
                type: added
                description: Add a new way of dependency.  Use `isValid` property to show/hide a field.
            examples:
              - name: Show a field based on a checkbox
                code: |
                  - name: add_extra_comment
                    label: Add extra comment ?
                    type: checkbox
                  - name: extra_comment
                    type: text
                    label: Type your extra comment
                    dependencies:
                    - name: add_extra_comment
                      values:
                      - true
              - name: Show a field if another field is valid
                code: |
                  - name: code
                    type: text
                    regex: 
                      expression: "^[a-z]{3}$"
                      description: Must be 3 characters lowercase
                    required: true
                  - name: code_uppercase
                    type: expression
                    runLocal: true
                    expression: "'$(code)'.toUpperCase()"
                    dependencies:
                    - name: code
                      isValid: true     # new in 4.0.13 -> code_uppercase will only be shown if code is validated
              - name: Show a field based on 2 fields, using the 'or' function
                code: |
                  - name: job_type
                    label: Job type
                    type: enum
                    values:
                    - IT
                    - HR
                    - Sales
                    - Management
                  - name: has_private_office
                    type: checkbox
                    label: Has private office ?
                  - name: office_name
                    type: text
                    label: What's the name of the office
                    dependencyFn: or
                    dependencies:
                    - name: job_type
                      values:
                      - Sales
                      - Management
                    - name: has_private_office
                      values:
                      - true
                  - name: office_name2
                    type: text
                    label: What's the name of the office
                    dependencyFn: or
                    dependencies:
                    - name: "!job_type"     # this will invert/negate - note the wrapping quotes!! needed for valid yaml
                      values:
                      - IT
                      - HR
                    - name: has_private_office
                      values:
                      - true                      
          - name: keydown
            type: boolean
            group: interaction
            short: Enable responsiveness
            default: false
            version: 2.2.0
            description: |
              Enable instant responsiveness whilst typing.  
              Can be important to re-evaluate expressions at every keystroke.
            with_types: text, password
          - name: noLog
            type: boolean
            group: security
            default: false
            short: Disable backend logging
            version: 2.2.3
            description: |
              Disables logging in the backend, to hide passwords for example.
            examples:
            - name: hide password in log
              code: |
                - name: password
                  type: password
                  label: Enter password
                  noLog: true
          - name: multiple
            type: boolean
            default: false
            short: Enable multi select
            description: |
              Enable multiple select with dropdown boxes.
            with_types: enum
          - name: values
            type: array
            group: data
            short: A list of values
            description: |
              To manually populate an enum field
            with_types: enum
            examples:
            - name: list of cities
              code: |
                - name: cities
                  type: enum
                  values:
                  - Rome
                  - Paris
                - name: cities2
                  type: enum
                  values:
                  - name: Rome
                    short: RO
                  - name: Paris
                    short: PA
                - name: your_choice
                  type: local
                  expression: "'You chose $(cities2.name) or just short $(cities2.short)'"
          - name: value
            type: any
            group: data
            short: A fixed value (any type) for the expression
            description: |
              To manually populate an expression field (dictionary, array, number, boolean, string).  
              runLocal will be ignored.  
            with_types: expression
            version: 4.0.17
            examples:
            - name: list of cities
              code: |
                - name: cities
                  type: expression
                  value:
                  - Rome
                  - Paris
            - name: custom object
              code: |
                - name: myObject
                  type: expression
                  value:
                    foo: bar
                    ping: pong
          - name: default
            type: many
            group: data
            short: Default value
            description: |
              The type of the value depends on the field type.  
              Can be `string`,`boolean`, `number`, `array` or `object`.
              When using `multiple`, the default must be an `array`.  
              When using an `enum` field, you can use the following special values :
              * `__auto__` : select the first
              * `__none__` : select none
              * `__all__` : select all (if multiple is true)
              
              For `yaml` fields, the default can be any valid YAML structure (object or array).
              For `list` fields, the default must be an array of objects matching the referenced subform's fields. Use it to pre-populate the list with existing rows on form load.
            changelog:
              - version: 6.2.0
                type: added
                description: "`list` fields now support `default` for pre-populating rows from a static array."
              - version: 6.1.5
                type: changed
                description: Table and YAML fields now support default values for pre-populating initial data.
              - version: 4.0.5
                type: added
                description: A default can now hold placeholders like `$(other_field)`, and together with `evalDefault` be evaluated as javascript.           
            with_types: text, textarea, number, expression, password, enum, radio, checkbox, datetime, yaml, list
          - name: evalDefault
            type: boolean
            group: data
            default: false
            short: Evaluates default value
            description: A default can be treated as javascript and can thus hold expressions like `'$(other_field)'.toUpperCase()` or `Math.PI` or `Date.getDate.toISOString()`
            version: 4.0.5
            with_types: text, textarea, number, expression, password, enum, radio, checkbox, datetime
          - name: switch
            type: boolean
            group: visualization
            default: false
            short: Show checkbox as switch
            description: A checkbox can be shown as a switch, enabling a more modern look.
            version: 4.0.5
            with_types: checkbox
          - name: required
            type: boolean
            group: validation
            default: false
            short: Required field
            description: |
              Makes the field required.
          - name: minLength
            type: number
            group: validation
            allowed: Integer > 0
            short: Field minimum length
            description: |
              Forces a string-field to be at least x long.
              
              **Since 6.0.3:** Supports placeholders for dynamic validation (e.g., `minLength: "$(minPasswordLength)"`).
            with_types: text, expression, password
          - name: maxLength
            allowed: Integer > 0
            type: number
            group: validation
            short: Field maximum length
            description: |
              Forces a string-field to be maximum x long.
              
              **Since 6.0.3:** Supports placeholders for dynamic validation (e.g., `maxLength: "$(maxPasswordLength)"`).
            with_types: text, expression, password
          - name: minValue
            allowed: Integer
            group: validation
            type: number
            short: Field minimum value
            description: |
              Forces a number-field to not be lower than...
              
              **Since 6.0.3:** Supports placeholders for dynamic validation (e.g., `minValue: "$(minThreshold)"`).
            with_types: number
          - name: maxValue
            allowed: Integer
            group: validation
            type: number
            short: Field maximum value
            description: |
              Forces a number-field to not be higher than...
              
              **Since 6.0.3:** Supports placeholders for dynamic validation (e.g., `maxValue: "$(maxThreshold)"`).
            with_types: number
          - name: minSize
            allowed: Integer
            group: validation
            type: number
            short: File minimum size
            description: |
              Forces a file-fields size to not be lower than...
              
              **Since 6.0.3:** Supports placeholders for dynamic validation (e.g., `minSize: "$(minFileSize)"`).
            with_types: file
          - name: maxSize
            allowed: Integer
            group: validation
            type: number
            short: File maximum size
            description: |
              Forces a file-fields size to not be higher than...
              
              **Since 6.0.3:** Supports placeholders for dynamic validation (e.g., `maxSize: "$(maxUploadSize)"`).
            with_types: file            
          - name: accept
            type: array
            group: validation
            allowed: File extensions or MIME types
            with_types: file
            short: File types the picker offers
            description: |
              The file types the file picker offers, as extensions (`.pdf`) or MIME types (`image/*`).  
              It only filters the picker : a user can still choose another file. To refuse it, add a `regex` on the file name.
            examples:
            - name: Only pdf files
              code: |
                - name: report
                  type: file
                  accept:
                    - .pdf
                  regex:
                    expression: 'pdf$'
                    description: You can only upload pdf files
          - name: regex
            type: object
            group: validation
            short: A regular expression validation
            description: |
              Enforces a validation where the current field must match a regular expression.
              This field requires an object with 2 attributes:
              * `expression` : The regular expression
              * `description` : A validation message to show when the regex is not matched. (**Since 6.0.3:** Supports placeholders for dynamic messages)
            with_types: text, expression, password, datetime, file
            examples:
            - name: Validate email address
              code: |
                regex:
                  expression: '[a-z0-9]+@[a-z]+\.[a-z]{2,3}'
                  description: Please type a valid email address
            - name: Strong password
              code: |
                regex:
                  expression: '(?=^.{8,}$)(?=.*\d)(?=.*[!@#$%^&*]+)(?![.\n])(?=.*[A-Z])(?=.*[a-z]).*$'
                  description: Must be complex (8 or longer ; uppercase ; lowercase ; numeric ; specials)
            - name: Only pdf files
              code: |
                type: file
                regex:
                  expression: "pdf$"
                  description: You can only upload pdf files           
          - name: notIn
            type: object
            group: validation
            short: A list validation (can not be in list)
            version: 2.2.4
            description: |
              Enforces a validation where the current field can not be one of the values in a list (referencing another field).
              This field requires an object with 2 attributes:
              * `field` : The name of the field that holds the list
              * `description` : A validation message to show when the validation is not met. (**Since 5.0.1:** Supports placeholders for dynamic messages)
            with_types: text, expression, password, datetime
            examples:
            - name: Check if ip exists
              code: |
                notIn:
                  field: list_of_ips  # list_of_ips is an other expression array field
                  description: This ip already exists            
          - name: in
            type: object
            group: validation
            version: 2.2.4
            short: A list validation (must be in list)
            description: |
              Enforces a validation where the current field must be one of the values in a list (referencing another field).
              This field requires an object with 2 attributes:
              * `field` : The name of the field that holds the list
              * `description` : A validation message to show when the validation is not met. (**Since 5.0.1:** Supports placeholders for dynamic messages)
            with_types: text, expression, password, datetime
            examples:
            - name: Check if ip is in range
              code: |
                in:
                  field: range_of_ips   # range_of_ips is an other expression array field
                  description: This ip must be in the specified range              
          - name: validIf
            type: object
            group: validation
            version: 2.2.4
            short: An field based validation (field must be true)
            description: |
              Enforces a validation where a referencing (expression) field must be true.
              This field requires an object with 2 attributes:
              * `field` : The name of the referencing field
              * `description` : A validation message to show when the validation is not met. (**Since 5.0.1:** Supports placeholders for dynamic messages)
            examples:
            - name: Ip must be pingable
              code: |
                validIf:
                  field: rest_api_ping_test  # an other expression field that is returning true or false
                  description: The ip is not pingable            
          - name: validIfNot
            type: object
            group: validation
            version: 2.2.4
            short: An field based validation (field must be false)
            description: |
              Enforces a validation where a referencing (expression) field must be false.
              This field requires an object with 2 attributes:
              * `field` : The name of the referencing field
              * `description` : A validation message to show when the validation is not met. (**Since 5.0.1:** Supports placeholders for dynamic messages)
            examples:
            - name: Check if powered off
              code: |
                validIfNot:
                  field: rest_api_ping_test  # an other expression field that is returning true or false
                  description: The ip is still pingable, shut down the machine first                    
          - name: sameAs
            type: string
            group: validation
            short: An field based validation (field must be same as other field)
            allowed: The name of another existing field
            description: |
              Enables a validation where the value of this field must match the value of another field.
              Perfect for password entry, for example.
            with_types: text, expression, password
            examples:
            - name: Password doublecheck
              code: |
                - name: password
                  type: password
                  label: Enter password
                - name: password2
                  type: password
                  label: Enter password again
                  sameAs: password
                  output: false
          - name: ignoreIncomplete
            type: boolean
            default: false
            short: Allow form submit on non-evaluated placeholders
            group: validation
            description: |
              When an expression-based field has placeholders,  
              the default form behaviour is not to allow form submit until all placeholders are resolved.
              When this attribute is true, the form does not wait for placeholder completion for this field.
            with_type: expression, enum
          - name: output
            type: boolean
            default: true
            group: output
            version: 6.2.0
            short: Include field value as extravar
            description: |
              Form fields are by default sent as extravars.  
              Set to `false` to exclude a field from the extravar output.

          - name: model
            type: string or array
            group: output
            allowed: An dot-based string notation of an object, or an array of these
            short: Extravar modelling
            description: |
              By default, a field is sent as a root-extravar.  
              If you want model the output of the extravars, 
              you can specify a `dot-notation` of how this field should be modelled.  
            changelog:
              - version: 4.0.9
                type: added
                description: model can now be an array
              - version: 5.0.1
                type: added
                description: you can now model arrays
            examples:
              - name: Model 2 fields together as a single object
                code: |
                  - name: diskName
                    type: text
                    model: disk[0].name
                  - name: diskSize
                    type: number
                    model: disk[0].size
                  # the extravars of this example will be like this :
                  # disk:
                  # - name: mydisk
                  #   size: 123
          - name: asCredential
            type: boolean
            default: false
            group: output
            short: Send credential as extravar
            description: |
              Use the value of this field to search for a credential with the same name  
              and send that credential (with user and password) hidden to the playbook as extravar.  

              Since 4.0.16, you can use this in combination with the `credentials` form-property.
            with_types: text, password, enum, expression
            examples:
              - name: Search and send the credential named 'vcenter'
                code: |
                  - name: vcenter_creds
                    type: expression
                    expression: "'vcenter'"
                    asCredential: true
                  - name: vcenter_creds2
                    type: credential    # alias for cleaner code
                    expression: "'vcenter'"

                  # in the backend following will happen :
                  # - lookup credential call 'vcenter'
                  # - inject credential details in extravars as 'vcenter_creds'

                  # the extravars will now contain something like this :
                  # vcenter_creds:
                  #   user: admin
                  #   password: T0pS3cr#t!
                  #   host: vcenter1.domain.local
                  #   port: 443
          - name: outputObject
            type: boolean
            default: false
            group: output
            short: Output the selection of a enum-field as a full object.
            description: |
              When selecting from an `enum`-field (dropdown), either the first column or  
              the column defined in `valueColumn` is sent as an extravar.  
              If you want the full selected record, use the property.  
  
              **New in v4.0.20** : valueColumn: "*" has the same behavior, and will output all columns
            with_types: enum
          - name: expression
            type: string
            group: data
            allowed: Valid javascript
            short: A javascript expression.
            description: |
                By default this javascript is evaluated on the server side and limited to predefined functions (for security).
                However in combination with `runLocal`, the evaluation is ran in the browsers sandbox and allows the full javascript power.
                When used in an `enum` field, the expression must return a flat array or array of flat objects, to make it presentable in a dropdown box.  
                An expression supports placeholders.  Read more about placeholders here. [TODO]
                Click here to find out more about the predefined functions. [TODO]  
                  
                **tip** : use the alias `local` (type='expression',runLocal=true,hide=true,output=false)  
                **tip** : use the alias `local_out` (type='expression',runLocal=true,hide=true)  
                **tip** : use the alias `credential` (type='expression',runLocal=true,hide=true,asCredential=true)  
            with_types: enum, expression, html, yaml, list
            examples:
              - name: Get a list of users from a rest api
                code: |
                  - name: users
                    type: enum
                    expression: fn.fnRestBasic('get','http://myapi/user','','credential_name')
              - name: Filter and sort an array of objects
                code: |
                  - name: superheros
                    type: enum
                    expression: |
                      fnArray.from($(mylist))
                      .filterBy({has_ability:true})
                      .selectAttr('name','ability')
                      .sortBy('name')"
                    runLocal: true
              - name: Make a numbered list
                code: |
                  - name: numbers
                    type: enum
                    expression: "Array.from({length: 10}, (_, i) => i + 1)"
                    runLocal: true
              - name: Use the alias `local`
                code: |
                  - name: uppercase
                    type: local
                    expression: "'test'.toUpperCase()"
                    # with type local, these are the defaults :
                    # runLocal: true
                    # hide: true
                    # output: false
              - name: Use the alias `local_out`
                code: |
                  - name: uppercase
                    type: local_out
                    expression: "'test'.toUpperCase()"
                    # with type local_out, these are the defaults :
                    # runLocal: true
                    # hide: true
          - name: runLocal
            type: boolean
            group: data
            default: false
            with_types: enum, expression, yaml, list
            short: Run an expression locally
            description: |
              When running expressions, by default they are run remotely on the server.  
              But remote expressions are limited to predefined functions.  
              To unleash more javascript power, use this property.  
              The code will be evaluated in the sandbox of the browser, offloading the server, saving api-calls and making it more secure.         
          - name: refresh
            type: boolean|string
            default: false
            group: data
            with_types: enum, expression
            short: Allow a manual or auto refresh
            description: |
              A query or expression is by default run once (if it doesn't contain any dependencies).  
              Sometimes a refresh would be handy.  
              Set this property to `true` to allow a refresh, or set `5s` for example to allow auto refresh.
          - name: isHtml
            type: boolean
            group: visualization
            default: false
            with_types: expression
            short: Renders text as html
            description: |
              If an expression value has html tags (for example <b></b>), it will render the value as such.
              The html is sanitized before it is rendered : `<script>`, event handlers (`onclick`, `onerror`, ...) and `javascript:` links are always removed.
              A link may carry `target="_blank"` to open in a new tab ; `rel="noopener noreferrer"` is added automatically.
            examples:
            - name: Show bold in an expression
              code: |
                - name: feedback
                  type: expression
                  expression: "'<b style=\"color:red\">Error</b>'"
                  isHtml: true
          - name: hide
            type: boolean
            group: visualization
            default: false
            with_types: expression
            short: Hides an expression field
            description: |
              Set to `true` if you want your expression hidden.
          - name: editable
            type: boolean
            group: data
            default: false
            with_types: expression
            short: Makes an expression editable
            description: |
              An expression is by default readonly.  
              By setting this property, you can flip the expression field to a regular text field.
          - name: dbConfig
            type: string, array or object
            group: data
            with_types: enum, expression, yaml, list
            short: A database connection 
            description: |
              When you want to query data from a database, you will need the proper connection information.  
              We use a credential name to lookup the connection details.  Legacy was to pass an object (name and type).  
              Since version 5.0.2 you can just specify the name of the credential.  The type is fetched from the credential itself (mysql, mssql, postgres, oracle or mongodb). 
              In case of no type set, mysql is assumed.   
              Additionally you can set an array of credential names, to use multiple databases with a single query.  The result will be a join of the results.  
              Doubles will not be removed automatically.  
            examples:
            - name: get information from a mysql database (legacy example - deprecated)
              code: |
                # Old style (deprecated) - type was required separately:
                - name: cities
                  type: enum
                  dbConfig:
                    name: CMDB_CONN
                    type: mysql
                  query: select name, country from cities
                # New style - just use the credential name:
                - name: cities
                  type: enum
                  dbConfig: CMDB_CONN
                  query: select name, country from cities
            - name: get information from a mysql database (new example)
              code: |
                - name: cities
                  type: enum
                  dbConfig: CMDB_CONN # type is derived from the credential
                  query: select name, country from cities     
            - name: get information from a mysql database (array example)
              code: |
                - name: cities
                  type: enum
                  dbConfig: # the query will be a union of the results of the 2 databases
                  - CMDB_CONN1
                  - CMDB_CONN2
                  query: select name, country from cities                                  
            - name: get information from a mongodb
              code: |
                - name: user
                  type: expression
                  dbConfig: USER_DB_CONN
                  query: cmdb~users~{"name":"ansibleguy"}
                  # the query in mongodb has 3 parts, separated by ~  
                  # database, collection and the query in valid json
          - name: query
            type: string
            group: data
            allowed: A valid sql query
            with_types: expression, enum, yaml, list
            short: The query to select data from a database
            description: |
              This is typically a classic SELECT statement.  
              However, in the case of mongodb, the query is slightly different.  See the examples.  
              An expression supports placeholders.  Read more about placeholders here. [TODO]
            examples:
            - name: get information from a mysql database
              code: |
                - name: cities
                  type: enum
                  dbConfig: CMDB_CONN
                  query: select name, country from cities
            - name: get information from a mongodb
              code: |
                - name: user
                  type: expression
                  dbConfig: USER_DB_CONN
                  query: cmdb~users~{"name":"ansibleguy"}
                  # the query in mongodb has 3 parts, separated by ~  
                  # database, collection and the query in valid json    
          - name: jq
            type: string
            group: data
            version: 6.1.4
            allowed: A valid jq expression
            with_types: expression, enum
            short: Transform database query results with jq
            description: |
              Apply a jq expression to transform the result of a `query`+`dbConfig` or a remote `expression`.  
              jq is a post-processor applied server-side, after that remote call returns, to filter, map or reshape the result.  
              It only runs for remote calls : a local expression (`runLocal: true`) is evaluated in the browser and never reaches the server, so `jq` is ignored there.
            examples:
            - name: extract specific fields from query result
              code: |
                - name: usernames
                  type: enum
                  dbConfig: CMDB_CONN
                  query: select id, name, email from users
                  jq: .[0].name   # return the first item's name
          - name: multiple
            type: boolean
            group: data
            default: false
            with_types: enum
            short: Allow multiple selection
            description: |
              When you want to select multiple items from a dropdown box, set this property to true.  `horizontal: true` will automatically trigger multiple.
          - name: sticky
            type: boolean
            group: visualization
            default: false
            with_types: enum
            short: Make a dropdown box permanently visible
            description: |
              A `enum` field is by default a dropdown box.  However, you can change that behavior by setting this property.  
              The dropbox looses it reactivity and becomes a fixed table.
          - name: horizontal
            type: boolean
            group: visualization
            version: 4.0.3
            default: false
            with_types: enum
            short: Converts a dropdown box to a horizontal selector
            description: |
              A `enum` field is by default a dropdown box.  However, you can change that behavior by setting this property.  
              The unselected values are on the left and the selected values on the right.  This works in combiniation with sticky.  
              PctColumns are disabled, due to the space it consumes horizontally.
          - name: titleAdd
            type: string
            group: visualization
            with_types: list
            short: Title shown in the subform pane when adding a new row
            description: |
              When you add a row through a `list` field, the subform pane shows `Add <label>` as subtitle.  
              Use this property to override the subtitle (e.g. `Add address`).
          - name: titleEdit
            type: string
            group: visualization
            with_types: list
            short: Title shown in the subform pane when editing an existing row
            description: |
              When you edit a row through a `list` field, the subform pane shows `Edit <label>` as subtitle.  
              Use this property to override the subtitle (e.g. `Edit address`).
          - name: subform
            type: string
            required: true
            group: basic
            with_types: list, yaml
            short: Name of the subform that defines one row
            description: |
              For a `list` field: delegates the per-row editor to a **subform**.  
              For a `yaml` field: the value is a single object edited via a **subform** drilldown instead of a raw YAML editor.  
              Set this property to the `name` of a top-level form of type `subform` declared in the same forms file (or in any loaded forms file).  
              The same subform can be referenced by multiple fields, enabling reuse (e.g. a single `Address` subform shared across several forms).
          - name: columns
            type: array
            group: visualization
            with_types: enum, list
            short: The list of columns visible in the dropdown/table
            description: |
              For an `enum` field: all properties are shown by default. Use this property to choose which columns are visible in the dropdown.  
              For a `list` field: all scalar subform fields are shown by default. Use this property to pick which subform fields render as columns in the list table (missing names soft-fail and render as empty columns).
            examples:
            - name: Show only wanted columns
              code: |
                - name: users
                  type: enum
                  dbConfig: CMDB
                  query: SELECT id, name, username, zip, city FROM users
                  columns:
                  - name
                  - username
          - name: pctColumns
            type: array
            group: visualization
            with_types: enum
            short: The list of columns that should visualized as a percentage-bar
            description: |
              By default all properties are show with its regular value.  
              With a percentage it can be nice to visualize it as a graphical bar.  
              The assumption is that the value is an integer between 0 and 100.
            examples:
            - name: Show usage
              code: |
                - name: volumes
                  type: enum
                  dbConfig: CMDB
                  query: SELECT id, name, used, total, (used/total*100) as used_pct FROM volumes
                  columns:
                  - name
                  - used_pct
                  pctColumns:
                  - used_pct
          - name: filterColumns
            type: array
            group: interaction
            with_types: enum
            short: The list of columns that you can filter on
            description: |
              By default the `previewColumn` or first visible column is used to filter on.  
              With this property you can filter on the columns you want.
            examples:
            - name: Show usage
              code: |
                - name: volumes
                  type: enum
                  dbConfig: CMDB
                  query: SELECT id, name, title FROM volumes
                  columns:
                  - name
                  - title
                  filterColumns:
                  - name
                  - title                  
          - name: valueColumn
            type: string
            group: data
            default: first column
            with_types: enum
            short: The column of a selected item that needs to exported as extravar
            description: |
              When you select an item in an `enum` field, by default the first column is used to send as extravar.  
              By setting this property, you can change it to another field.  
              This setting is ignored when `outputObject` is true.  

              **new in v4.0.20** : setting valueColumn to "*" will export all columns
            examples:
            - name: Export name
              code: |
                - name: users
                  type: enum
                  dbConfig: CMDB
                  query: SELECT name, username FROM users
                  columns:
                  - name
                  valueColumn: username
          - name: placeholderColumn
            type: string
            group: data
            with_types: enum
            default: first column
            short: The column of a selected item that is used in a placeholder
            description: |
              When you select an item in an `enum` field and later on you use this field as a placeholder, 
              by default the first column is used as a value.  
              By setting this property you change the column to be used.  
              **NOTE** : this property is somewhat out-of-date since the introduction of the dot-notation.  
              See examples below.  
                
              **New in v4.0.20** : setting placeholderColumn to "*" will output the entire record, instead of a single column.
            examples:
            - name: Export name
              code: |
                - name: user
                  type: enum
                  dbConfig: CMDB
                  query: SELECT name, id FROM users
                  columns:
                  - name
                  placeholderColumn: id
                - name: computername
                  type: expression
                  dbConfig: CMDB
                  query: SELECT name FROM computers where user_id=$(user)
                - name: computername_2nd_example
                  type: expression
                  dbConfig: CMDB
                  query: SELECT name FROM computers where user_id=$(user.id)      
                  # this example is better readable 
                  # and removes the need of the placeholderColumn property
          - name: previewColumn
            type: string
            group: visualization
            default: first column
            with_types: enum
            short: The column of the selected item(s) that is shown in the dropdown-preview
            description: |
              When you select an item in an `enum` field, by default the first column is used as a preview.  
              By setting this property you change the column to be used.  
            examples:
            - name: Export name
              code: |
                - name: user
                  type: enum
                  dbConfig: CMDB
                  query: SELECT id,name FROM users
                  previewColumn: name
          - name: allowInsert
            type: boolean
            group: interaction
            with_types: list
            default: true
            short: Allow table/list insert
            description: |
              A table or list can be used to modify existing data.  If new data is not allowed, set this property to false.  
          - name: allowDelete
            type: boolean
            group: interaction
            default: true
            with_types: list
            short: Allow table/list delete
            description: |
              A table can be used to modify existing data.  If you don't was recoreds to be deleted, set this property to false.
          - name: deleteMarker
            type: string
            group: output
            with_types: list
            short: Adds an additional deletemarker field
            description: |
              When you remove a record in a table, it gets removed.  
              When working with ansible and idempotency, the playbook never knew it got removed.  
              You need to explicitly set the status to `absent`.  
              So you can add a custom property to the deleted record, 
              marking the record as deleted and sending it to the playbook for removal.   

              **Since 6.4.1** the markers of a `list` field reach the playbook as well : a
              removed row is sent with its delete marker instead of looking like a live row.
              Before, a list row only carried a marker when its subform declared it as a
              (hidden) field. When rows can be deleted or updated but no
              `insertMarker` is set, new rows are marked `__inserted__`.
            examples:
            - name: Mark delete record
              code: |
                - type: list
                  name: member
                  subform: Member       # a form of type subform with the fields firstname and lastname
                  expression: "[{firstname:'ansible',lastname:'guy'}]"
                  deleteMarker: deleted
          - name: insertMarker
            type: string
            group: output
            with_types: list
            short: Adds an additional insertmarker field
            description: |
              When you add a record in a table, it simply gets added.  
              When working with ansible and idempotency, your playbook doesn't know which records are new and which are not.  
              You might want to explicitly run a taks on only the new records.   
              So you can add a custom property to the inserted record, marking the record as new.   
            examples:
            - name: Mark new record
              code: |
                - type: list
                  name: member
                  subform: Member       # a form of type subform with the fields firstname and lastname
                  expression: "[{firstname:'ansible',lastname:'guy'}]"
                  insertMarker: new
          - name: updateMarker
            type: string
            group: output
            with_types: list
            short: Adds an additional updatemarker field
            version: 5.1.0
            description: |
              In addition to the insert and delete markers, you can also add an update marker.
            examples:
            - name: Mark updated record
              code: |
                - type: list
                  name: member
                  subform: Member       # a form of type subform with the fields firstname and lastname
                  expression: "[{firstname:'ansible',lastname:'guy'}]"
                  updateMarker: updated
          - name: showLoadButton
            type: boolean
            group: interaction
            with_types: list, yaml
            default: false
            version: 6.1.5
            short: Show load button for file import
            description: |
              Enables a "Load YAML" button that allows users to import data from .yml or .yaml files.
              For list fields, the YAML file must contain a valid array of objects.
              For yaml fields, the file can contain any valid YAML structure.
              Single objects are automatically wrapped in arrays for list fields.
            examples:
            - name: List with YAML import
              code: |
                - type: list
                  name: users
                  label: Users
                  subform: User         # a form of type subform with the fields username and email
                  showLoadButton: true
                  showDownloadButton: true
            - name: YAML field with file import
              code: |
                - type: yaml
                  name: config
                  label: Configuration
                  showLoadButton: true
                  showDownloadButton: true
                  default:
                    key: value
          - name: showDownloadButton
            type: boolean
            group: interaction
            with_types: list, yaml
            default: false
            version: 6.1.5
            short: Show download button for file export
            description: |
              Enables a "Download" button that exports the field content as a .yml file.
              The filename is automatically generated from the field name.
          - name: yamlError
            type: object
            group: validation
            with_types: yaml
            version: 6.1.5
            short: Custom YAML validation error message
            description: |
              Allows you to customize the error message displayed when YAML syntax validation fails.
              The yamlError object requires a `description` property containing the custom message.
              Supports placeholders for dynamic error messages.
            examples:
            - name: Custom YAML error
              code: |
                - type: yaml
                  name: config
                  label: Configuration
                  yamlError:
                    description: "Please enter valid YAML configuration (key-value pairs required)"
          - name: readonly
            type: boolean
            group: interaction
            with_types: yaml
            default: false
            version: 6.1.5
            short: Display YAML in readonly mode
            description: |
              When set to true, displays the YAML content with syntax highlighting in a non-editable card.
              Useful for showing computed or retrieved YAML data without allowing modifications.
              The field uses v-highlightjs for pretty syntax-highlighted display.
            examples:
            - name: Readonly YAML from expression
              code: |
                - type: yaml
                  name: server_config
                  label: Server Configuration
                  readonly: true
                  expression: fn.getServerConfig()
                  showDownloadButton: true              
        - name: Approval point
          itemName: attribute
          link: forms/form/approval
          icon: fas,clipboard-check
          description: |
            When you want to pause a job and ask for approval first.  You can insert an approval point using the approval-object attributes
          items:
          - name: title
            type: string
            required: true
            allowed: Free text with placeholders
            short: Approval message title
            description: | 
              The approval point consists out of a title and message.  This is the title attribute.  
              **Note**: This supports placeholders (the placeholders point to extravars)
          - name: message
            type: string
            required: true
            allowed: Free text with placeholders
            short: Approval message
            description: | 
              The approval point consists out of a title and message.  This is the message attribute.  
              **Note**: This supports placeholders (the placeholders point to extravars)      
          - name: roles
            type: array
            required: true
            allowed: a valid role
            short: The approver roles
            description: | 
              Every role in this list will have the power to approve or reject this job.     
          - name: notifications
            type: array
            required: true
            allowed: a valid email address
            short: The approval recipients
            description: | 
              Every email-address in this list will receive the approval message by email with the approval link.
          examples: 
          - name: Remove host
            language: YAML
            code: |
              approval:
                title: Remove host $(vm.name) ?
                message: |
                  You are about to remove vm $(vm.name).<br>
                  Esx server : $(cluster.esxhost.name)<br>
                  Status : $(vm.status)<br>
                  Change request : $(cr.id)
                roles:
                - approvers
                - vmwareadmin
                notifications:
                - vmware@domain.local
                - approvers@domain.local      
        - name: Notifications
          itemName: attribute
          link: forms/form/notifications
          icon: fas,envelope
          description: |
            When you want to send an email on job-event<br>
            <br>
            **Email Templates**<br>
            Notification emails use HTML templates located in `server/templates/email/`:<br>
            - `approval.html` - Approval request notifications<br>
            - `jobstatus.html` - Job outcome notifications (success, failed, aborted, warning)<br>
            - `jobevent.html` - Job lifecycle event notifications (launch, relaunch, delete, approve, reject)<br>
            <br>
            These templates can be customized by replacing them with your own versions.<br>
            In Docker or Kubernetes deployments, mount your custom templates to `/app/dist/templates/email/` to override the defaults.<br>
            Example Docker mount: `-v /path/to/custom/templates:/app/dist/templates/email/`<br>
            A mount at the former location, `/app/dist/src/templates/`, keeps working and takes precedence.
          items:
          - name: recipients
            type: array
            required: true
            allowed: email address
            short: Recipients
            description: | 
              A list of email addresses who need to receive a notification
          - name: onStatus
            type: array
            required: false
            choices:
            - name: any
              description: Always sends a notification 
            - name: success
              description: Sends a notification on job success
            - name: failed
              description: Sends a notification on job failure
            - name: aborted
              description: Sends a notification on job aborted
            - name: warning
              description: Sends a notification on job warning
            short: Jobstatus event
            description: | 
              A list of jobstatus events you want to send a notification on.  Use `any`, if you always want a notification.<br>
              At least one of `onStatus` or `onEvent` must be specified for notifications to be sent.
          - name: onEvent
            type: array
            required: false
            choices:
            - name: any
              description: Always sends a notification for any job event
            - name: launch
              description: Job is launched (initially created)
            - name: relaunch
              description: Job is relaunched (restarted)
            - name: delete
              description: Job is deleted
            - name: approve
              description: Job approval is granted
            - name: reject
              description: Job approval is rejected
            short: Job trigger events
            description: |
              A list of job lifecycle events (triggers) you want to send a notification on.<br>
              Unlike `onStatus` which notifies on job outcomes, `onEvent` notifies on user actions and job lifecycle events.<br>
              Use `any` to be notified of all job events.
          examples: 
          - name: Send a notification on failed
            language: YAML
            code: |
              notifications:
                recipients:
                  - info@ansibleguy.com
                onStatus:
                  - failed
          - name: Send notifications on job events (launch, relaunch, approve, reject)
            language: YAML
            code: |
              notifications:
                recipients:
                  - admin@ansibleguy.com
                  - auditor@ansibleguy.com
                onEvent:
                  - launch
                  - relaunch
                  - approve
                  - reject
          - name: Send notifications on all events
            language: YAML
            code: |
              notifications:
                recipients:
                  - admin@ansibleguy.com
                onStatus:
                  - any
                onEvent:
                  - launch
                  - relaunch
                  - delete
                  - approve
                  - reject
        - name: Job Status Action
          itemName: attribute
          link: forms/form/job-status-action
          icon: fas,bolt
          description: |
            Start a GUI action, triggered by a job status.  Such as `clear`, `hide`, `show`, ...
          items:
          - name: clear
            type: number
            allowed: integer >= 0
            short: Clear the form
            description: | 
              This action clears the form after x seconds.  
          - name: hide
            type: number
            allowed: integer >= 0
            short: Hide the form
            description: | 
              This action hides the form after x seconds.   
          - name: show
            type: number
            allowed: integer >= 0
            short: Show the form
            description: | 
              This action shows the form after x seconds.    
          - name: home
            type: number
            allowed: integer >= 0
            short: Go to Home
            description: | 
              This action navigates to the home page      
          - name: reload
            type: number
            allowed: integer >= 0
            short: Reload form
            description: | 
              This action reloads the form (and cleans the job output)  
          - name: load
            type: string
            allowed: number_of_seconds,name_of_form
            short: Load a form
            description: | 
              This action allows you to load another form.  

              **new in v4.0.20** : the previous jobid is sent as \_\_previous\_\_jobid\_\_.  
              You must make sure you have this field in your form, it will be populated with the previous jobid.  

              This is particularly interesting to grab information from the previous job (for example, load output, ...)                                          
          examples: 
          - name: Clear and hide on submit
            language: YAML
            code: |
              onSubmit:
                - clear: 0   # clear form after submit
                - hide: 2    # 2 seconds later, hide the form        
          - name: Go home on submit
            language: YAML
            code: |                
              onSubmit:
                - home: 0 
          - name: Load another form on success
            language: YAML
            code: |
              onSuccess:
                - load: 2,Another form   # load another form after success
          - name: Hide, Show and Home
            language: YAML
            code: |
              onSubmit:
                - hide: 0  # hide on submit
              onFailure: 
                - show: 0  # show if failed
              onSuccess:
                - home: 0  # go home if success
- name: Expressions
  icon: fas,code
  link: expressions
  description: |
    The `expression` formfield-attribute is so powerfull, more examples are important. 
    The expression attribute can be used on an :  
    - `enum` field, to fill the dropdown
    - `expression` field, to grab or maka any for of data
    - `list` field, to fill the rows

    This javascript is evaluated either on the server side (default) or on the client side using the field property `runLocal`

    [**On the server side**](/#/reference-guide/expressions/remote), the code is limited to pre-defined functions, mainly to get external data.  
    [**On the client side**](/#/reference-guide/expressions/local), the code is unlimited, yet some pre-defined filter and sorting functions are available to make life easier.
      
    **Security Concerns** : Since expressions are evaluated using javascripts eval function, there can be a concern for code injection.  Therefor, server side expressions are limited to predefined functions, no code injection is possible.  On the client side, the code is evaluated in the sandbox of the browser and can be considered safe.  
  help:
  - name: Local Expressions
    icon: far,circle-down
    link: expressions/local
    description: |
      The following example are assumed to run with the field property `runLocal` true.  
      They are ran in the sandbox of the browser and can leverage the full javascript engine.  
        
      **Tip** : use the type `local` as an alias for 'type=expression, runLocal=true, hide=true, output=false'  
      **Tip** : use the type `local_out` as an alias for 'type=expression, runLocal=true, hide=true'  
      **Tip** : use the type `credential` as an alias for 'type=expression, runLocal=true, hide=true, asCredential: true'  
    examples:
    - name: naming convention
      description: Use string manipulations to apply naming conventions
      code: | 
        '$(field1) $(field2)'.replace('-','_').toUpperCase()
    - name: calculation
      description: Use math to make calculations
      code: | 
        round($(field1)*$(field2)*Math.PI)   // Math.PI is native javascript
    - name: conversions
      description: Convert bytes to gigabytes
      code: | 
        ($(size_bytes)/1024/1024/1024).toFixed(2)  // toFixed is native javascript method
    - name: convert array of objects to html-table
      code: |
        fnToTable($(my_array_field),{
          tableClass = '',
          escapeHtml = true,
          emptyCell = '',
          includeHeader = true
        })

        // output : an html-table representation of the array of objects taken from another field called "my_array_field"
        // tip : add tableClass = 'table table-striped table-bordered' for bootstrap styling        
    - name: Get a name with incremental numbering
      description: |
        When working with auto numbering, you might want to find the next name in an array of stings that some numbering.   
        Also available as server side expression (prefixed with `fn.`)
      code: |
        fnGetNumberedName(['server001','server002','server005'],'server###','server001',false)
        // result : "server006"

        fnGetNumberedName(['server001','server002','server005'],'server###','server001',true)
        // result : "server003"

        fnGetNumberedName($(fieldlist),'server###','server001',true)
        // use another expression field as input for the array

        // fnGetNumberedName(array,pattern,default,fillgaps)
        // This function searches for a numbered pattern in a list of string, 
        // increases the highest number and returns a name like the pattern
        // - array : an array object, you can use a placeholder to an expression where you know it's an array
        // - pattern : a string that hold the # as a digit
        // - default : if no value is found, return this default
        // - fillgaps : a boolean to indicate it can fill gaps in the numbers, 1,2,3,6 => 4           
    - name: object-array manipulation
      description: |
        When working with object-arrays, you will want to control and manipulate that data.  
        Filtering, altering, sorting.  To make your life easy, Ansible Forms comes with a custom helper, to keep your code clean.
      code: |
          /* 
            fnArray.from($(your_array_field))                               // custom helper library
                .filterBy({property1:'value1'},{property2:'value2'}, ...}}  // filters the array by property value (* wildcards allowed)
                .regexBy({property1:'regex1'},{property2:'regex2'}, ...}}   // filters the array by property matched against regex
                .distinctBy('property1','property2', ...)                   // will make the array entries unique by property
                .selectAttr({prop1:'property1',prop2:'property2'})          // only selects a certain property, and you can relabel them
                .sortBy('property1','-property2', ...)                      // will order the array.  To have descending add a "-" (minus) before the property

            mylist:
            [
              {
                name:'Spiderman',
                has_ability: true,
                ability: 'Can do whatever a spider can'
              },
              {
                name:'Superman',
                has_ability: true,
                ability: 'Superstrong,Flying,Laserbeams'
              },     
              {
                name:'FamilyGuy',
                has_ability: false
              },    
              {
                name:'Wolverine',
                has_ability: true,
                ability: 'Enhanced healing'
              }                                                  
            ]
          */

          fnArray.from($(mylist))         // take data from another field 'mylist'
          .regexBy({name:'.*man$'})       // name must end with 'man'
          .filterBy({has_ability:true})   // must have abilities
          .selectAttr({name:'name',ability:'ability'})   // only take properties name and ability
          .sortBy('-name')                // sort by name descending

          /*
            result : 
            [
              {name:'Superman',ability:'Superstrong,Flying,Laserbeams'},
              {name:'Spiderman',ability:'Can do whatever a spider can'}
            ]
          */
    - name: object-array manipulation with vanilla javascript
      description: |
        You can still use all the vanilla javascript goodies to filter and alter you data.  
        Such as map, forEach, find, filter and reduce.
      code: |
          // source : https://medium.com/@jeff_long/understanding-foreach-map-filter-and-find-in-javascript-f91da93b9f2c

          mylist=
            [
              {
                name:'Bob',
                age: 5
              },
              {
                name:'Tom',
                age: 10
              },     
              {
                name:'Paul',
                age: 30
              },    
              {
                name:'Tom',
                age: 40
              }                                                  
            ]

          // simple filter
          $(mylist).filter((x) => x.age<=20) // filter age<=20
          /* result:
          [
            {name:'Bob',age:5},
            {name:'Tom',age:10}
          ]
          */

          // filter and addition
          $(mylist)
            .filter((x) => x.age<=20)   // filter age<=20
            .map((x) => { return {...x,diff:20-x.age} }) // add new property diff
          /* result:
          [
            {name:'Bob',age:5,diff:15},
            {name:'Tom',age:10,diff:10}
          ] 
          */

          // find
          $(mylist).find((x) => x.name=='Tom').age  // find age of first Tom
          // result: 10
          
          // make sum with reduce
          $(mylist).reduce((sum,x) => sum+x.age,0) // calculate sum of ages
          // result: 85

          // make temp function
          ((arr,min)=>{
            return arr
              .filter(x => x.age>=min)  // filter
              .map(x => {
                var preview=`${x.name} (${x.age})`; // make preview string
                return {...x,preview:preview} })    // add new preview property
          })($(mylist),20)                          // feed function with mylist and 20       
          /* result:
          [
            {name:'Paul',age:30,preview:'Paul (30)'},
            {name:'Tom',age:40,preview:'Tom (40)'}
          ] 
          */
  - name: Remote Expressions
    icon: fas,circle-right
    link: expressions/remote
    description: |
      The following examples are assumed to run with the field property `runLocal` false (=default).  
      They are evaluated on the server side.  
      Due to the danger of evaluating code server side, the expression is sanitized and limited to predefined functions that come with Ansible Forms.  
      Server side expressions are meant to grab information from various datasources, such as files and rest-api's.  
    examples:   
    - name: manipulate date and time
      code: |
        fn.fnTime().diff(fn.fnTime('2019-10-01'),'day') // number of days between now and 2019-10-01

        // This is the core implementation of https://day.js.org
    - name: get Cidr info from ip
      code: |
        fn.fnCidr('172.16.0.1','255.255.0.0')

        // fn.fnCidr(ip,netmask)
        // - ip : an ip address
        // - netmask : a netmask
        //  
        // it will return the Cidr subnet information as well as expose a `contains` method to check whether an ip is part of this subnet.
        // {
        //   "networkAddress":"172.16.0.0",
        //   "firstAddress":"172.16.0.1",
        //   "lastAddress":"172.16.255.254",
        //   "broadcastAddress":"172.16.255.255",
        //   "subnetMask":"255.255.0.0",
        //   "subnetMaskLength":16,
        //   "numHosts":65534,
        //   "length":65536,
        //   "contains":(ip)=>{return ...}
        // }
    - name: get SSH output
      code: |
        fn.fnSsh('root','172.16.0.1','ls -la')

        // fn.fnSsh(user,host,command,jq-expression)
        // - user : the ssh user
        // - host : the host
        // - command : the command to trigger by ssh
        // - jq-expression : an optional jq-expression (https://jqplay.org)  
        //  
        // You must use 'known_hosts' and 'public-key' to setup non-interactive password-less authentication.
        // In the settings you can find the public-key and add your target-host to known_hosts
    - name: list files in a directory
      code: |
        fn.fnLs('/tmp',{ recursive: true, regex: '.*\.log$', metadata: true })

        // fn.fnLs(path,options)
        // - path : path to directory
        // - options : recursive:boolean, regex:string ,metadata:boolean
        //   - recursive : whether to list files recursively
        //   - regex : a regular expression to filter files
        //   - metadata : whether to include file metadata (size,mtime,... directories will be shown too)
    - name: parse html page
      code: |
        fn.fnParseHtmlWithRegex('https://ansibleguy.com','<h2.*?>(.*?)</h2>','g')

        // fn.fnParseHtmlWithRegex(url,regex,flags)
        // - url : url to html page
        // - regex : a regular expression with at least one group ( )
        // - flags : regex flags (such as g,i,m)
        //
        // it will grab the html source and return an array with all the group matches
    - name: get DNS info
      code: |
        fn.fnDnsResolve('ansibleguy.com','A')

        // fn.fnDnsResolve(fqdn,type)
        // - fqdn : a fully qualified domain name
        // - type : the type of dns record (A,AAAA,MX,NS,CNAME,TXT,SRV,PTR)
    - name: read json file
      code: |
        fn.fnReadJsonFile('/tmp/file.json','.[].name')

        // fn.fnReadJsonFile(path,jq-expression)
        // - path : path to json file
        // - jq-expression : an optional jq-expression (https://jqplay.org)
    - name: read yaml file
      code: |
        fn.fnReadYamlFile('/tmp/file.yaml','.[].name')

        // fn.fnReadJsonFile(path,jq-expression)
        // - path : path to json file
        // - jq-expression : an optional jq-expression (https://jqplay.org)
    - name: rest api with basic authentication
      code: |
        fn.fnRestBasic(
          'get',
          'https://resturl/api/',
          '',
          'name_of_credential_in_database',
          '[.records[] | {name:.name, email:.email, spouse:.relations.spouse}'],
          'name',
          false
        )

        // output : a full json object coming from rest, json transformed with jq, result sorted and transformed by javascript.

        // fn.fnRestBasic(method,url,body,credentialname,jq-expression,sort-object)
        // - method : get,post,put,delete
        // - url : url to restapi (can for example contain a placeholder like 'https://$(serverfield.fqdn)/api/'
        // - body : in case of post and put
        // - credential-name : it will lookup the credentials as you have saved in the gui
        // - jq-expression : an optional jq-expression (https://jqplay.org)
        // - sort object : a sort object to order the result
        // - hasBigInt : a boolean indicating if it should convert Int64 to string
    - name: rest api with token authentication
      code: |
        fn.fnRestJwt(
          'get',
          'https://resturl/api/',
          '',
          'your_jwt_token_in_text',
          '[.records[] | {name:.name, age:.age}]',
          ['age','name'],
          false
        )

        // output : a full json object coming from rest, json transformed with jq, result sorted, first by age, then by name

        // fn.fnRestJwt(method,url,body,token,jq-expression,sort-object)
        // - method : get,post,put,delete
        // - url : url to restapi (can for example contain a placeholder like 'https://$(serverfield.fqdn)/api/'
        // - body : in case of post and put
        // - token : it will be add as a Bearer Authorization header
        // - jq-expression : an optional jq-expression (https://jqplay.org)
        // - sort-object : a sort object to sort the result
        // - hasBigInt : a boolean indicating if it should convert Int64 to string
        // - tokenPrefix : a prefix, defaults to 'Bearer' (v5.0.0)
    - name: rest api with secured token authentication
      code: |
        fn.fnRestJwtSecure(
          'get',
          'https://resturl/api/',
          '',
          'name_of_credential_in_database',
          '[.records[] | {name:.name, age:.age}]',
          ['age','name'],
          false
        )

        // output : a full json object coming from rest, json transformed with jq, result sorted, first by age, then by name

        // fn.fnRestJwtSecure(method,url,body,token,jq-expression,sort-object)
        // - method : get,post,put,delete
        // - url : url to restapi (can for example contain a placeholder like 'https://$(serverfield.fqdn)/api/'
        // - body : in case of post and put
        // - credential_name : Encrypted credential will be looked up.  The password will be the token.
        // - jq-expression : an optional jq-expression (https://jqplay.org)
        // - sort-object : a sort object to sort the result   
        // - hasBigInt : a boolean indicating if it should convert Int64 to string 
        // - tokenPrefix : a prefix, defaults to 'Bearer' (v5.0.0)
    - name: rest api with custom headers
      code: |
        fn.fnRestAdvanced(
          'get',
          'https://resturl/api/',
          '',
          {'a_custom_http_header':'your_value','Authorization':'basic base64(my_rest_credential)'},
          '.records[].name',
          {name:{ignoreCase:true,direction:'desc'}},
          false,
          false
        )

        // output : a full json object coming from rest, json transformed with jq, result sorted descending by name

        // fn.fnRestAdvanced(method,url,body,{myheader:'value'},jq-expression,sort-object)
        // - method : get,post,put,delete
        // - url : url to restapi (can for example contain a placeholder like 'https://$(serverfield.fqdn)/api/'
        // - body : in case of post and put
        // - headers: an object of headers
        // - jq-expression : an optional jq-expression (https://jqplay.org)
        // - sort-object : a sorting object to order the results
        // - hasBigInt : a boolean indicating if it should convert Int64 to string
        // - raw : return data and response_headers  
          
        // 3 function-placeholders are allowed in the headers:
        // - base64(credential_name) : will create a base64 encoded "username:password".  prefix with "basic" if required
        // - username(credential_name) : will add the username of the credential
        // - password(credential_name) : will add the password of the credential
    - name: get credentials
      code: |
        fn.fnCredentials('credentialname_or_regex','fallback_credentialname_or_regex')

        // Try to use `fnRestBasic` and `fnRestJwtSecure` if possible, this avoids passwords and tokens going over the network.

        // output : a credential object with all properties (username, password, host, port)
        // the exact name is tried first, then the name as a regex, then the fallback
        // server expressions are evaluated from the form definition : a user reaches only
        // the credentials the form's expressions ask for (a raw expression over the api
        // needs settings or designer access)
    - name: copy a value
      code: |
        fn.fnCopy($(other_field))

        // output : the value, unchanged

        // fn.fnCopy(input)
        // - input : any value, for example the value of another field
    - name: sort an array
      code: |
        fn.fnSort(['a','b','z','q','c'],{'':{direction:'asc'}})

        // output : sorts the flat array

        // fn.fnSort(arrayinput,sort-object)
        // - array, coming from expression or rest or database
        // - sort-object : a sorting object to order the results    
    - name: the sorting object
      description: |
        In all the data-fetching functions you have the option to sort your data, using this sorting object.  
      code: |
        The sorting object can have multiple forms, for example :

        'name' // will sort ascending on property name
        ['name','email'] // will first sort on name, then on email
        {name:{direction:'desc'}} // will sort on name descending
        {name:{ignoreCase:true}} // will sort on name ascending, ignoring case
        ['name',{email:{ignoreCase:true,direction:'asc'}}] // will sort on name first, then on email, ignoring case
        {'':{}} // a special case for sorting a flat array which has no headername (properties)
        {'':{direction:'desc'}} // sort a flat array descending      
    - name: run a json-query (jq) on an object
      code: |
        fn.fnJq($(settings),'.mapping | keys')

        // output : a full json object taken from another field called "settings", converted by jq

        // fn.fnJq(object, jq)
        // - object, for example read from rest or yaml file
        // - jq-expression : a jq-expression (https://jqplay.org)
        // to sort the result, pass it to fn.fnSort
    - name: builtin jq functions
      description: |
        In all the data-fetching functions you have the option to add a json-query.  A powerfull language to manipulate a data object or array.  
        Whilst manipulating data, you might bump into the need to convert bytes to KB, MB, ...  as well as the need to round numbers.  
        That's why Ansible Forms comes with a few custom handy JQ-functions.  
        * **fn2KB**: Bytes to KB
        * **fn2MB**: Bytes to MB
        * **fn2GB**: Bytes to GB
        * **fnRound0**: Round with 0 decimals
        * **fnRound1**: Round with 1 decimal
        * **fnRound2**: Round with 2 decimals
        * **fnRound**: Round with 2 decimals        
      code: |
        fn.fnRestBasic('get','https://youruri','','CREDS',
          '[.records[] | {"Available Capacity":.storage_capacity.available | fn2GB | fnRound }]')
        // note you need to pipe into the functions
    - name: Get a name with incremental numbering
      description: |
        In an array of strings containing incremental numbers (server001,server002, ...), you might want to search the next available name.  
        Also available as local expression (without the `fn.` prefix)
      code: |
        fn.fnGetNumberedName(['server001','server002','server005'],'server###','server001',false)
        // result : "server006"

        fn.fnGetNumberedName(['server001','server002','server005'],'server###','server001',true)
        // result : "server003"

        fn.fnGetNumberedName($(fieldlist),'server###','server001',true)
        // use another expression field as input for the array

        // fn.fnGetNumberedName(array,pattern,default,fillgaps)
        // This function searches for a numbered pattern in a list of string, 
        // increases the highest number and returns a name like the pattern
        // - array : an array object, you can use a placeholder to an expression where you know it's an array
        // - pattern : a string that hold the # as a digit
        // - default : if no value is found, return this default
        // - fillgaps : a boolean to indicate it can fill gaps in the numbers, 1,2,3,6 => 4      
- name: FAQ
  icon: fas,circle-question
  link: faq
  description: |
    Frequently Asked Questions.  
  examples:
  - name: Multi-Repository Form Management
    short: Use multiple git repositories for forms
    version: v6.1.0
    description: |
      AnsibleForms supports loading forms from multiple git repositories simultaneously. Forms from all repositories with the "Use for forms" switch enabled are automatically merged together.
      
      **How it works:**
      - Configure multiple repositories in Settings → Repositories
      - Enable the "Use for forms" switch on each repository you want to load forms from
      - Each repository can contain a `forms/` directory with form YAML files
      - All forms from all repositories are merged together automatically
      - Forms with duplicate names will trigger a warning (first one wins)
      
      **Configuration File Discovery:**
      - AnsibleForms will use the FIRST config.yaml (or config.yaml) found across all form repositories
      - If multiple config files are found, a warning is logged
      - You can have a single central config repository for shared categories/roles/constants
      - Or use the local `persistent/config.yaml` file (checked if no repository config found)
      
      **Best Practices:**
      - Keep config.yaml in only ONE repository or use the local persistent/config.yaml
      - Organize forms by team/project using separate repositories
      - Use unique form names across all repositories to avoid conflicts
      - Repository order matters: forms are loaded in database order
      
      **Example Setup:**
      ```
      Repository 1 (Central Config):
        - config.yaml (categories, roles, constants)
      
      Repository 2 (Network Team):
        - forms/
          - switch_config.yaml
          - router_setup.yaml
      
      Repository 3 (Server Team):
        - forms/
          - server_deploy.yaml
          - backup_restore.yaml
      ```
      
      All forms appear together in the UI, automatically merged!
  - name: Job Relaunch with Pre-filled Data
    short: Relaunch jobs with form data
    version: v6.0.3
    description: |
      AnsibleForms supports relaunching jobs with pre-filled form data. When you click the relaunch button in the jobs page, the form will open with all field values from the previous job submission.
      
      **Security Features:**
      - Password fields are automatically excluded from storage and retrieval for security
      - Raw form data is stored separately from processed extravars (before model transformations)
      
      **Permission Control:**
      Forms can prevent relaunch using `allowRelaunch: false`:
      ```yaml
      - name: Production Deployment
        allowRelaunch: false  # Prevents relaunching this form
      ```
      
      Users must have the `allowJobRelaunch` role option enabled (admins have this by default):
      ```yaml
      roles:
        - name: operators
          options:
            allowJobRelaunch: true  # Allow this role to relaunch jobs
      ```
      
      **Most Restrictive Logic:** Relaunch is only available if BOTH conditions are met:
      1. Form does NOT have `allowRelaunch: false`
      2. User role has `allowJobRelaunch: true` (or user is admin)
      
      **How it works:**
      - Raw form data is saved to disk on job submission (excluding passwords)
      - Clicking relaunch navigates to the form with `?prefillJobId=<id>` parameter
      - Form loads with all previous values, respecting field dependencies and async queries
      - Users can modify values before resubmitting
  - name: Job Log File
    short: Track progress via a job-specific log file
    version: v6.1.2
    description: |
      AnsibleForms can display a **job-specific log file** alongside the Ansible output, making it easy to track the progress of long-running custom modules that would otherwise produce no visible feedback during execution.

      > **Note:** This feature works for playbooks run on a runner of type rte. AWX / AAP templates are not supported.

      **How it works:**
      - During a job run, the RTE watches for a log file at a well-known path inside the playbook folder
      - Every 2 seconds, when the file changed, and once more when the playbook ends, the RTE stores its contents on the job ; the file is then removed (since 7)
      - The log file is displayed in a separate **Logfile** panel below the main Ansible output, with full ANSI colour support

      **Log file path convention:**
      ```
      <playbook_dir>/.joblogs/job_log_<jobid>.log
      ```

      **AnsibleForms passes `__jobid__` automatically**, so you can assemble the path in your playbook without any extra configuration:
      ```yaml
      job_log_path: "{{ vars['playbook_dir'] }}/.joblogs/job_log_{{ __jobid__ }}.log"
      ```
      Pass this variable to any role or custom module that should write progress to the file.

      **Responsibilities of the playbook / module developer:**
      - **Create** the log file (and its `.joblogs/` directory) at the start of the operation
      - **Write** meaningful progress messages as the operation proceeds
      - Deleting it is not needed : the RTE removes it once the playbook ended (it is kept on the job)

      **ANSI colour coding is supported.**  
      You can use standard ANSI escape codes (e.g. `\033[92m` for green, `\033[91m` for red) in your log messages and they will be rendered as colours in the UI. This is ideal for distinguishing success, warning, and error states at a glance.

      **Typical use case:**  
      A custom Python Ansible module that performs a long sequence of API calls or data operations (e.g. a SnapMirror DR workflow) can append one line per step to the log file. The operator watching the job in AnsibleForms will see live progress in the Logfile panel as each polling cycle refreshes the output.
  - name: Cascaded Dropdowns
    short: Make cascaded dropdowns
    description: |
      `enum` fields (AKA dropdown boxes) can contain placeholders in their `query` or `expression` property in the format of `$(another_field)` or `$(another_field[0].name)`.  
      The moment the referenced field changes, the referencing field gets re-evaluated, resulting in dynamic and cascading dropdown boxes.  
      The power of this concept lies in the client web-application that is re-evaluating fields every 100ms.  With current processors and the chromium engine, this should be a very seamless experience.  
        
      **Note**: When you reference another enum field, you reference the selected values, NOT the full dropdown list.  Use the `placeholderColumn`-property or a dot-notation like `$(city.name)` 
      **New in v4.0.20** : setting placeholderColumn to "*" will output the entire record, instead of a single column.
    language: yaml
    code: |
      - type: enum
        dbConfig: 
          name: CONN1
          type: mysql
        query: select name from cmdb.city
        name: city_name
        label: Select a city
        default: Amsterdam
        required: true
        model: cmdb.city
        group: CMDB
      - type: enum
        dbConfig: 
          name: CONN1
          type: mysql
        query: select datacenter.name from cmdb.datacenter,cmdb.city where datacenter.city_id=city.id
          and city.name='$(city_name)'
        name: datacenter_name
        label: Select a datacenter
        default: __auto__    # default can be "__auto__" (first item) or "__all__" (all items) or "__none__" (no default)
        multiple: true
        outputObject: true
        required: true
        model: cmdb.datacenter
        group: CMDB      

      # or use the placeholderColumn property

      - type: enum
        dbConfig: 
          name: CONN1
          type: mysql
        query: select id,name,description from cmdb.city
        name: city
        label: Select a city
        default: Amsterdam         # evaluated against valueColumn
        required: true
        model: cmdb.city
        group: CMDB
        valueColumn: name          # we choose the name column as value for placeholders
        placeholderColumn: id      # we can reference the id by using $(city)
        previewColumn: description # when you select a value, the dropdown will show description
        columns:                   # we hide id
        - name
        - description
      - type: enum
        dbConfig: 
          name: CONN1
          type: mysql
        query: select name, capacity_pct from cmdb.datacenter where datacenter.city_id=$(city)
      # this cascaded dropdown will react using "id" as placeholder
      # or "query":"select name from cmdb.datacenter where datacenter.city_id=$(city.id)",  
      # or reference the column in the placeholder                            
        name: datacenter_name
        label: Select a datacenter
        default: __auto__         # default can be "__auto__" (first item) or "__all__" (all items) or "__none__" (no default)
        multiple: true
        pctColumns:
        - capacity_pct
        outputObject: true
        required: true
        model: cmdb.datacenter
        group: CMDB
  - name: Field placeholders
    short: Reference another fields value
    description: |
      Placeholders are references to other fields in the forms.  
      A placeholder is always in the format `$(reference)`.  Expressions or queries can contain placeholders.  
      If the placeholder is pointing to a simple field (text, number, password), it will hold that fields value.  
      If the placeholder is pointing to a object-based-enum field, then you must either use the `placeholderColumn`-property or a dot-notation like `$(city.name)`.  
      If the placeholder is pointing to an expression field, then either the full object is returned or you can have an advanced placeholder reference like `$(myarray[0].name)` where you can create javascript-like references.  
        
      **Note**: Important to know is that the placeholder is replaced BEFORE the evaluation of the expression.  If you expect the result to be a string, then you must wrap it with quotes!.
      **New in v4.0.20** : setting placeholderColumn to "*" will output the entire record, instead of a single column.
    language: yaml
    code: |
      - name: field1
        type: expression
        expression: "[{name: 'foo'},{name: 'bar'},{name: 'ansible'}]"
        runLocal: true
      - name: field2
        type: expression
        expression: "'$(field1[0].name)'"  # result : 'foo' (note the wrapping quotes)
        runLocal: true
      - name: field3
        type: expression
        expression: "$(field1)[0].name"  # result : {name: 'foo'}.name => 'foo'  
        runLocal: true    
      - name: field4
        type: expression
        expression: "$(field1).slice(-1)[0].name"  # result : {name: 'ansible'}.name => 'ansible' 
        runLocal: true
      - name: field5
        type: enum
        expression: $(field1).filter(x => x.name.includes('a'))   # result : [{name: 'bar'},{name: 'ansible'}]
        runLocal: true
        default: __auto__                                         # result: bar
      - name: field6
        type: expression
        expression: "'$(field5)'"   # result : the selected item from field5 (default=bar)
        runLocal: true        
  - name: Hide a field
    short: Hide a field
    description: |
      You can hide a field using the field property `hide` .  
      Or you can show/hide a field dynamically using the field properties `dependencies` and `dependencyFn`.
  - name: Group fields
    short: Group fields together in a block
    description: |
      Use the field property `group` .  Fields with the same group name will be grouped in a block.
  - name: Field validation
    short: Validate a field
    description: |
      Have a look at the many validation field properties such as `regex`, `minValue`, `notIn`, ...
  - name: Credentials
    short: Pass credentials
    description: |
      Credentials can be add in several ways.
      * using the field-property `asCredential`  
      * using the `credentials` form-property (key-value pairs)
      * using an extravar called `__credentials__`
    language: yaml
    code: |
      # assume you have 2 credentials created in Ansible Forms
      # 1: vcenter
      # 2: ad

      # you want them exposed to the playbook as
      # 1: vc_cred
      # 2: ad_cred

      # Method 1 : using asCredential field-property
      fields:
      - name: vc_cred
        type: expression
        runLocal: true
        asCredential: true
        expression: "'vcenter'"
      - name: ad_cred
        type: expression
        runLocal: true
        asCredential: true
        expression: "'ad'"

      # Method 2 : using credentials form-property   
      name: myplaybook
      type: ansible
      playbook: myplaybook.yaml
      roles:
        - public
      credentials:
        vc_cred: vcenter
        ad_cred: ad
        veeam_cred : veeam_prod,veeam_dev # will first try veeam_prod, then as fallback veeam_dev

      # Method 3 : using __credentials__ extravar
      fields:
      - name: __credentials__
        type: expression
        runLocal: true
        expression: "{vc_cred: 'vcenter',ad_cred: 'ad',veeam_cred:'$(veeam_server)'}"
        # note : in the expression you can use placeholders to make them dynamic
  - name: Jobid
    short: Pass the current jobid
    description: |
      Ansible Forms automatically sends the current jobid in the extravars.  
      You don't need to do anything.  
      It is sent as `__jobid__`.
  - name: Userinfo
    short: Pass the current user
    description: |
      Ansible Forms automatically sends the userinformation in the extravars.  
      You don't need to do anything.  
      It is sent as `ansibleforms_user`.
  - name: Userinfo Form
    short: Access current user info in the form
    description: |
      The field `__user__` is automatically added in the form.
    language: yaml
    version: 4.0.2
    code: |
      expression: $(__user__)
      expression: "'$(__user__.username)'"
      expression: $(__user__.groups)
      expression: $(__user__.roles)
  - name: Customization
    short: Customize Ansible Forms
    description: |
      Ansible Forms is a web-app.  If you run it natively in nodejs, you could replace files or change them.  
      But more recommended is to run it as a docker-image and add volume or file mappings.  Our docker-compose projects already maps directories to make the database, playbooks, logs, certificates and ssh-keys persistent.  Nothing is keeping you from adding more mappings to, for example, override the logo.  
      There is also a `custom.js` file where you can add your own javascript functions to use in expressions.  Just like you can address our functions with the prefix `fn.` (fn.fnRestBasic for example) you can access the custom functions with prefix `fnc.`.  
      And you can add your own jq definitions as well in the same way with the `jq.custom.definitions.js`
    language: yaml
    code: |
      volumes:
        # Mount application folder to host folder (to maintain persistency)
        - ./data:/app/dist/persistent
        # Map custom functions for js expressions and jq
        - ./data/functions/custom.js:/app/dist/src/functions/custom.js
        - ./data/functions/jq.custom.definitions.js:/app/dist/src/functions/jq.custom.definitions.js
        # Map custom sshkey to local node .ssh location
        - ./data/ssh:$HOME_DIR/.ssh
        - ./data/git/.gitconfig:$HOME_DIR/.gitconfig    
        # Map custom logo
        - ./data/mylogo.svg:/app/dist/views/assets/img/logo_ansible_forms_full_white.svg
  - name: Default value on enum
    short: Enum default value
    description: |
      There is obviously the field property `default` you can use to manipulate a default.  
      And with `enum` fields, you can use `__auto__` for example to automatically select the first item.  

      But sometimes you want to have a dynamic default, based on an expression.  
      See the below example how we accomplish this.
    language: yaml
    code: |
      # using client javascript manipulation

      - type: expression
        expression: "[{name:'bert'},{name:'ernie'},{name:'pino'}]"
        name: dropdownsource
        label: Dropdown source
        runLocal: true
      - type: expression
        expression: "'pino'"
        name: dropdownsourceDefault
        label: Default source
        runLocal: true
      - type: enum
        expression: "[...[{name:'$(dropdownsourceDefault)'}],...$(dropdownsource).filter(x => x.name!=='$(dropdownsourceDefault)')]"
        name: dropdownwithdefault
        label: Example with expression default by moving it to top
        runLocal: true
        default: __auto__     

      # explained : 
      # we take our default and merge it with the source where we filter out the default (to avoid doubles)    
      # the default is thus shifted to the first element, which we can now select with the default `__auto__`
  - name: Expression default value
    short: Expression default value
    description: |
      For text, number or date fields, you can use the `default` property to set a default value.  
      But what if you want this to be dynamic?  Like an expression?  

      You can do this in 2 ways:  
      * `editable`: use the editable property to make an expression-field editable
      * `evalDefault`: use the evalDefault property to evaluate the default as an expression
    language: yaml
    code: |
      # using editable
      - type: expression
        expression: "'$(some_other_field)'.toLowerCase()"
        name: field1
        runLocal: true
        editable: true # this will add an edit-button so you manually overwrite the expression value

      # using evalDefault
      - type: text
        name: field1
        default: "'$(some_other_field)'.toLowerCase()"
        evalDefault: true # it will treat the default as if it was an expression.
        # note : when `some_other_field` changes, the default will be re-evaluated
        # note2 : works for other fields too.

      # more complex evalDefault example
      - name: checkbox
        type: checkbox
      - name: textfield1
        type: text
        line: line2
        default: ping
      - name: textfield2
        type: text
        line: line2
        default: pong
      - name: checkbox3
        type: checkbox
        line: line3
        label: This checkbox will default check if checkbox or textfield1==textfield2
        default: |
          (
            (c=false,t1="",t2="") => { return c || (t1==t2) }
          )( $(checkbox) , "$(textfield1)" , "$(textfield2)" )
          
        evalDefault: true
          

  - name: Query AWX/Tower/AAP
    short: Query information from AWX or Ansible Automation Platform
    description: |
      Sometimes you want to create dropdown boxes, with data from AWX or Tower.  
      You can use `fn.fnRestBasic` or `fn.fnRestJwtSecure` to query to do this.  
      
    language: yaml
    code: |
      name: Query awx
      type: awx
      awx: myAwxConfigName
      template: my_template # will be overwritten by the field __template__
      description: ""
      awxCredentials:
        - vmware
      executionEnvironment: my_execution_environment
      roles:
        - public
      categories: []
      inventory: my_inventory # will be overwritten by the field __inventory__
      tileClass: bg-info-subtle
      icon: bullseye
      fields:
        # make sure you add credentials called "awx_rest" where the password holds the token
        # if you like basic authentication, switch the expressions below to fn.fnRestBasic instead

        - name: organization
          label: Organization
          type: enum
          default: __auto__
          expression: "fn.fnRestJwtSecure('get','https://172.16.50.1/api/v2/organizations','','awx_rest','[.results[]]')"
          columns:
            - name
          valueColumn: id # => we want the organisation field to hold the id !!
        - name: __template__  # use this special name to override the template from the form
          label: Inventory
