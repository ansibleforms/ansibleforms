    type: string
    allowed: valid escape color code
    short: Error color code
    default: \x1b[31m
    version: 3.0.1
    description: The escape color code for error (default red)    
  - name: LOG_COLOR_WARN
    type: string
    allowed: valid escape color code
    short: Warning color code
    default: \x1b[33m
    version: 3.0.1
    description: The escape color code for warning (default yellow)  
  - name: LOG_COLOR_NOTICE
    type: string
    allowed: valid escape color code
    short: Notice color code
    default: \x1b[37m
    version: 3.0.1
    description: The escape color code for notice (default white)  
  - name: LOG_COLOR_INFO
    type: string
    allowed: valid escape color code
    short: Info color code
    default: \x1b[32m
    version: 3.0.1
    description: The escape color code for info (default green)  
  - name: LOG_COLOR_DEBUG
    type: string
    allowed: valid escape color code
    short: Debug color code
    default: \x1b[36m
    version: 3.0.1
    description: The escape color code for debug (default cyan)
  - name: ACCESS_TOKEN_SECRET
    type: string
    allowed: a hard secret string
    short: Secret to encrypt access tokens
    default: "*** NOT REVEALED ***"
    description: |
      AnsibleForm uses Basic Authentication as authentication mechanism.  
      Once authenticated, the client uses a JWT (Json Web Token) for authorization (Bearer authorization header).
      This token is stored on the client side (i.e. browser cookie) and is signed with a secret key.  
      To keep the communication between client and server safe, we strongly recommend you to set this secret.
  - name: ACCESS_TOKEN_EXPIRATION
    type: string
    allowed: a valid time indication
    short: Access token expiration
    default: 30m
    description: |
      A JWT (Json Web Token) is only valid for a certain amount of time.  
      If someone would be able to intercept a communication packet and see the token, it would only be valid for a short time.  
      After this short time, the client must refresh his access token using his refresh token.  
  - name: ACCESS_TOKEN_REFRESH_EXPIRATION
    type: string
    allowed: a valid time indication
    short: Refresh token expiration
    hint: How long a refresh token stays valid before a new sign-in is needed.
    default: 24h
    description: |
      Once the access token is expired, and the client tries to connect to the server, the client hits a 401 error (unauthorized). The client application captures this error, and calls the refresh API with its refresh token.  If the refresh token is valid, the client gets a new set of access and refresh tokens and retries the last unauthorized api call with the renew access token.  
      With this mechanism, the client can keep the user-connection open for a long time and avoid a sudden logout during a save action.  
      If the client has not connected back to the server during the expiration time of the refresh token, the client is logged of and authentication is required again.
  - name: ACCESS_TOKEN_ISSUER
    type: string
    allowed: a valid issuer string
    short: Issuer of the access token
    default: ansibleforms
    version: 5.0.8
    description: |
      The issuer of the access token is the name of the application that issues the token.  
      This is used to verify the token on the server side.
      Also reverse proxies can be picky about the issuer being present.
  - name: HOME_PATH
    type: string
    allowed: a valid path
    short: The users home directory
    hint: Home directory used for the generated SSH key and git credentials.
    default: OS Homedir path
    version: 3.0.0
    description: |
      Ansible Forms generates an sshkey at first start, is one is not present, so you can have a git connection or other password-less connection.  
      Typically this key is stored in the users home-directory under `/.ssh/id_rsa`.  You can set this homedirectory path manually with this property.
  - name: REPO_PATH
    type: string
    allowed: a valid path
    short: Repositories path
    hint: Root folder where git repositories are cloned.
    default: "%PERSISTENT_FOLDER%/repositories"
    version: 3.0.0
    description: |
      This path is the root path for your local repositories, allowing you to integrate data with git repositories.
  - name: VARS_FILES_PATH
    type: string
    allowed: a valid directory path
    short: Base path for vars files
    default: "%PERSISTENT_FOLDER%/vars"
    version: 6.1.0
    description: |
      Base directory for resolving relative paths in form varsFiles property.
      Absolute paths in varsFiles are used as-is.
      Relative paths are resolved against this directory.
      Allows centralized management of shared variable files across forms.
  - name: ENCRYPTION_SECRET
    type: string
    allowed: a strong encryption string
    short: Database encryption secret
    default: "*** NOT REVEALED ***"
    description: |
      Ansible Forms encrypts passwords in the database using this secret.  
      We strongly advise you to set a custom entryption secret to uniquely protect your passwords.  
      The secret must be 32 character long, however, we extend or cut the secret if this is not the case.
  - name: ANSIBLE_PATH
    type: string
    allowed: a valid path
    short: Where an RTE finds the playbooks
    default: "%PERSISTENT_FOLDER%/playbooks"
    description: |
      Read by an RTE (`AF_ROLE=rte`) : the folder its playbooks run from when no repository is
      marked for playbooks. Since 7 the app runs no playbook itself, so set this in the RTE
      container's environment ; it is not editable on the Settings page.
  - name: REGEX_FILTER_JOB_OUTPUT
    type: string
    allowed: an escaped regular expression
    short: Filter out job output tasks
    hint: Job output lines matching this regex are hidden.
    default: "\\[low\\]"
    description: |
      Sometime, the job output is flooded with meaningless output, such as 'Gathering Facts', or 'Includes'.  You filter out these by add a piece of string in the taskname, i.e. `[low]` and then used regex `\\[low\\]` to hide this information.  
      The output has a button `Apply filter` for the filtering to take effect.
  - name: JOBS_LIST_SIZE
    version: 7.0.0
    type: number
    allowed: a whole number from 10 to 10000
    short: Jobs shown in the jobs list
    hint: How many of the newest jobs the jobs list loads; its pages and search cover these.
    default: "1000"
    description: |
      The jobs list loads this many of the newest jobs (every job for an admin, a user's own
      and those waiting for approval for the others) : its pages, its search and its status
      menu cover these, an older job is not listed. A larger number reaches further back, at
      the cost of a larger list to read each time the jobs change. Applied without a restart.
  - name: MASK_EXTRAVARS_REGEX
    type: string
    allowed: an escaped regular expression
    short: Regex to mask extravars values
    hint: Extravars whose name matches this regex are masked in job output.
    default: "password|secret|token"
    description: |
      When you have sensitive extravars, such as passwords, tokens, keys, credentials, you do not want these to be shown in clear text in the extravars section of a job.  
      By setting this regex, any extravar key matching this regex will have its value masked with `********`.   Note the regex will be case insensitive.   

      **Since 6.4.1** the value of every `password` field of the form is masked as well, whatever
      its key or model path - in list rows and yaml subforms too. The regex is for the other
      secrets, the ones that are not password fields.
  - name: EXTRAVARS_USER_FIELDS
    type: string
    allowed: empty, all, none, or a comma separated list of keys
    short: Which keys of the user go into the extravars
    hint: Trims the ansibleforms_user object sent to the playbook.
    default: ""
    description: |
      Every job carries the launching user as `ansibleforms_user` in its extravars.  With an LDAP or Entra ID login that is the user's full group membership plus every resolved role option, which for a directory user in a hundred groups is a hundred lines of extravars the playbook never reads - stored in the AWX job and in `jobs.extravars`, readable by anyone with access to the job.

      Leave it empty (the default) and the whole object is sent, exactly as in every release before this one.  Set it to a comma separated list of top level keys, for example `username,email,type`, and only those are sent.  Set it to `none` and `ansibleforms_user` is not sent at all.  `all` is the default said out loud, useful for a form that must override a trimmed global setting.

      A single form can override this with its `userExtravars` property.  The frontend `__user__` object comes from the login token and is not affected, and neither are role checks or the form's own `roles` list.

      **Note** : the [FAQ](https://ansibleforms.com/faq) suggests asserting on `ansibleforms_user.groups` inside a playbook as a defence in depth check.  If you do that, keep `groups` in the list.
  - name: UPLOAD_PATH
    type: string
    version: 4.0.16
    allowed: a valid path
    short: The path for file uploads
    default: "%PERSISTENT_FOLDER%/uploads"
    description: |
      Since 4.0.16, a new field type is introduced that allows file uploads.  The files are uploaded in this path.
  - name: AWX_LOST_MINUTES
    version: 7.0.0
    type: number
    allowed: a positive number
    default: 5
    short: How long AWX may not answer before a followed job is given up
    hint: Read by the app node or worker following the job
    description: |
      While an AWX job runs, the app asks AWX for its status and output every second. When AWX
      does not answer (a network blip, a restart, a busy controller) it tries again with a
      backoff - 1, 2, 4 seconds up to 30 - and ends the job as "lost contact" only after this many
      minutes of failures in a row. The job may still be running in AWX ; the job's output says so.
  - name: AWX_API_PREFIX
    type: string
    version: 5.0.9
    allowed: a relative url path
    short: The prefix for the AWX API
    default: /api/v2
    description: |
      The prefix of the AWX / AAP API on the runners of type awx, typically `/api/v2`.
      It is added only to a runner whose uri has no API path of its own : a runner's uri may
      carry it, as `https://aap.example.com/api/controller/v2` for AAP 2.5 and later.
  - name: NAV_HOME_LABEL
    type: string
    version: 5.1.0
    allowed: a suiting label
    short: The label of home navigation link
    hint: Text of the home link in the navigation bar.
    default: Forms
    description: |
      In the navigation bar, A home link is shown.  You can set the label/name of this link with this variable, for example `Services`.  Use in combination with `VUE_APP_NAV_HOME_ICON`.
  - name: NAV_HOME_ICON
    type: string
    version: 5.1.0
    allowed: a valid free fontawesome icon
    short: The icon of navigation home link
    hint: Icon of the home link in the navigation bar.
    default: rectangle-list
    description: |
      In the navigation bar, A home link is shown.  You can set the icon of this link with this variable, for example `play` or `house`.  Use in combination with `VUE_APP_NAV_HOME_LABEL`.
  - name: MYSQLDUMP_COMMAND
    short: Database dump command
    hint: Command used to dump the database for a backup.
    type: string
    version: 6.0.0
    allowed: a valid mysqldump command
    default: mariadb-dump --ssl-verify-server-cert=OFF
    description:
      MySQL dump commands and MySQL/MariaDB flavours differ, hence the need for a configurable command.
  - name: MYSQL_COMMAND
    short: Database restore command
    hint: Command used to restore the database from a backup.
    type: string
    version: 6.0.0
    allowed: a valid mysql command
    default: mariadb --ssl-verify-server-cert=OFF
    description:
      MySQL restore commands and MySQL/MariaDB flavours differ, hence the need for a configurable command.
  - name: BACKUP_COMMAND_TIMEOUT_SECONDS
    short: Backup/restore command timeout
    hint: Seconds the database dump and restore commands are allowed to run.
    type: number
    version: 6.3.0
    required: false
    default: 3600
    description: |
      How long the database dump and the database restore may run before they are killed.
      Both used to inherit the generic 60 second command timeout, which no real database can honour.
      Raise it if a large database is cut short; a restore that is killed part way leaves the database
      partially replayed, because the dump drops and recreates each table in turn.
- name: config.yaml
  icon: fab,wpforms
  link: forms
  itemName: attribute
  description: |
    Ansible Forms reads the forms configuration from the main `config.yaml` file.   
    The config.yaml file contains the `categories`, `roles` and `constants`.  The forms themselves are not in it : each form lives in a file of its own in the `forms` folder (`FORMS_FOLDER_PATH`), or in a forms repository.  Below are the 3 main attributes of the config.yaml file.
  items:
  - name: categories
    type: array
    allowed: valid category object
    objectLink: forms/category
    docsObjectLink: "#category-object"
    short: Categories
    description: | 
      The categories group the forms together in a tree-like view.  The Default category is mandatory and holds all forms without a category. 
    changelog:
    - version: 3.1.0
      type: added
      description: Added nested categories
    examples:
    - name: Categories
      code: |
        categories:
        - name: Default          # is mandatory
          icon: bars
        - name: Provisioning
          icon: pencil-alt
        - name: Decommissioning
          icon: trash-alt
          items:                 # sub categories
            - name: Linux
              icon: star
            - name: Windows
              icon: bullseye  
  - name: roles
    type: array
    allowed: valid role object
    objectLink: forms/role
    docsObjectLink: "#role-object"
    short: Roles
    description: | 
      The roles provide RBAC.  Each role has a name and 1 or more groups (local, ldap or azuread).  The `admin` and `public` rol is mandatory.  
      Since version 4.0.11 you can also add users (local, ldap or azuread).  
      Since version 5.0.8 options are introduced to add specific role-options.  

      - showDesigner: The user can see the designer
      - showSettings: The user can see the settings page
      - showDebugButtons: The user can see the debug buttons on a form
      - showExtravars: The user can see the extravars on a form
      - showLogs: The user can see the logs page
      - showJobs: The user can see the jobs page. Default true.
      - showArtifacts: The user can see the artifacts an AWX job returns. Default true.
      - extendedTokenExpiration: The user can request a token with a longer expiration time (for coding api purposes for example)  
      - showAllJobLogs: The user can see all job logs (not only his own) (Added in 5.0.9)
      - allowLogin: The user can login.
      - allowBackupOps: The user can perform database operations, such as backup and restore.
      - allowVerboseMode: The user can enable verbose mode on ansible forms.
      - allowJobRelaunch: The user can relaunch jobs with pre-filled form data from previous submissions.
      - allowScheduledJobs: The user can create and manage scheduled jobs (recurring cron or one-time). Default for admins only. Grant it only to roles you would trust as admins: every user with this option sees and can change all schedules, not only their own, and a schedule they create runs with admin rights, for any form. (Added in 6.1.5)
      - allowStoredJobs: The user can store and load job data for later use. (Added in 6.1.5)
      - allowPlannedJobs: The user can plan a one-time run of a form they may run ("Run later"). The job runs as that user, not as admin, and they cannot see or change other schedules. (Added in 6.1.5)
      - allowChat: The user can use the chat assistant (when it is enabled). Default true. (Added in 6.5.0)
      - allowMcp: The user can use the MCP server from an AI agent (when it is enabled). Defaults to the role's allowChat. (Added in 7.0.0)
        
      When options are not set, the admin role will have all options.  
      When options are set on the public role, they will have the lowest precedence and can be used as default options for all roles.  
      You can add options on role level, which will override the public role options.  

      The `allowLogin` option is different, that is for the backend.  By default everyone can login.  
      You can set it to false on public and then enable on the roles you want to give access.  Watch out you don't lock yourself out.  

    examples:
    - name: Roles
      code: |
        roles:
        - name: admin        # is mandatory
          groups:
          - local/admins
          - ldap/Domain Admins
          - azuread/Domain Admins
        - name: operator
          groups:
          - local/operator
        - name: architect
          groups:
          - local/architect
          options:
            showDesigner: true      # architects can see the designer
            showLogs: true          # architects can see the logs
            allowJobRelaunch: true  # architects can relaunch jobs with pre-filled data
        - name: demo
          groups:
          - local/demo
        - name: usersonly
          users:
          - local/myuser
        - name: public        # is mandatory
          groups: []  
          options:
            showDebugButtons: true  # everyone can see the debug buttons
            showExtraVars: true     # everyone can see the extravars
  - name: constants
    type: object
    allowed: Free object structure
    short: Constants
    description: | 
      Sometimes you want to have global-like variables.  The constants section gives you all freedom.  Whether it are objects, arrays, strings, numbers or booleans.  They will be available in every form.  
    examples:
    - name: Constants
      code: |
        constants:
          SERVERX: 172.16.0.1 # reference it later as $(SERVERX)
          VCENTER:
            fqdn: vcenter.demo.local  # reference it later as $(VCENTER.fqdn)
            ip: 172.16.0.2
  help:
    - name: Category
      icon: fas,folder-tree
      link: forms/category
      itemName: attribute
      description: |
        A category groups together 1 or more forms.
      items:
      - name: name
        type: string
        required: true
        unique: true
        allowed: alphanumeric + dash + underscore + space
        short: The name of the category
        description: | 
          The name of a category has to be unique.  The Default category is mandatory and holds all non-category forms.
      - name: icon
        type: string
        allowed: Free fontawesome 6 icon
        short: Category icon
        description: |
          You can add a nice icon to your categories.  The icon name is a free fontawesome 6 icon.
          You can find more information at [www.fontawesome.com](https://www.fontawesome.com).  
      - name: items
        type: object
        objectLink: forms/category
        allowed: A category object
        short: Sub categories
        version: 3.1.0
        description: |
          A category can have sub categories, which is again a category object.  
      examples: 
      - name: Categories
        language: YAML
        code: |
          categories:
          - name: Default          # is mandatory
            icon: bars
          - name: Provisioning
            icon: pencil-alt
          - name: Decommissioning
            icon: trash-alt
            items:                 # sub categories
              - name: Linux
                icon: star
              - name: Windows
                icon: bullseye
    - name: Role
      icon: fas,fingerprint
      link: forms/role
      itemName: attribute
      description: |
        A role allows RBAC.  Each role has 1 or more groups (local or ldap).  Except the `public` role, which has no groups.  
        The `public` and `admin` roles are mandatory.
      items:
      - name: name
        type: string
        required: true
        unique: true
        allowed: alphanumeric + dash + underscore + space
        short: The name of the role
        description: | 
          The name of a role has to be unique.  The `public` and `admin` roles are mandatory.
      - name: groups
        type: array
        required: true
        allowed: A group (local, ldap or azuread)
        short: Groups
        description: |
          A list of groups.  They must be in the format of `local/groupname` or `ldap/groupname` or `azuread/groupname`

          An Entra ID group can be named by its object id, `azuread/<object id>` : unique, where
          two groups can share a display name. Both work ; the object id is the one to prefer.
      - name: users
        type: array
        required: true
        allowed: A user (local, ldap or azuread)
        short: User
        version: 4.0.10
        description: |
          A list of local or ldap users.  They must be in the format of `local/username` or `ldap/username` or `azuread/username`     
      - name: credentials
        type: array
        allowed: regular expressions, matching a whole credential name
        short: The credentials this role may use
        version: 7.0.0
        description: |
          Limits the credentials a user of this role may use : those a job passes to a playbook or
          a template (the form's `credentials`, `ansibleCredentials`, `vaultCredentials`, a
          credential field), and those a form query or `fnCredentials` reads while the user fills
          in a form. Each entry is a regular expression that must match the whole name ;
          `__self__` is AnsibleForms' own database.

          A user none of whose roles lists credentials may use every credential, as before. Once
          one of their roles lists them, they may use what any of the roles that list them
          allows. The `admin` role is never limited. A launch that needs a credential the roles do
          not allow is refused before the job is created.
        examples:
          - name: Operators use the vCenter and the CMDB credentials only
            code: |
              roles:
                - name: operators
                  groups:
                    - ldap/operators
                  credentials:
                    - vcenter
                    - cmdb-.*
      - name: secretStores
        type: array
        allowed: secret store names
        short: The secret stores this role may read inline
        version: 7.0.0
        description: |
          Limits the secret stores a user of this role may read through an inline reference
          (`vault:<path>`, `secret:<store>:<ref>`) in a credential map or a query. When a role
          limits the credentials and none limits the stores, an inline reference must match a
          credential pattern itself : it is no way around them. Combined across roles as
          `credentials`.
      - name: runners
        type: array
        allowed: runner names
        short: The runners this role may run jobs on
        version: 7.0.0
        description: |
          Limits the runners a job of a user of this role may run on : the form's `runner`, or the
          default runner when it names none. Combined across roles as `credentials`.
      - name: options
        type: object
        allowed: Key value pairs
        short: Role options
        version: 5.0.8
        description: |
          Since version 5.0.8 you can add specific role options.  The options are used to enable or disable certain features for a role.  
          The options are:

          - showDesigner: The user can see the designer
          - showSettings: The user can see the settings page
          - showDebugButtons: The user can see the debug buttons on a form
          - showExtravars: The user can see the extravars on a form
          - showLogs: The user can see the logs page
          - showJobs: The user can see the jobs page. Default true.
          - showArtifacts: The user can see the artifacts an AWX job returns. Default true.
          - extendedTokenExpiration: The user can request a token with a longer expiration time (for coding api purposes for example)  
          - showAllJobLogs: The user can see all job logs (not only his own) (Added in 5.0.9)
          - allowLogin: The user can login.
          - allowBackupOps: The user can perform database operations, such as backup and restore.
          - allowVerboseMode: The user can enable verbose mode on ansible forms.
          - allowJobRelaunch: The user can relaunch jobs with pre-filled form data from previous submissions.
          - allowScheduledJobs: The user can create and manage scheduled jobs (recurring cron or one-time). Default for admins only. Grant it only to roles you would trust as admins: every user with this option sees and can change all schedules, not only their own, and a schedule they create runs with admin rights, for any form. (Added in 6.1.5)
          - allowStoredJobs: The user can store and load job data for later use. (Added in 6.1.5)
          - allowPlannedJobs: The user can plan a one-time run of a form they may run ("Run later"). The job runs as that user, not as admin, and they cannot see or change other schedules. (Added in 6.1.5)
          - allowChat: The user can use the chat assistant (when it is enabled). Default true. (Added in 6.5.0)
          - allowMcp: The user can use the MCP server from an AI agent (when it is enabled). Defaults to the role's allowChat. (Added in 7.0.0)

          When options are not set, the admin role will have all options.  
          When options are set on the public role, they will have the lowest precedence and can be used as default options for all roles.  
          You can add options on role level, which will override the public role options.    
      examples:
      - name: Roles
        language: YAML
        code: |
          roles:
          - name: admin        # is mandatory
            groups:
            - local/admins
            - ldap/Domain Admins
          - name: operator
            groups:
            - local/operator
            users:
            - azuread/mike
          - name: architect
            groups:
            - local/architect
            options:
              showDesigner: true # architects can see the designer
              showLogs: true     # architects can see the logs
          - name: demo
            groups:
            - local/demo
          - name: public        # is mandatory
            groups: []  
            options:
              showDebugButtons: true  # everyone can see the debug buttons
              showExtraVars: true     # everyone can see the extravars              
    - name: Form
      icon: fas,rectangle-list
      link: forms/form
      itemName: attribute
      description: |
        Each form in the forms list is configured with the below attributes.
      items:
      - name: name
        type: string
        required: true
        group: basic
        unique: true
        allowed: alphanumeric + dash + underscore + space
        short: The name of the form
        description: | 
          The name of a form is also the identifier of the form and thus must be unique.  
          For simplicity we have chosen not to some sore of guid as unique identifier.  This does mean, however, that when your rename a form any reference to it will be broken.  
      - name: roles
        type: array
        required: true
        with_types: ansible, awx, multistep
        group: basic
        allowed: valid role names
        short: Who has access
        description: | 
          You can have RBAC by adding roles to a form.  If you want everyone to see the form, add the `public` role.  
          **Note** : An admin has always access.
        examples:
        - name: Give access to vmware team
          language: YAML
          code: |
            name: Create virtual machine
            roles:
            - vmAdmins
            - vmOperators
      - name: categories
        type: array
        allowed: valid category name
        with_types: ansible, awx, multistep
        group: basic
        short: Categories
        description: | 
          By adding one or more categories, you can group forms together in categories. 
        examples:
        - name: Category vmware
          code: |
            name: Delete virtual machine
            categories:
            - Vmware
            - Decommissioning     
      - name: description
        type: string
        allowed: free text
        group: basic
        short: Form description
        description: | 
          A short description, explaining what the form does.
      - name: help
        type: string
        allowed: valid markdown
        group: basic
        short: Help
        description: | 
          Using markdown you can a more detailed help message to help the operator understand the form.  
        examples:
        - name: blockquote with title, list, italic and bold
          code: |
            > #### The quarterly results look great!
            >
            > - Revenue was off the chart.
            > - Profits were higher than ever.
            >
            >  *Everything* is going according to **plan**.     
      - name: showHelp
        type: boolean
        with_types: ansible, awx, multistep
        short: Show Help
        group: visualization
        default: true
        description: Show the help by default or collapse the help.  
      - name: icon
        type: string
        with_types: ansible, awx, multistep
        group: visualization
        allowed: Free fontawesome 6 icon
        short: Form icon
        description: |
          You can add a nice icon to your forms.  The icon name is a free fontawesome 6 icon.
          You can find more information at [www.fontawesome.com](https://www.fontawesome.com).  
          **Note** : You can either have an icon or an image, not both.
        examples: 
        - name: Trash icon
          code: |
            name: Delete virtual machine
            icon: trash
      - name: iconColor
        type: string
        with_types: ansible, awx, multistep
        allowed: valid color name
        group: visualization
        short: Icon color
        description: |
          Specifies the color of the icon. Use any valid CSS color class name (e.g., primary, success, danger, warning, info, dark, white, ...).
        examples: 
        - name: Red icon
          code: |
            name: My Form
            icon: server
            iconColor: danger
      - name: iconSize
        type: string
        with_types: ansible, awx, multistep
        allowed: xs, sm, lg, 2x, 3x, 5x, 7x, 10x
        group: visualization
        short: Icon size
        default: 3x
        description: |
          Specifies the size of the icon. 
        examples: 
        - name: Large icon
          code: |
            name: My Form
            icon: server
            iconSize: 5x
      - name: overlayIcon
        type: string
        with_types: ansible, awx, multistep
        allowed: valid fontawesome icon name
        group: visualization
        short: Overlay icon on main icon
        description: |
          Adds a icon on top of the main icon for layering effects. Useful for status indicators or badges.
        examples: 
        - name: Server with check overlay
          code: |
            name: Server Status OK
            icon: server
            overlayIcon: check
            overlayIconColor: success
            overlayIconTransform: shrink-6 up-7 right-7
      - name: overlayIconTransform
        type: string
        with_types: ansible, awx, multistep
        allowed: valid fontawesome transform
        group: visualization
        short: Transform for overlay icon
        default: shrink-6 up-7 right-7
        description: |
          Specifies the transform/positioning for the overlay icon. 
          You can use FontAwesome transform values like shrink, grow, up, down, left, right.
        examples: 
        - name: Custom positioned overlay
          code: |
            name: My Form
            icon: circle
            overlayIcon: check
            overlayIconTransform: shrink-8 down-2
      - name: overlayIconColor
        type: string
        with_types: ansible, awx, multistep
        allowed: valid color name
        group: visualization
        short: Color for overlay icon
        default: success
        description: |
          Specifies the color of the overlay icon.
        examples: 
        - name: Red overlay icon
          code: |
            name: Alert Status
            icon: circle
            overlayIcon: exclamation
            overlayIconColor: danger
      - name: overlayIconCircle
        type: boolean
        with_types: ansible, awx, multistep
        group: visualization
        short: Show circle background behind overlay icon
        default: true
        description: |
          When enabled, shows a colored circle background behind the overlay icon. 
          The circle uses the overlayIconColor, and the icon inside becomes white in light mode or dark in dark mode.
          When disabled, the overlay icon appears without a circle background.
        examples: 
        - name: Overlay without circle
          code: |
            name: My Form
            icon: server
            overlayIcon: check
            overlayIconCircle: false
            overlayIconColor: success
      - name: overlayIconText
        type: string
        with_types: ansible, awx, multistep
        allowed: any text
        group: visualization
        short: Text overlay on icon
        description: |
          Adds text as an overlay on the icon. Can be used for badges, counters, or labels.
        examples: 
        - name: New badge
          code: |
            name: New Feature
            icon: star
            overlayIconText: "New!"
            overlayIconTextPosition: top-right
            overlayIconTextColor: warning
      - name: overlayIconTextPosition
        type: string
        with_types: ansible, awx, multistep
        allowed: top-left, top-right, bottom-left, bottom-right
        group: visualization
        short: Position for text overlay
        default: bottom-left
        description: |
          Specifies the position of the text overlay.
        examples: 
        - name: Top right badge
          code: |
            name: Notification
            icon: bell
            overlayIconText: "3"
            overlayIconTextPosition: top-right
      - name: overlayIconTextColor
        type: string
        with_types: ansible, awx, multistep
        allowed: valid color name
        group: visualization
        short: Color for text overlay
        default: success
        description: |
          Specifies the color of the text overlay.
        examples: 
        - name: Warning badge
          code: |
            name: Pending Items
            icon: inbox
            overlayIconText: "!"
            overlayIconTextColor: warning
      - name: image
        type: string
        with_types: ansible, awx, multistep
        allowed: valid image url
        group: visualization
        short: Form image
        description: |
          You can add a nice image to your form.  You can provide a local or remote url.  But if you are in a secured location, you might want to go for a base64 encode image.  This allows you to embed the image in the yaml file.  
          To do this, find a not-to-large PNG image or better, an SVG image and convert to a base64 image url.  You can do this [here](https://base64.guru/converter/encode/image).  
          **Note** : You can either have an icon or an image, not both.
        examples: 
        - name: Microsoft image
          code: |
            name: Add Windows Virtual Machine
            image: |
              data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My
              5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMyAyMyI+PHBhdGggZmlsbD
              0iI2YzZjNmMyIgZD0iTTAgMGgyM3YyM0gweiIvPjxwYXRoIGZpbGw9IiNmMz
              UzMjUiIGQ9Ik0xIDFoMTB2MTBIMXoiLz48cGF0aCBmaWxsPSIjODFiYzA2Ii
              BkPSJNMTIgMWgxMHYxMEgxMnoiLz48cGF0aCBmaWxsPSIjMDVhNmYwIiBkPS
              JNMSAxMmgxMHYxMEgxeiIvPjxwYXRoIGZpbGw9IiNmZmJhMDgiIGQ9Ik0xMi
              AxMmgxMHYxMEgxMnoiLz48L3N2Zz4=
        - name: Internet image
          code: |
            name: Add Windows Virtual Machine
            image: https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg
        - name: Local image
          code: |
            name: Add Netapp storage
            image: /assets/images/netapp.svg # the docker compose has a few brand images, feel free to add your own
      - name: tileClass
        type: string
        with_types: ansible, awx, multistep
        allowed: valid bootstrap background class
        group: visualization
        short: Form tile background colour
        description: |
          Ansible Forms uses the Bootstrap css framework to style the webapplication.  
          Bootstrap has a few color helper classes you can use to give your formtile a background color.  
          You can find them here [background color](https://getbootstrap.com/docs/5.0/utilities/colors/#background-color) and [foreground color](https://getbootstrap.com/docs/5.0/utilities/colors/#text-color).  
          **Hint**: Try to add a matching foreground color.
        default: bg-info-subtle
        examples:
        - name: warning color
          code: |
            name: Cleanup jobs
            icon: trash
            tileClass: bg-warning text-light
        - name: success light color
          code: |
            name: New job
            icon: plus
            tileClass: bg-success-subtle text-dark  
      - name: fieldGroupClasses
        type: object
        with_types: ansible, awx, multistep
        allowed: key-value pairs
        group: visualization
        short: Fieldgroup background color
        description:
          Ansible Forms uses the Bootstrap css framework to style the webapplication.  
          Bootstrap has a few color helper classes you can use to give your fieldgroups a background color.  
          You can find them here [background color](https://getbootstrap.com/docs/5.0/utilities/colors/#background-color) and [foreground color](https://getbootstrap.com/docs/5.0/utilities/colors/#text-color).         
        examples:
        - name: Color fieldgroup
          code: |
            fieldGroupClasses:                             # give fieldgroups a custom background
              groupname1: bg-info-subtle
              groupname2: bg-success-subtle                 
      - name: type
        type: string
        group: basic
        choices:
        - name: ansible
          description: | 
            Targets an Ansible playbook, run on a runner of type rte (Connections > Runners),
            named with `runner:` or the default one. Since 7 AnsibleForms runs no playbook itself.
          examples:
          - name: Ansible Core Form
            code: |
              - name: Create a vm
                roles:                                         # reference to roles defined earlier
                - vmware
                description: Create a virtual machine
                help: |
                  This Form creates a virtual machine.  it will connect to `vcenter`.  This help is Markdown
                  so you can use **markdown** markup to highlight __certain words__.
                showHelp: true                                 # show help on load
                icon: computer                                 # a font awesome icon
                categories:                                    # reference to categories defined earlier
                - Demo
                - Vmware/Linux                                 # Add to a subcategory using the `/` separator
                tileClass: bg-success-subtle                   # a bootstrap background color style (https://getbootstrap.com/)
                playbook: playbook_vm.yml                      # playbook to launch (only if type = ansible)
                inventory: inventory.yml                       # optional ansible inventory file
                check: false                                   # run in checkmode or not
                diff: false                                    # show differences
                verbose: false                                 # verbose output
                keepExtravars: false                           # keep extravars json file                  
                allowJinjaInExtravars: false                   # let ansible template jinja in values
                tags: vm,create                                # optional ansible tags (comma separated)
                type: ansible                                  # type is awx or ansible
                onSubmit:                                      # event handler on form submit
                  - clear: 0                                   # clear form after 0 seconds
                  - hide: 1                                    # hide form after 1 second
                onFinish:                                      # event handler on job finished
                  - show: 2                                    # show the form after 2 seconds
                fieldGroupClasses:                             # give fieldgroups a custom background
                  groupname1: bg-info-subtle
                  groupname2: bg-success-subtle    
                fields:                                        # list of field objects
                  - name: vm_name
                    type: text
        - name: awx
          description: |
            Targets a job or workflow template on AWX / Ansible Automation Platform / Ascender :
            a runner of type awx (Connections > Runners), named with `runner:` or the default one.
          examples:
          - name: Awx Form
            code: |
              - name: Delete a vm
                roles:                                         # reference to roles defined earlier
                - vmware
                description: Delete a virtual machine
                help: This Form deletes a virtual machine.
                showHelp: true                                 # show help on load
                image: https://picsum.photos/64                # an image url (can be base64)
                categories:                                    # reference to categories defined earlier
                - Demo
                - Vmware
                - Decommissioning/Linux                        # Add to a subcategory using the `/` separator
                tileClass: bg-danger                           # a bootstrap background color style (https://getbootstrap.com/)
                template: remove_vm                            # template to launch (only if type = awx)
                inventory: inventory                           # optional awx inventory
                check: false                                   # run in checkmode or not
                diff: false                                    # show differences
                tags: vm,delete                                # optional ansible tags (comma separated)
                type: awx                                      # type is awx or ansible
                onSubmit:                                      # event handler on form submit
                  - clear: 0                                   # clear form after 0 seconds
                  - hide: 1                                   # hide form after 1 second
                onSuccess:                                     # event handler on form success
                  - load: 1,Another Form                       # load another form after 1 second
                onFailure:                                     # event handler on job failure
                  - show: 2                                    # show the form after 2 seconds
                onAbort:                                       # event handler on job failure
                  - reload: 3                                  # reload the form after 3 seconds
                fieldGroupClasses:                             # give fieldgroups a custom background
                  groupname1: bg-info-subtle
                  groupname2: bg-success-subtle    
                fields:                                        # list of field objects
                  - name: vm_name
                    type: text
        - name: multistep
          description: |
            Executes multiple jobs sequentially.  
            Each step can be a different type (ansible, awx).
          examples:
          - name: Multistep form
            code: |
              - name: Create VM
                roles:                                         # reference to roles defined earlier
                - vmware
                description: Create and start a vm
                image: https://picsum.photos/64                # an image url (can be base64)
                categories:                                    # reference to categories defined earlier
                - Demo
                - Vmware
                tileClass: bg-danger                           # a bootstrap background color style (https://getbootstrap.com/)
                type: multistep                                # type is awx, ansible or multistep
                steps:
                - type: awx
                  name: Create vm
                  template: Create VM
                  key: vmInfo
                - type: awx
                  name: Start vm
                  template: Start VM
                  key: vmInfo
                - type: ansible
                  name: Email results
                  playbook: email.yaml
                  always: true                                 # always run this task, even if others failed
                fieldGroupClasses:                             # give fieldgroups a custom background
                  groupname1: bg-info-subtle
                  groupname2: bg-success-subtle    
                fields:                                        # list of field objects
                  - name: vm_name
                    type: text
        - name: subform
          description: |
            A reusable form fragment used as the per-row editor of a `list` field, or as the single-object editor of a `yaml` field with the `subform` property.  
            Subforms are not shown in the tile view and cannot be submitted directly.  
            They share the same field types and validation rules as regular forms.
          examples:
          - name: Address subform
            code: |
              - name: Address
                type: subform
                fields:
                  - name: street
                    type: text
                    label: Street
                    required: true
                  - name: city
                    type: text
                    label: City
                    required: true
                  - name: country
                    type: text
                    label: Country
                    required: true
              - name: My Main Form
                type: ansible
                playbook: site.yml
                roles:
                  - Public
                fields:
                  - name: addresses
                    type: list
                    label: Addresses
                    subform: Address
        short: Form type
        description: |
          Our form eventually sends extravars to a target.  That target can be an ansible-playbook, an awx-template, a multistep (a sequence of playbooks/templates), or a `subform` (a reusable form fragment used as the per-row editor of a `list` field or the single-object editor of a `yaml` field).
        examples:
        - name: Run AWX Template Create VM
          code: |
            name: Create vm
            type: awx
            roles:
              - public
            fields: []
            template: Create VM       
        - name: Run Delete VM playbook
          code: |
            name: Delete vm
            type: ansible
            roles:
              - public
            fields: []
            playbook: delete_vm.yaml
        - name: Run multistep job
          code: |
            name: Trigger awx job
            type: multistep
            roles:
              - public
            fields: []
            steps:
            - name: Create vm
              type: awx
              template: create_vm        
            - name: Start vm
              type: awx
              template: start_vm                                 
      - name: template
        type: string
        with_types: awx
        group: basic
        allowed: a valid awx template name
        short: Awx template
        description: |
          This attribute is only used when the form type is `awx`.  When using native Ansible, use the property `playbook`.
            
          **Note** : You can also dynamically set the template by using a field called `__template__`.  It must be sent as extravar.  If this extravar is found it will overwrite the static template name.  
          **Note** : If you use multistep and you want to dynamically set every step, use the `key` property and `model` property to create separate extravars per step.                    
        examples:
        - name: Run AWX Template Helloworld
          code: |
            name: Helloworld
            type: awx
            roles:
              - public
            fields: []
            template: Helloworld
        - name: Use dynamic template name
          code: |
            name: Foobar
            type: awx
            roles:
              - public
            template: HelloWorld
            fields:
              - name: __template__
                type: text
                default: Foobar # this will overwrite the template name            
      - name: playbook
        type: string
        with_types: ansible
        group: basic
        allowed: a valid yaml file
        short: Ansible playbook
        description: | 
          This attribute is only used when the form type is `ansible`.  When using awx, use the property `template`.  
            
          **Note** : You can also dynamically set the playbook by using a field called `__playbook__`.  It must be sent as extravar.  If this extravar is found it will overwrite the static playbook name.  
          **Note** : If you use multistep and you want to dynamically set every step, use the `key` property and `model` property to create separate extravars per step.        
        examples:
        - name: Run foobar playbook
          code: |
            name: Foobar
            type: ansible
            roles:
              - public
            fields: []
            playbook: foobar.yaml  
        - name: Use dynamic playbook name
          code: |
            name: HelloWorld
            type: ansible
            roles:
              - public
            playbook: foobar.yaml
            fields:
              - name: __playbook__
                type: text
                default: helloworld.yaml # this will overwrite the playbook name
      - name: credentials
        type: object
        with_types: ansible, awx
        group: basic
        version: 4.0.16
        allowed: key-value pairs
        short: Send credentials to your playbook/template
        description: |
          From the earlier versions, you could send credentials, stored in Ansible Forms, by using the field-property `asCredentials`.  
          From now on, you can also define them statically in the form.  
          Additionally, you can also set these dynamically by using the a field name __credentials__.  
          **Note** : that this also works in steps, so each step can have its own set of credentials.  
          **Note** : If you use multistep and you want to dynamically set every step, use the `key` property and `model` property to create separate extravars per step.              
          **Note** : The credential can be a regex
          **Note** : A second, fallback, credential kan be passed using a comma
        examples:
        - name: Send vmware and microsoft credentials
          code: |
            credentials:
              cred_vm: vcenter_creds # will take the credentials calld vcenter_creds and send them in the object `cred_vm`
              cred_ms: ad_creds # will take the credentials called ad_creds and send them in the object `cred_ms`
              cred_netapp: cluster1,clusters2 # will first search for cluster1 and as fallback to cluster2
              cred_veeam: veeam_server[0-9],veeam # will first search for a credential matching the regex, and as fallback search for veeam
        - name: Dynamically send credentials
          code: |
            fields:
              - name: my_vcenter_cred
                type: enum
                values:
                  - vcenter_prod
                  - vcenter_dev
                default: ad_prod            
              - name: __credentials__
                type: expression
                runLocal: true
                hide: true
                expression: "{vcenter:'$(my_vcenter_cred)'}"

            # NOTE : this can also be done using `asCredential`

              - name: vcenter
                type: enum
                values:
                  - vcenter_prod
                  - vcenter_dev
                default: ad_prod                     
                asCredential: true
      - name: ansibleCredentials
        type: string
        with_types: ansible
        group: basic
        version: 4.0.17
        allowed: a local credentialname
        short: Pass ansible_user and ansible_password to ansible playbook using stored credentials
        description: |
          Ansible allows to pass default ansible credentials in the form of 2 extravars ansible_user and ansible_password
      - name: playbookSubPath
        type: string
        with_types: ansible
        version: 6.0.1
        group: basic
        allowed: a valid folder subpath
        short: Subfolder structure for playbooks
        description: |
          If you have a more complex ansible setup, you might want to organize them in subfolders.  Use this property to define a subfolder (or multiple levels) where you want to launch ansible-playbook from.  
      - name: vaultCredentials
        type: string
        with_types: ansible
        group: basic
        version: 5.0.2
        allowed: a local credentialname
        short: Pass vault password to ansible playbook using stored credentials
        description: |
          Ansible can encrypt variables in a vault, to unlock the vault a password is needed.  This password can be stored in Ansible Forms (as credential) and passed to the playbook..           
      - name: steps
        type: array
        with_types: multistep
        group: basic
        allowed: a step object
        objectLink: forms/form/step
        docsObjectLink: "multistep"
        short: Multistep steps
        description: |
          A multistep form is basically an array of multiple form type destinations, defined here as steps.
      - name: wizard
        type: array
        with_types: ansible, awx, multistep
        group: basic
        version: 6.4.0
        allowed: a wizard step object
        objectLink: forms/form/wizard
        docsObjectLink: "wizard"
        short: Wizard steps (form-layer)
        description: |
          Turn a form into a multi-page wizard.  
          Where [`steps`](multistep.html) splits the **execution** into multiple jobs, `wizard` splits the **input** of a single form into multiple pages.  
          Each wizard step references a [`subform`](subform.html) and is rendered as its own page with Back / Next navigation. A read-only review page is appended automatically as the last step — you do not declare it in YAML.  
          See the [Wizard page](wizard.html) for all step properties and examples.
        examples:
        - name: Three-step wizard
          code: |
            name: Provision host
            type: ansible
            roles:
              - public
            playbook: provision.yml
            wizard:
              - subform: basics
                title: Basics
              - subform: network
                title: Network
                defaultModel: net
              - subform: advanced
                title: Advanced
                optional: true
                when: $(__parent__.basics.kind) === 'vm'
        - name: Wizard mapped one-to-one onto multistep (defaultModel + key)
          code: |
            name: Provision and verify host
            type: multistep
            roles:
              - public
            wizard:
              - subform: basics
                title: Basics
                defaultModel: basics      # wraps fields under `basics`
              - subform: network
                title: Network
                defaultModel: network     # wraps fields under `network`
            steps:
              - name: Create host
                type: ansible
                playbook: create_host.yml
                key: basics                # receives only the basics payload
              - name: Configure network
                type: ansible
                playbook: configure_network.yml
                key: network                # receives only the network payload
      - name: inventory
        type: string
        with_types: ansible, awx
        short: Inventory
        group: workflow
        description: |
          In both awx and ansible core you can pass an inventory.  In the case of ansible core, it will be a yaml file.  In case of awx it will be the inventory name.  
            
          **Note** : You can also dynamically set the inventory by using a field called `__inventory__`.  It must be sent as extravar.  If this extravar is found it will overwrite the static inventory.  
          **Note** : Ansible core allows multiple inventories (so you can use an array), however awx does not support multiple inventories.
          **Note** : If you use multistep and you want to dynamically set every step, use the `key` property and `model` property to create separate extravars per step.              
      - name: executionEnvironment
        type: string
        with_types: awx
        short: Execution Environment
        version: 5.0.0
        group: workflow
        description: |
          In newer versions of AWX you can choose an execution environment.  Use this property to pass it to your template.
            
          **Note** : You can also dynamically set the executionEnvironment by using a field called `__executionEnvironment__`.  It must be sent as extravar.  If this extravar is found it will overwrite the static executionEnvironment.  
          **Note** : If you use multistep and you want to dynamically set every step, use the `key` property and `model` property to create separate extravars per step.   
      - name: instanceGroups
        type: array or string
        with_types: awx
        short: Instance Groups
        version: 5.0.0
        group: workflow
        description: |
          In newer versions of AWX you can choose instance groups.  Use this property to pass it to your template.  
          It can be a single string (name of instancegroup) or an array (list of names).
            
          **Note** : You can also dynamically set the instanceGroups by using a field called `__instanceGroups__`.  It must be sent as extravar.  If this extravar is found it will overwrite the static instanceGroups.  
          **Note** : If you use multistep and you want to dynamically set every step, use the `key` property and `model` property to create separate extravars per step.                       
      - name: scm_branch
        type: string
        with_types: awx
        short: SCM Branch
        version: 5.0.0
        group: workflow
        description: |
          Awx allows to pass the scm branch.  Use this property to pass it to your template.
            
          **Note** : You can also dynamically set the scm branch by using a field called `__scmBranch__`.  It must be sent as extravar.  If this extravar is found it will overwrite the static `scm_branch`.  
          **Note** : If you use multistep and you want to dynamically set every step, use the `key` property and `model` property to create separate extravars per step.
      - name: runner
        type: string
        with_types: ansible, awx
        group: workflow
        version: 7.0.0
        allowed: the name of a runner (Connections > Runners)
        short: Where the job runs
        description: |
          The runner that runs this form's job : a runner of type rte (a runtime environment
          container) for a playbook, a runner of type awx (AWX / Ansible Automation Platform /
          Ascender) for a template. Runners are added under Connections > Runners.
          Without this property the default runner of the matching type is used ; without a
          default the job fails and says how to add one. Since 7 AnsibleForms runs no
          playbook itself.
        examples:
        - name: Run on the vmware runtime
          code: |
            - name: Create a vm
              type: ansible
              playbook: create_vm.yaml
              runner: rte-vmware
        - name: Run a template on a named AAP
          code: |
            - name: Deploy
              type: awx
              template: deploy
              runner: aap-prod
      - name: awx
        type: string
        with_types: awx
        group: workflow
        version: 6.0.0
        allowed: name of a runner of type awx
        short: Deprecated alias of runner
        description: |
          **Deprecated since 7, removed in 8.** Use `runner`. AWX/AAP connections are runners
          of type awx since 7 (Connections > Runners) ; the upgrade moves the existing ones
          there. `awx: <name>` still names that runner, with a warning in the log.
       
          
          **Note** : you can also set these dynamically by using a field called `__awx__`.   It must be sent as extravar.  If this extravar is found it will overwrite the static awx.  
          **Note** : this also works in steps, so each step can have its own set of awx instances.  
          **Note** : If you use multistep and you want to dynamically set every step, use the `key` property and `model` property to create separate extravars per step.              
        examples:
        - name: Add awx instance to your template
          code: |
            awx: my_awx_instance
      - name: awxCredentials
        type: array
        with_types: awx
        group: workflow
        version: 4.0.16
        allowed: name of credential in AWX
        short: Add awx credentials to your template
        description: |
          In AWX you can set credentials on your template.   
          From now on, you can also add credentials from Ansible Forms.
          
          **Note** : you can also set these dynamically by using the a field name __awxCredentials__.   It must be sent as extravar.  If this extravar is found it will overwrite the static awxCredentials.  
          **Note** : this also works in steps, so each step can have its own set of awxCredentials.  
          **Note** : the credentials will be added on top of the ones already selected in the template, they will be merged.  
          **Note** : If you use multistep and you want to dynamically set every step, use the `key` property and `model` property to create separate extravars per step.              
        examples:
        - name: Add awx credentials to your template
          code: |
            awx_credentials:
              - vmware_prod
              - ad_prod
        - name: Dynamically send credentials
          code: |
            fields:
              - name: my_ad_creds
                type: enum
                values:
                  - ad_prod
                  - ad_dev
                default: ad_prod
              - name: __awxCredentials__
                type: expression
                runLocal: true
                expression: "['vmware_prod','$(my_ad_creds)']"
      - name: check
        type: boolean
        with_types: ansible, awx
        group: workflow
        short: Run in check mode
        description: |
          In both awx and ansible core you run a playbook in check mode.  Enable this attribute to do so.  

          **Note** : You can also dynamically set the check mode by using a field called `__check__`.  It must be sent as extravar.  If this extravar is found it will overwrite the static check field.  The field must result in a boolean (expression or checkbox)
          **Note** : If you use multistep and you want to dynamically set every step, use the `key` property and `model` property to create separate extravars per step.              
      - name: limit
        type: text
        with_types: ansible, awx
        allowed: a valid host pattern
        group: workflow
        short: Run against a limited number of hosts
        description: |
          In awx and ansible core you run a playbook against limited hosts by supplying a host pattern.  Use this attribute to do so.  

          **Note** : You can also dynamically set the limit by using a field called `__limit__`.  It must be sent as extravar.  If this extravar is found it will overwrite the static check field.  The field must result in number (number field or expression)
          **Note** : If you use multistep and you want to dynamically set every step, use the `key` property and `model` property to create separate extravars per step.              
      - name: diff
        type: boolean
        with_types: ansible, awx
        short: Run in diff mode
        group: workflow
        description: |
          In both awx and ansible core you run a playbook in diff mode.  Enable this attribute to do so.

          **Note** : You can also dynamically set the check mode by using a field called `__diff__`.  It must be sent as extravar.  If this extravar is found it will overwrite the static diff field.  The field must result in a boolean (expression or checkbox)          
          **Note** : If you use multistep and you want to dynamically set every step, use the `key` property and `model` property to create separate extravars per step.              
      - name: verbose
        type: boolean
        with_types: ansible
        version: 4.0.0
        group: workflow
        short: Run in verbose mode
        description: |
          In ansible core you run a playbook in verbose mode.  Enable this attribute to do so.

          **Note** : You can also dynamically set the verbose mode by using a field called `__verbose__`.  It must be sent as extravar.  If this extravar is found it will overwrite the static diff field.  The field must result in a boolean (expression or checkbox)          
          **Note** : If you use multistep and you want to dynamically set every step, use the `key` property and `model` property to create separate extravars per step.              
      - name: keepExtravars
        type: boolean
        with_types: ansible
        short: Do not remove the extarvars json file
        group: workflow
        version: 4.0.0
        description: |
          In ansible core we temporarily store the extravars in a json file.  After run, this file is removed.  Use this property to disable this behaviour.

          **Note** : You can also dynamically set this property by using a field called `__keepExtravars__`.  It must be sent as extravar.  If this extravar is found it will overwrite the static diff field.  The field must result in a boolean (expression or checkbox)          
          **Note** : If you use multistep and you want to dynamically set every step, use the `key` property and `model` property to create separate extravars per step.              
      - name: allowJinjaInExtravars
        type: boolean
        with_types: ansible
        short: Let ansible template Jinja in the form's values
        group: workflow
        version: 7.0.1
        description: |
          A value that contains Jinja (`{{ }}`, `{% %}` or `{# #}`) is passed to the playbook as plain text - ansible receives it marked unsafe and never templates it. Without this, a user could type `{{ lookup('pipe', '...') }}` into a field and run commands on the RTE. AWX applies the same rule to launch-time extra vars by default.

          Set this to `true` only when the form deliberately passes Jinja for the playbook to evaluate. Values without Jinja are never affected.

          **Note** : You can also dynamically set this property by using a field called `__allowJinjaInExtravars__`. The field must result in a boolean `true`.
      - name: userExtravars
        type: string
        with_types: ansible, awx, multistep
        short: Which keys of the user go into the extravars
        group: workflow
        description: |
          Overrides the `EXTRAVARS_USER_FIELDS` environment variable for this form, so one form can ask for the full user object while the rest of the instance stays trimmed, or the other way around.

          Leave it out and the form follows the global setting.  `all` sends the whole `ansibleforms_user` object, `none` sends no `ansibleforms_user` at all, and a comma separated list such as `username,email,type` sends only those top level keys.

          **Note** : a multistep applies the form's value to every step, including the partial extravars a step receives through `key`.
      - name: abortable
        type: boolean
        with_types: ansible, awx, multistep
        short: Allow aborting the job
        group: workflow
        version: 5.0.8
        default: true
        description: |
          By default you can allow the user to abort the job.  Use this attribute to disable this behaviour.
      - name: allowRelaunch
        type: boolean
        with_types: ansible, awx, multistep
        short: Allow relaunching the job
        group: workflow
        version: 6.2.0
        default: true
        description: |
          By default, users with the `allowJobRelaunch` role option can relaunch any job.  
          Set this to `false` to prevent relaunching this specific form, regardless of user permissions.
        examples:
          - name: Prevent relaunching a form
            code: |
              - name: Production Deployment
                allowRelaunch: false
      - name: launchValidation
        type: string
        with_types: ansible, awx, multistep
        short: Check every launch of this form on the server
        group: workflow
        version: 6.4.1
        allowed: "off, log, enforce"
        default: the LAUNCH_VALIDATION environment variable
        description: |
          Checks every launch of this form on the server against its validation rules, with
          the same engine the browser and the MCP server use - see the `LAUNCH_VALIDATION`
          environment variable for what `log` and `enforce` do.

          Set it on a form that is launched over the REST API : with `enforce`, a launch that
          breaks the form's rules is refused, and the job runs the extravars the **server**
          builds from the checked values - whatever the caller sent as extravars.

          Mind the fields the server computes again : a timestamp (`fn.fnTime()`), a query or
          REST result that changed, or a `runLocal` expression using the browser's timezone or
          locale can come out different from what the user saw, and the server's value runs.
          See `LAUNCH_VALIDATION` ; try `log` first, it names the keys that differ.

          The stricter of this property and `LAUNCH_VALIDATION` wins : a form can be made
          stricter than the instance, never looser. The MCP server always validates and builds
          the extravars itself, whatever this says.

          A wizard form is checked step by step : every step the browser submits is resolved
          against its subform. See the **Launch validation** page of the documentation.
        examples:
          - name: A form that is launched over REST
            code: |
              - name: Create VM
                type: ansible
                roles:
                  - public
                fields: []
                playbook: vm.yml
                launchValidation: enforce
      - name: enableForChat
        type: boolean
        with_types: ansible, awx, multistep
        short: Offer this form in the chat assistant
        group: workflow
        version: 6.5.0
        default: false
        description: |
          The chat assistant (`ENABLE_CHAT`) only offers the forms that set `enableForChat:
          true` - and of those, only the ones the user's roles may open. It is the only
          allowlist : a form without it is never discussed, resolved or launched by the chat,
          even for a user who may open it in the browser.

          The assistant fills the form in with the user, through the same form engine as the
          browser, and never launches it : the user clicks Launch on the exact payload
          the chat showed. Not for wizard forms.
        examples:
          - name: A form the chat may offer
            code: |
              - name: Create a snapshot
                type: ansible
                roles:
                  - public
                fields: []
                playbook: snapshot.yml
                enableForChat: true
      - name: order
        type: integer
        with_types: ansible, awx, multistep
        group: visualization
        version: 5.1.0
        short: Order of the form in the list
        description: |
          The order of the form in the list of forms.  Forms are sorted by this order, so you can have a specific order in the list.
          **Note** : If you do not set this property, it will be ordered alphabetically by name.
      - name: tags
        type: string
        with_types: ansible, awx
        allowed: comma separated tag-list
        group: workflow
        short: Set tags
        description: |
          In both awx and ansible core you can pass tags.  Use this attribute to pass a comma separted list of tags.
            
          **Note** : You can also dynamically set the tags by using a field called `__tags__`.  It must be sent as extravar.  If this extravar is found it will overwrite the static tags.  
          **Note** : If you use multistep and you want to dynamically set every step, use the `key` property and `model` property to create separate extravars per step.            
      - name: approval
        type: object
        with_types: ansible, awx, multistep
        allowed: valid approval object
        group: interaction
        objectLink: forms/form/approval
        docsObjectLink: "approval"
        short: Add approval point
        description: |
          Ansible Forms allows to add an approval point before a job is ran.  
          An approval link is sent by email to a specific approver who can then approve or reject the job.
      - name: notifications
        type: object
        with_types: ansible, awx, multistep
        group: interaction
        allowed: valid notification object
        objectLink: forms/form/notifications
        docsObjectLink: "notifications"
        short: Add Notification
        description: |
          Add email notifications on job status events.
        examples:
        - name: Send on success
          code: |
            notifications:
              recipients:
                - info@ansibleguy.com
              onStatus:
                - success
            
      - name: onSubmit
        type: array
        with_types: ansible, awx, multistep
        group: interaction
        allowed: valid job status action objects
        short: Events on submit
        objectLink: forms/form/job-status-action
        docsObjectLink: "job-status-action"
        version: 3.1.0
        description: |
          Once a job is launched, Ansible Forms has a few status events you can act on.  
          * **onSubmit** : Triggered the moment the submit button is pressed  
          * **onSuccess** : Triggered when the job is finished succesfully  
          * **onFailure** : Triggered when the job was not succesful  
          * **onAbort** : Triggered when the job was aborted  
          * **onFinish** : Triggered when the job is finished, regardless the status  
            
          Follow the link above to learn about the possible job status actions
        examples:
        - name: Examples
          code: |
            onSubmit:
              - clear: 0   # clear form after submit
              - hide: 2   # seconds later, hide the form
            # more examples on the job-status-event page
      - name: onSuccess
        type: array
        with_types: ansible, awx, multistep
        group: interaction
        allowed: valid job status action objects
        short: Events on success
        objectLink: forms/form/job-status-action
        docsObjectLink: "job-status-action"
        version: 3.1.0
        description: |
          Once a job is launched, Ansible Forms has a few status events you can act on.  
