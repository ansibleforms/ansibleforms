---
- name: Environment Variables
  icon: fas,gear
  link: environment-variable
  hideFromReferenceGuide: true
  itemName: variable
  description: |
    Ansibleforms is a nodejs webapplication and is tunable using environment variables.  
    Whether you use docker-compose, kubernetes or you run the webapplication natively, we advise you to get familiar with these variables and learn how to set them in your preferred environment.  
  items:
  - name: NODE_ENV
    type: string
    allowed: a valid nodejs environment
    short: The Node.js environment 
    required: false
    description: Nodejs can have multiple environments, like development or production
    default: production
  - name: DB_HOST
    type: string
    allowed: a valid IP or FQDN
    short: The database host
    hint: Host name or IP address of the MySQL server.
    required: true
    description: |
      Ansible Forms requires a MySQL database connection to store the configuration of the application.  
  - name: DB_PORT
    version: 6.3.0
    type: number
    allowed: a positive integer
    short: Database port
    hint: The TCP port MySQL/MariaDB listens on
    default: 3306
    description: |
      Port of the MySQL or MariaDB server. Required at startup together with DB_HOST,
      DB_USER and DB_PASSWORD - the application cannot reach its database without it, so
      changing it needs a restart.
  - name: DB_USER
    type: string
    allowed: a valid mysql user
    short: The database user
    hint: User name Ansible Forms connects to the database with.
    required: true
    description: |
      Ansible Forms requires a MySQL database connection to store the configuration of the application.

      Give it a user of its own with rights on its schema only - not root :

          CREATE USER 'ansibleforms'@'%' IDENTIFIED BY '<password>';
          GRANT ALL PRIVILEGES ON `AnsibleForms`.* TO 'ansibleforms'@'%';

      That is all the application needs : it creates and patches its schema, makes its backups,
      and ends a dead worker's session (its own sessions, which needs no further right). A user
      with rights on every database turns any hole in the application into a hole in the whole
      database server ; the Status page and the log say so when the user has them.
  - name: DB_PASSWORD
    type: string
    allowed: a valid mysql password
    short: The database password
    hint: Password for that database user.
    required: true
    description: |
      Ansible Forms requires a MySQL database connection to store the configuration of the application.    
  - name: DB_POOL_SIZE
    type: number
    allowed: a positive integer
    short: MySQL connection pool size
    required: false
    default: 20
    description: |
      Maximum number of concurrent MySQL connections kept in the pool.
      All database queries share this pool instead of opening a new connection per query, which dramatically reduces connection overhead and improves throughput under load.
      Increase this if you have many concurrent users or long-running cron-driven jobs; decrease it if your MySQL server has a low `max_connections` limit.
  - name: VAULT_ADDR
    type: string
    allowed: a valid HashiCorp Vault URL
    short: HashiCorp Vault address (deprecated)
    required: false
    description: |
      **Deprecated since 7, removed in 8.** The first 7.x start that finds these variables imports them once as the secret store `vault`; after that they are ignored. Manage the Vault under Connections > Secret stores.
      Base URL of a HashiCorp Vault server (e.g. `https://vault.example.com:8200`).
      When set together with `VAULT_TOKEN`, AnsibleForms can resolve credentials from Vault.
      A credential row in the local database can specify a `vault_path`; when present, the user/password are fetched from Vault at runtime instead of being read from the local encrypted columns.
  - name: VAULT_TOKEN
    type: string
    allowed: a valid Vault token
    short: HashiCorp Vault token (deprecated)
    required: false
    description: |
      **Deprecated since 7, removed in 8.** The first 7.x start that finds these variables imports them once as the secret store `vault`; after that they are ignored. Manage the Vault under Connections > Secret stores.
      Authentication token used by AnsibleForms to read secrets from Vault.
      Required when `VAULT_ADDR` is set.
      Use a token with read-only access to the relevant secret paths.
  - name: VAULT_NAMESPACE
    type: string
    short: HashiCorp Vault namespace (deprecated)
    required: false
    description: |
      **Deprecated since 7, removed in 8.** The first 7.x start that finds these variables imports them once as the secret store `vault`; after that they are ignored. Manage the Vault under Connections > Secret stores.
      Optional Vault Enterprise namespace. Sent as the `X-Vault-Namespace` header on every request.
  - name: VAULT_KV_VERSION
    type: number
    allowed: 1, 2
    short: Vault KV secret engine version (deprecated)
    required: false
    default: 2
    description: |
      **Deprecated since 7, removed in 8.** The first 7.x start that finds these variables imports them once as the secret store `vault`; after that they are ignored. Manage the Vault under Connections > Secret stores.
      Version of the Vault KV secret engine. Defaults to 2 (recommended).
      For KV v2, the client automatically inserts the `/data/` segment in the API path if it is missing.
  - name: VAULT_DEFAULT_MOUNT
    type: string
    short: Default Vault KV mount (deprecated)
    required: false
    default: secret
    description: |
      **Deprecated since 7, removed in 8.** The first 7.x start that finds these variables imports them once as the secret store `vault`; after that they are ignored. Manage the Vault under Connections > Secret stores.
      Default KV mount used when a credential's `vault_path` is provided as a bare key (no slash).
      For example, with the default `secret` mount, `vault_path = "myapp"` resolves to `secret/data/myapp` (KV v2).
  - name: VAULT_CACHE_TTL_MS
    type: number
    short: Vault read cache TTL (ms) (deprecated)
    hint: How long a secret read from Vault is cached, in milliseconds.
    required: false
    default: 60000
    description: |
      **Deprecated since 7, removed in 8.** The first 7.x start that finds these variables imports them once as the secret store `vault`; after that they are ignored. Manage the Vault under Connections > Secret stores.
      Time-to-live in milliseconds of the in-memory cache used by AnsibleForms when reading secrets from Vault.
      Lower this if you rotate secrets aggressively; raise it to reduce load on Vault.
  - name: VAULT_SKIP_VERIFY
    type: string
    allowed: "true, false"
    short: Skip Vault TLS verification (deprecated)
    hint: Skips certificate checks when calling Vault. For development only.
    required: false
    default: "false"
    description: |
      **Deprecated since 7, removed in 8.** The first 7.x start that finds these variables imports them once as the secret store `vault`; after that they are ignored. Manage the Vault under Connections > Secret stores.
      Disable TLS certificate verification when calling Vault. **For development/testing only** — never enable this in production.
  - name: PORT
    type: number
    allowed: a valid TCP port
    short: HTTP port
    description: The listening port of the web application
    default: 8000
  - name: BASE_URL
    type: string
    allowed: a url subpath, for example /ansibleforms
    short: URL subpath to host the application under
    hint: Serves the whole application under a subpath, for use behind a reverse proxy.
    required: false
    default: /
    description: |
      Host the whole application (GUI, REST API and Swagger interface) under a URL subpath, typically behind a reverse proxy.
      For example with `BASE_URL=/ansibleforms`, the application is served under `https://host/ansibleforms/`.
      Note : when using an SSO identity provider (Entra ID / OIDC), make sure the instance url in the provider settings includes the subpath, so the generated redirect uri matches.
  - name: TRUST_PROXY
    version: 7.0.0
    type: string
    allowed: 0, a number of proxies, true, or a comma-separated list of proxy addresses and CIDR ranges
    short: Trusted reverse proxies
    hint: Which reverse proxies may report the client address, so the audit trail records the client and not the proxy.
    required: false
    default: 0
    description: |
      Behind a reverse proxy (nginx, traefik, a kubernetes ingress, a load balancer) every connection comes from the proxy, so without this setting the audit trail records the proxy's address for every action.
      Set it to tell the application which proxies it may believe when they report the real client address in the `X-Forwarded-For` header. It is passed to the Express `trust proxy` setting:

      - `0` (default) : trust no proxy, the address of the connection is recorded
      - a number, for example `1` : trust that many proxies in front of the application (1 = a single reverse proxy). Use the exact count : a higher number lets a client choose the recorded address
      - a comma-separated list of proxy addresses and CIDR ranges, for example `10.0.0.5,172.16.0.0/12`, or the presets `loopback`, `linklocal` and `uniquelocal`
      - `true` : trust every hop, the left-most `X-Forwarded-For` address is recorded

      **Security:** `X-Forwarded-For` is an ordinary request header that any client can send. Only trust proxies that are really in front of the application and that set or overwrite the header themselves, otherwise a client chooses the address the audit trail records. Never use `true` unless the application is reachable only through the proxy; prefer the number of proxies or their addresses.
  - name: DEFAULT_LANGUAGE
    type: string
    allowed: ca, de, en, es, fr, it, nl, pl, pt, ja, zh
    short: Default language
    required: false
    description: |
      Sets the language for the application.  Users can override this in the UI via the language switcher.
      The chosen language is persisted in a cookie.  Both frontend UI and backend error messages are translated.
    default: en
  - name: HTTPS
    type: number
    allowed: 0, 1
    short: Enables HTTPS
    choices:
    - name: 0
      description: Disables https
    - name: 1
      description: Enables https
    description: Our docker-compose comes with sample certificates.  It is highly recommended to enable HTTPS.
    default: 0
  - name: HTTPS_KEY
    type: string
    allowed: a valid file path
    short: Private key
    default: "%PERSISTENT_FOLDER%/certificates/key.pem"
    description: The path to the private key of the server certificate, in BASE64/PEM format.
  - name: HTTPS_CERT
    type: string
    allowed: a valid file path
    short: Certificate
    default: "%PERSISTENT_FOLDER%/certificates/cert.pem"
    description: The path to the server certificate, in BASE64/PEM format.
  - name: ADMIN_USERNAME
    type: string
    allowed: a valid username
    short: Admin username
    version: 5.0.8
    default: admin
    description: |
      The admin username is the first user that can login to the application.  
      This user has full access to the application and is created at first start if not present.
      This user will be added to the `admins` group, which will be created as well if not present.
  - name: ADMIN_PASSWORD
    type: string
    allowed: a valid password
    short: Admin password
    version: 5.0.8
    default: AnsibleForms!123
    description: |
      The admin password is the password for first user that can login to the application.  
      This user has full access to the application and is created at first start if not present.
      This user will be added to the `admins` group, which will be created as well if not present.
  - name: BACKUP_PATH
    type: string
    allowed: a valid directory path
    short: Backup path
    default: "%PERSISTENT_FOLDER%/backups"
    description: |
      Ansible Forms can backup the database and forms.  This is the path where the backups are stored.
      The backup folder is created at first start if not present and a timestamp folder is created for each backup.
  - name: CONFIG_PATH
    version: 6.1.0
    type: string
    allowed: a valid file path
    short: config.yaml path
    default: "%PERSISTENT_FOLDER%/config.yaml"
    description: | 
      The config.yaml file contains application configuration (categories, roles, constants).  
      Forms are not in this file : they are stored in the forms folder (FORMS_FOLDER_PATH).
  - name: CONFIG_SEED_PATH
    version: 6.3.0
    type: string
    allowed: a valid file path
    short: Config seed file
    hint: Declare awx, credentials, oauth2, repositories, ldap and mail in a file instead of clicking them together
    default: ""
    description: |
      Path to a declarative config seed. When set, the yaml file it points to is applied at
      startup and the admin objects it declares become read-only in the interface, so a whole
      instance can be rebuilt from git on an empty database. Secrets are referenced as
      ${ENV_VAR} and resolved from the environment, so the file itself holds none.
      Unrelated to CONFIG_PATH, which holds the forms configuration. An invalid seed makes the
      server refuse to start. See the Config seed page in the documentation.
  - name: CONFIG_SEED_RELOAD_SECONDS
    version: 6.3.0
    type: integer
    allowed: 0 or a number of seconds
    short: Config seed reload interval
    hint: How often the seed file is re-read, so a change in git reaches a running instance
    default: 60
    description: |
      How often the config seed file is checked and re-applied when its content has changed,
      in seconds. This is what lets a seed edited in git take effect without restarting: on
      kubernetes a ConfigMap is remounted under the running pod within about a minute and the
      change is picked up from there. A reload that fails is never fatal, unlike the one at
      startup: the configuration already in force is kept and the Status page reports it.
      Set it to 0 to check only at startup, leaving POST /api/v2/config-seed/apply and SIGHUP.
      Takes effect at once, without a restart.
      Ignored when CONFIG_SEED_PATH is empty.
  - name: ALLOW_ENV_EDIT
    version: 6.3.0
    type: boolean
    allowed: 0, 1
    short: Allow editing these settings
    hint: Turn off where the environment is declared elsewhere, so nothing here can be saved
    default: 1
    description: |
      Whether the settings pages may write persistent/.env. Set it to 0 in a declarative
      deployment (kubernetes, docker-compose, ArgoCD): there the file is either ephemeral, so a
      save is silently lost at the next restart, or durable, so it drifts away from the manifest
      that is meant to be authoritative. With 0 every variable is shown with its value in force
      but cannot be changed, and the save endpoint refuses.
  - name: FORMS_FOLDER_PATH
    version: 6.1.0
    type: string
    allowed: a valid directory path
    short: Forms folder path
    default: "%PERSISTENT_FOLDER%/forms"
    description: | 
      The directory where individual form YAML files are stored.
      Forms can be organized in subdirectories within this folder.
  - name: FORMS_STAGING_PATH
    version: 6.1.0
    type: string
    allowed: a valid directory path
    short: Forms staging folder path
    hint: Where forms live that are not yet committed to a repository.
    default: "%PERSISTENT_FOLDER%/forms_staging"
    description: |
      When forms come from a git repository, a form created or edited in the designer is written
      here first and only lands in the repository once it is pushed. The loader reads this folder
      alongside the repository ones, so a staged form is usable immediately.
  - name: LOCK_PATH
    type: string
    allowed: a valid file path
    short: Designer lock file path (deprecated)
    hint: No longer used - the designer lock is kept in the database.
    default: "%PERSISTENT_FOLDER%/ansibleForms.lock"
    description: |
      Deprecated since 7.0.0 and ignored : the designer lock (who is editing the forms) is kept
      in the database, so every app node sees the same lock. Removed in 8.0.0.
  - name: FORMS_BACKUP_PATH
    version: 4.0.3
    type: string
    allowed: a valid directory path
    short: Backup path for form backups
    default: "%PERSISTENT_FOLDER%/forms_backups"
    description: | 
      When backups are made, they end up in this path    
  - name: OLD_BACKUP_DAYS
    version: 4.0.3
    type: number
    allowed: a whole number where 0 disables the cleanup
    short: Backup retention days
    hint: How long a config restore point is kept. 0 keeps them for ever.
    default: "60"
    description: |
      When backups are made, they are kept for this many days before being removed.
      This applies to form backups made through the designer (not database backups).

      0 keeps every restore point, matching AUDIT_RETENTION_DAYS, JOB_RETENTION_DAYS and
      NIGHTLY_BACKUP_RETENTION. It used to mean the opposite here - everything older than a
      day was removed - while the status page reported it as "never".
  - name: NIGHTLY_BACKUP_RETENTION
    version: 6.1.0
    type: number
    allowed: a whole number where 0 disables the cleanup
    short: Nightly backup retention count
    default: "7"
    description: | 
      Number of automated nightly backups to retain.
      Ansible Forms automatically creates a full backup (database + config + forms) every night at midnight.
      Older nightly backups beyond this count are automatically deleted.
      Set to 0 to disable automatic cleanup (not recommended).
      Only backups that actually contain a usable database dump count towards this number,
      so a run of failed backups can never push a good one out.
  - name: AUDIT_RETENTION_DAYS
    version: 6.3.0
    type: number
    allowed: a whole number where 0 keeps every entry
    short: Audit trail retention in days
    default: "365"
    description: |
      How long entries in the audit trail are kept.
      The trail is append-only, so without a sweep it grows for ever; a daily task at 3:30 AM
      removes entries older than this.
      Set to 0 to keep everything.
  - name: AF_ROLE
    version: 7.0.0
    type: string
    allowed: all, app, worker, rte
    short: What this process runs
    default: all
    description: |
      `all` (the default, or unset) is AnsibleForms as it always ran : the web app and the
      worker in one process. To run several app nodes behind a load balancer, split them :
      `app` serves the web interface and the API only (as many as you like, each with the same
      `ACCESS_TOKEN_SECRET`), and `worker` runs the background work only - the database
      bootstrap and seed, the schedules, the nightly backup, the repository syncs and the
      cleanups. One worker works at a time ; a second one waits and takes over when the first
      stops. App nodes and the worker share the database and the persistent volume.

      `rte` starts the same image as a runtime environment : a small API that runs playbooks
      for an app, with no web interface, scheduler or seed. An RTE needs the app's database
      settings (`DB_*`), the same `ENCRYPTION_SECRET`, and `RTE_TOKEN`. It adds itself under
      Connections > Runners (`RTE_REGISTER`, `RTE_URL`).
  - name: RTE_TOKEN
    version: 7.0.0
    type: string
    allowed: at least 16 characters
    short: The token between an app and its RTE
    description: |
      On an RTE (`AF_ROLE=rte`) : the bearer token every call must carry ; the RTE refuses to
      start without one. The app stores the same token on the runner (Connections > Runners) ;
      an RTE that registers itself (`RTE_REGISTER`) puts it there, and keeps it in step when it
      changes.
  - name: RTE_REGISTER
    version: 7.0.0
    type: number
    allowed: 0 or 1
    short: An RTE adds itself as a runner
    default: "1"
    description: |
      On an RTE (`AF_ROLE=rte`) : 1 (the default) and the RTE adds itself under Connections >
      Runners when it starts, and checks every 30 seconds that it is still there - no click and
      no config seed needed. The first RTE becomes the default runner, so playbook forms run on
      it at once. Its address is `RTE_URL`, or this container's IP address and `PORT` when that
      is not set.

      A runner the RTE registered shows as *automatic* on the Runners page, and as
      *unresponsive* once the RTE stopped writing its heartbeat ; the worker removes it 10
      minutes later. A recreated container registers again under its new address and takes the
      default from the one that stopped. A runner added by hand at the same address stays
      yours (its token follows `RTE_TOKEN`) ; one from the config seed is never touched.

      0 : the RTE does not register itself ; add it under Connections > Runners or in the seed.
  - name: RTE_MAX_JOBS
    version: 7.0.0
    type: number
    allowed: 0 or a positive integer
    default: 10
    short: How many playbooks an RTE runs at once
    hint: Read by an RTE ; 0 sets no limit
    description: |
      Read by an RTE (`AF_ROLE=rte`). A full RTE does not take another job : the job waits, says
      so in its output, and is handed over as soon as a playbook ends (see RTE_QUEUE_MINUTES).
      Size it to the RTE's cpu and memory : every playbook is an ansible-playbook process with its
      forks. Run more RTE replicas to run more at once.
  - name: RTE_DRAIN_SECONDS
    version: 7.0.0
    type: number
    allowed: 0 or a positive integer
    default: 25
    short: How long a stopping RTE waits for its running playbooks
    hint: Read by an RTE ; keep it below the container's stop timeout
    description: |
      Read by an RTE. On a stop (SIGTERM : a rolling update, a scale down) it takes no new job and
      waits this long for the running playbooks to end ; those still running then end as
      abandoned. Keep it below what the platform waits before it kills the container :
      Kubernetes' terminationGracePeriodSeconds (30 by default), docker stop's --time (10).
  - name: RTE_QUEUE_MINUTES
    version: 7.0.0
    type: number
    allowed: 0 or a positive integer
    default: 60
    short: How long a job waits for a busy RTE
    hint: Read by the app nodes and the worker
    description: |
      A job handed to an RTE that is full (RTE_MAX_JOBS) or stopping waits for it, asking again
      every 10 seconds, for this many minutes ; then it fails and says why. An abort ends the
      wait at once.
  - name: RTE_URL
    version: 7.0.0
    type: string
    allowed: an http:// or https:// address, without a slash on the end
    short: The address the app reaches an RTE on
    description: |
      On an RTE (`AF_ROLE=rte`) that registers itself (`RTE_REGISTER`) : the address the app
      calls it on, usually the service name - `http://rte:8000` in docker compose, the service
      in kubernetes. The runner is named after its host (`rte`), so forms can name it with
      `runner: rte`, and every replica behind that address is the same runner.

      Not set : the RTE registers this container's IP address and `PORT`, named after the node
      (`rte-<hostname>-<port>`, as on the Status page). That works without any setting, but the
      address and the name change when the container is recreated - set `RTE_URL` in production.
  - name: JOB_RETENTION_DAYS
    version: 6.3.0
    type: number
    allowed: a whole number where 0 keeps jobs for ever
    short: Job history retention in days
    default: "0"
    description: |
      How long finished jobs and their output are kept. Job output can be large, so this is
      usually the fastest growing table in the database; the Status page reports its size.
      A daily task at 2:30 AM removes finished jobs older than this, together with their output.
      Only finished jobs are ever removed - a running job, or one awaiting approval, is kept
      however old it is.
      Defaults to 0, which means keep everything: upgrading must never silently delete job
      history, so switching this on is a deliberate choice.
  - name: AZURE_GRAPH_URI
    version: 4.0.3
    type: string
    allowed: a valid base URI without slash on the end
    short: The Azure Graph API base URI
    default: https://graph.microsoft.com
    description: |
      The Microsoft Graph endpoint the server calls at an Azure AD login to read the user's
      group membership (`/v1.0/me/transitiveMemberOf`). Since 6.5.3 that call is made by the
      AnsibleForms server, not by the browser, so the server needs a route to it - behind an
      egress proxy set `HTTPS_PROXY` and `NODE_USE_ENV_PROXY=1`. Change it for a national
      cloud, e.g. `https://graph.microsoft.us`.
  - name: ALLOW_SCHEMA_CREATION
    type: number
    allowed: 0, 1
    choices:
    - name: 0
      description: Disables schema creation
    - name: 1
      description: Enables schema creation
    default: 1    
    short: Enable the schema creation
    hint: Allows the database schema to be created on a fresh install.
    description: | 
      When you start Ansible Forms for the first time and there is no database, Ansible Forms will present you the option to create the schema. 
      Although this is fairly handy, you might want to disable this option to prevent accidental schema re-creation.  
      Also note that if you use the docker-compose solution, the database is created as part of the Mysql initialization.  
      If you use a different database, you might want to enable this option, to at the very least create the schema the very first time.  
      If you want to disable this option, set this variable to 0.
    version: 5.0.3      
  - name: REINIT_ADMIN
    type: number
    allowed: 0, 1
    choices:
    - name: 0
      description: Normal startup
    - name: 1
      description: Force reset of the local admin user at startup
    default: 0
    short: Reset the local admin user/password at startup
    description: |
      Recovery hatch when you've lost access to the local `admin` account.
      When set to `1`, AnsibleForms will at startup:
      - ensure the `admins` group exists,
      - if the local admin user already exists, reset its password to the value of `ADMIN_PASSWORD` and re-attach it to the `admins` group,
      - if it doesn't exist, create it (same as a fresh install).

      The action is logged loudly. **This is NOT a runtime auth bypass** — once the admin is back in shape, unset `REINIT_ADMIN` and restart.
    version: 6.0.0
  - name: API_BODY_LIMIT_MB
    type: number
    default: 50
    short: Maximum JSON / urlencoded request body size (MB)
    description: |
      Cap on the size of JSON and urlencoded request bodies accepted by the AnsibleForms API.
      Default is 50 MB, generous enough for large form designs and heavy job extravars.
      Increase if you have unusually large forms or expression payloads.
      Note: this does NOT apply to file uploads (those are governed by `UPLOAD_MAX_GB`).
    version: 6.0.0
  - name: UPLOAD_MAX_GB
    type: number
    default: 10
    short: Maximum size of a single uploaded file (GB)
    description: |
      Cap on the size of a single file uploaded through the form upload field, in gigabytes.
      Default is 10 GB to accommodate large artifacts (e.g. firmware images, upgrade bundles).
      Set to `0` to disable the cap entirely (not recommended on shared instances).
    version: 6.0.0
  - name: REST_ALLOWED_HOSTS
    type: string
    default: ""
    short: Whitelist of hosts/CIDRs reachable from REST expressions
    hint: Hosts and CIDR ranges that REST expressions are allowed to reach.
    description: |
      Comma-separated list of hostnames and/or CIDR ranges that REST helper functions
      (`fn.fnRestBasic`, `fn.fnRestAdvanced`, `fn.fnRestJwt`, `fn.fnRestJwtSecure`) are allowed to call.

      When set, **only** these destinations are allowed; everything else is blocked.
      When unset, no allow-list is applied (default behaviour, all hosts allowed).

      Hostnames are matched case-insensitively against the URL host; CIDRs are matched
      against the IPs that the host resolves to (so an entry like `10.0.0.0/8` blocks all
      private targets in that range regardless of which DNS name was used).

      Example: `REST_ALLOWED_HOSTS=api.example.com,partner.api.com,10.20.0.0/16`

      **Caveat:** this only protects the AnsibleForms Node.js process. Ansible playbooks run
      on the host directly and bypass this guard.
    version: 6.0.0
  - name: REST_DENIED_HOSTS
    type: string
    default: ""
    short: Blacklist of hosts/CIDRs unreachable from REST expressions
    hint: Hosts and CIDR ranges that REST expressions may never reach.
    description: |
      Comma-separated list of hostnames and/or CIDR ranges that REST helper functions
      (`fn.fnRestBasic`, `fn.fnRestAdvanced`, `fn.fnRestJwt`, `fn.fnRestJwtSecure`) must never call.

      Wins over `REST_ALLOWED_HOSTS`. Useful to lock down dangerous targets like cloud
      metadata services or your internal admin UIs:
      `REST_DENIED_HOSTS=169.254.169.254,127.0.0.0/8,internal-secret.example`

      Hostnames are matched case-insensitively against the URL host; CIDRs are matched
      against the IPs that the host resolves to.

      **Caveat:** this only protects the AnsibleForms Node.js process. Ansible playbooks run
      on the host directly and bypass this guard.
    version: 6.0.0
  - name: EXPRESSION_SANITIZER
    type: string
    # legacy is left out on purpose : the settings page builds its dropdown from this list,
    # and legacy can only be set in the real environment
    allowed: off, paranoid, strict
    choices:
    - name: "off"
      description: Server expressions are refused, only runLocal expressions work
    - name: paranoid
      description: Only direct fn./fnc. calls, no methods on their result
    - name: strict
      description: fn./fnc. calls and methods on their result, like fn.fnTime().format('YYYY-MM-DD')
    - name: legacy
      description: The 6.2.1 rules - unsafe, only settable in the real environment
    default: strict
    short: Strictness of the server-side expression sanitizer
    hint: How strictly server expressions (without runLocal) are checked before they run.
    description: |
      Server expressions (fields of type `expression` without `runLocal`) are evaluated on
      the server by any authenticated user. The sanitizer refuses anything that is not a
      call to an `fn.` or `fnc.` function.

      - `off` : every server expression is refused, use `runLocal` instead.
      - `paranoid` : only direct `fn.`/`fnc.` calls. `fn.fnTime().format('YYYY')` is refused.
      - `strict` (default) : `fn.`/`fnc.` calls, and methods on their result.
      - `legacy` : the rules of 6.2.1 and earlier, where anything is allowed once the
        expression starts with `fn.`. **This allows remote code execution for every
        authenticated user.** It exists only as a temporary escape hatch after an upgrade,
        can only be set in the real environment (docker-compose, kubernetes), shows as a
        warning on the status page, and logs every expression the strict rules would refuse.

      An unknown value falls back to `strict`.
    version: 6.3.0
  - name: ENABLE_SSO
    version: 7.0.0
    type: boolean
    allowed: 0, 1
    short: Enable Single Sign-On
    hint: Users can sign in with the SSO providers (Entra ID, OIDC)
    default: 1
    description: |
      Lets users sign in with the active SSO provider of each type (Entra ID, OpenID Connect)
      configured under Settings > SSO. Off, the login page offers no provider and their
      sign-in is refused, while the providers stay configured. Takes effect at once, without a
      restart.
  - name: ENABLE_MCP
    version: 6.4.0
    type: boolean
    allowed: 0, 1
    short: Enable the MCP server for AI agents
    hint: Serves the Model Context Protocol endpoint on /api/v2/mcp
    default: 0
    description: |
      Serves an MCP (Model Context Protocol) server on `/api/v2/mcp`, so an AI agent or an
      MCP client (a chat backend, an IDE) can list the forms a user may use, resolve their
      fields, launch jobs and follow them. Every request carries an AnsibleForms access token
      and runs as that user, with the same form roles and job visibility as in the browser.
      Users whose roles turn off `allowMcp` ("Allow MCP") cannot use it. Takes
      effect at once, without a restart. See the MCP page of the documentation.
  - name: MCP_READ_ONLY
    version: 7.0.0
    type: boolean
    allowed: 0, 1
    short: Block launching and relaunching jobs (read-only)
    hint: AI clients can list, open and fill in forms, but not launch or relaunch jobs
    default: 0
    description: |
      With 1, the MCP server is read-only: it offers no `launch_job` and no `relaunch_job`
      tool and refuses them. An AI client can list the forms, read them, resolve their
      fields and follow jobs, but runs nothing. A safe way to try an agent before letting it
      launch playbooks. Takes effect at once, without a restart.
  - name: MCP_CHAT_FORMS_ONLY
    version: 7.0.0
    type: boolean
    allowed: 0, 1
    short: Only allow the forms offered in the chat
    hint: MCP offers only the forms with enableForChat, the chat assistant's list ; otherwise every form the user may open
    default: 0
    description: |
      With 0 (the default) an MCP client sees every form the user's roles may open. With 1
      it sees only the forms that also set `enableForChat: true` - the chat assistant's
      allowlist, one list for both - and a form or a job of a form left out is not found.
      Takes effect at once, without a restart.
  - name: ENABLE_CHAT
    version: 6.5.0
    type: boolean
    allowed: 0, 1
    short: Enable the chat assistant
    hint: A chat in the browser that fills in and launches forms with an AI model
    default: 0
    description: |
      Shows a chat button on every page. The assistant fills in a form with the user by
      talking, through the same form engine as the browser, and launches it only when the
      user clicks the Launch button on the exact payload it was shown.

      It also needs a model provider on the **Chat assistant** settings page (or in the
      config seed), forms with `enableForChat: true`, and users whose roles allow `allowChat`
      (the default). Form definitions and the values being filled in are sent to that
      provider ; passwords, credentials and job output never are. Takes effect at once,
      without a restart. See the Chat assistant page of the documentation.
  - name: API_TOKEN_MAX_DAYS
    version: 7.0.0
    type: number
    allowed: a positive integer
    default: 90
    short: The longest an api token lives, in days
    hint: A login with ?expiryDays= longer than this is cut to it
    description: |
      A role with the `extendedTokenExpiration` option may log in with `?expiryDays=<n>` and get
      an access token that lives n days, for scripts and integrations. It lives this many days at
      most : a longer request is cut to it. Like every token, it ends sooner when its user
      changes their password (or an admin sets it), or when its session logs out.
  - name: PASSWORD_MIN_LENGTH
    version: 7.0.0
    type: number
    allowed: 0 or a positive integer
    default: 12
    short: The shortest password a person may set
    hint: 0 checks no length
    description: |
      A local password set through the application - a new user, an admin setting it, a user
      changing their own - needs at least this many characters, and is neither the username nor
      the public default password. Length rather than composition rules : a long passphrase is
      strong and easy to remember. ADMIN_PASSWORD at the first start is not checked. Applied
      without a restart.
  - name: CONTENT_SECURITY_POLICY
    version: 7.0.0
    type: number
    allowed: 0, 1
    default: 1
    short: Enforce the Content-Security-Policy
    hint: 0 sends it report only ; needs a restart
    description: |
      The web app is served with a Content-Security-Policy : scripts from the app itself only, so
      a script injected into a page does not run, and no other site may frame it. It allows what
      the app needs : local form expressions (evaluated in the browser), inline styles, images
      from any url (form and category images), and the code editor's workers. With 0 it is sent
      as Content-Security-Policy-Report-Only : the browser's console says what it would block, and
      nothing is blocked - for a setup that cannot work with it yet, a reverse proxy that injects
      its own script for example.
  - name: AUTH_RATE_LIMIT
    version: 7.0.0
    type: number
    allowed: 0 or a positive integer
    default: 120
    short: Requests a minute from one address on the login and token routes
    hint: 0 turns it off
    description: |
      A ceiling on the authentication endpoints - the login, the logout, the token refresh and the
      single sign-on callbacks - per client address and per app node : above it they answer 429
      before any password or token is looked at. Generous, so that a person or a script never
      reaches it ; LOGIN_MAX_FAILURES is what stops a password from being guessed. Behind a
      reverse proxy, set TRUST_PROXY so the address is the client's. Applied without a restart.
  - name: LOGIN_MAX_FAILURES
    version: 7.0.0
    type: number
    allowed: 0 or a positive integer
    default: 5
    short: Failed logins before an account locks
    hint: 0 turns the account lockout off
    description: |
      After this many failed logins in a row, an account (local or LDAP) is locked for
      LOGIN_LOCKOUT_MINUTES : every attempt is refused with status 429 before any password is
      checked, whether the account exists or not. A successful login clears the count, and so
      does an admin setting the user's password. Counted in the database, so every app node
      sees the same attempts. 0 turns the lockout off. Applied without a restart.
  - name: LOGIN_MAX_FAILURES_PER_IP
    version: 7.0.0
    type: number
    allowed: 0 or a positive integer
    default: 30
    short: Failed logins from one address before it is held back
    hint: 0 turns the per-address limit off
    description: |
      One address trying many accounts : after this many failed logins within
      LOGIN_LOCKOUT_MINUTES, every login from it is refused with status 429 until that window
      ends. Behind a reverse proxy, set TRUST_PROXY so the address is the client's and not the
      proxy's. 0 turns it off. Applied without a restart.
  - name: LOGIN_LOCKOUT_MINUTES
    version: 7.0.0
    type: number
    allowed: 0 or a positive integer
    default: 15
    short: How long a locked account stays locked
    hint: Also the window the failures are counted in ; 0 turns both limits off
    description: |
      How long an account stays locked after LOGIN_MAX_FAILURES failed logins, and the window
      in which the failures of an account and of an address are counted. 0 turns the lockout and
      the per-address limit off. Applied without a restart.
  - name: LAUNCH_VALIDATION
    version: 6.4.0
    type: string
    allowed: off, log, enforce
    choices:
    - name: "off"
      description: No server-side check, the job runs the extravars the client sent
    - name: log
      description: Launches that would be refused are logged as a warning and still run
    - name: enforce
      description: Launches whose field values break the form's rules are refused
    default: enforce
    short: Check the field values of every launch against the form's validation rules
    hint: off does nothing, log logs what would be refused, enforce refuses the launch
    description: |
      Checks every launch from the browser or the REST API (`POST /api/v2/job`) on the
      server against the form's validation rules - `required`, `regex`, `minValue`/`maxValue`,
      `minLength`/`maxLength`, `minSize`/`maxSize`, `sameAs`, `in`/`notIn`,
      `validIf`/`validIfNot`, valid YAML - with the same engine the browser and the MCP
      server use. The check runs the form's expressions and queries again, as the user who
      launches, so it costs one extra evaluation of the form per launch.

      - `enforce` (default) : a launch whose field values break the form's rules is refused
        with status 422 and the failing fields. A launch that sends no `rawFormData` (a REST
        call that leaves it out) is refused as well, because its values cannot be checked.
        A valid launch runs the extravars and credentials the SERVER builds from the checked
        values, not the ones the client sent : computed fields (expressions, queries) are
        the server's evaluation, and a file field must point at a real upload in
        `UPLOAD_PATH`. A wizard form is checked step by step, and a planned run ("Run
        later") when it is planned and again when it fires.
      - `log` : a launch that would be refused is logged as a warning and still runs. It
        also names the extravars keys where what the client sent differs from what the
        server builds (never their values). Use it to see what enforcing refuses, for
        instance before an upgrade.
      - `off` : no check. The job runs the extravars and credentials the client sent, which
        a REST caller chooses freely : only for an instance whose every launcher is trusted.
        An unset or unknown value is `enforce`.

        **What the user saw is not always what runs.** The server evaluates every computed
        field again at launch, a moment after the browser did, as the launching user. A value
        that depends on WHEN or WHERE it is evaluated can differ, and then the server's value
        runs :
          - time : `fn.fnTime()`, `new Date()`, a timestamp or a name built from it ;
          - outside data : a query, `fnRestAdvanced` / `fnSsh` / `fnDnsResolve`, a file read
            - if the data changed in between ;
          - the browser's own settings : a `runLocal` expression using the user's timezone or
            locale (`toLocaleString`) runs with the server's.
        The same goes for validation : a rule that reads such a field (`notIn` against a
        query's result, `validIf` on a computed flag) is checked against the server's value.
        Run `log` for a while if you are unsure : it names every extravars key where the
        client and the server differ, so you see which forms this affects.

      The rows of a `list` field that were added or edited go through their subform on the
      server as well, with the form's values as `__parent__` : its rules are checked and
      its computed fields evaluated. Rows the list's own expression produced, and rows
      marked deleted, are sent as they are - as in the browser. At most 500 rows are
      resolved per launch. Applied without a restart.

      A form can be made stricter with its own `launchValidation` property ; the stricter of
      the two wins. See the **Launch validation** page of the documentation for the whole
      picture : what is checked, list rows, uploads, passwords and how to roll it out.
  - name: ENABLE_DB_QUERY_LOGGING
    type: number
    allowed: 0, 1
    choices:
    - name: 0
      description: Disables the database query logging
    - name: 1
      description: Enables the database query logging
    default: 0
    short: Enable the database query logging
    hint: Logs every database query. Very noisy, for debugging only.
    description: | 
      When you want to see the database queries that are executed, you can enable this option by setting this variable to 1.  
      introduced, due to massive amount of logging of database queries, which can be useful for debugging, but not for production.
    version: 5.0.3    
  - name: ENABLE_CONFIG_IN_DATABASE
    type: number
    allowed: 0, 1
    choices:
    - name: 0
      description: Disables the config.yaml in database
    - name: 1
      description: Enables the config.yaml in database
    default: 0
    short: Store the configuration in the database
    hint: Stores config.yaml in the database instead of on disk.
    description: | 
      If you use git repositories to store the forms, you can choose to store the master config.yaml in git as well.  
      Or, you can choose to have the config.yaml in the database instead. Having a clean separation: master config.yaml in database, and the actual forms in git.
      
      This gives the config.yaml in the database the highest priority in the loading order.
    version: 6.1.0
  - name: GIT_CLONE_COMMAND
    type: string
    allowed: a valid git clone command
    short: Git clone command
    default: "git clone"
    description: |
      The command used to clone git repositories.  Note that branch and repository will be auto added.
    version: 6.0.2
  - name: GIT_PULL_COMMAND
    type: string
    allowed: a valid git pull command
    short: Git pull command
    default: "git pull"
    description: |
      The command used to pull git repositories.  Note that branch and repository will be auto added.
  - name: GIT_PUSH_COMMAND
    type: string
    allowed: a valid git push command
    short: Git push command
    default: "git push"
    description: |
      The command used to push git repositories (used by the designer's sync to git feature).  Note that `-u origin HEAD` will be auto added.
  - name: SHOW_DESIGNER
    type: number
    allowed: 0, 1
    choices:
    - name: 0
      description: Hides the designer
    - name: 1
      description: Shows the designer
    default: 1    
    short: Enable the internal designer
    hint: Shows the built-in config.yaml designer in the menu.
    description: | 
      Although we encourage you to use an editor such as **Visual Studio Code** to edit the config.yaml file, preferably with some form of source control.  Ansible Forms comes with an internal yaml designer.  
      And although only admins can see the designer, you might want to disable it completely by setting this variable to 0.
    version: 4.0.0
  - name: USE_YTT
    type: number
    allowed: 0, 1
    choices:
      - name: 0
        description: Does not execute ytt on the config.yaml
      - name: 1
        description: Executes ytt on the config.yaml
    default: 0
    short: Enable the ytt interpreter
    description: |
      https://github.com/carvel-dev/ytt is a tool for yaml templating. It can be activated by this variable.
    version: 5.0.2
  - name: YTT_ALLOW_SYMLINK_DESTINATIONS
    type: string
    allowed: valid paths
    short: ytt allowed symlink destinations
    hint: Paths that ytt templates are allowed to follow symlinks into.
    default: ""
    description: |
      Ytt disables templating with symlinks by default.  If you want to allow symlink use on specific directories, this variable can be set to the path(s) where the symlinks are allowed (multiple paths separated by Node's `path.delimiter`). Note: enabling this may come with some risks, see ytt FAQ for more info.
    version: 5.0.8
  - name: YTT_DANGEROUS_ALLOW_ALL_SYMLINK_DESTINATIONS
    type: number
    allowed: 0, 1
    choices:
      - name: 0
        description: Disables all symlink destinations
      - name: 1
        description: Enables all symlink destinations
    default: 0
    short: ytt dangerous allow-all symlink destinations
    hint: Lets ytt follow symlinks anywhere. Unsafe.
    description: |
      Ytt disables templating with symlinks by default.  If you want to allow all symlink use EVERYWHERE, you can set this variable to 1. Note: enabling this comes with some risks (hence the 'DANGEROUS' part), see ytt FAQ for more info.
    version: 5.0.8
  - name: YTT_VARS_PREFIX
    type: string
    allowed: a valid prefix
    short: ytt vars prefix
    default: ""
    description: |
      Environment variable prefix for ytt to get data values from. For example, when set to `MY_PREFIX`, `MY_PREFIX_my_var=value` results to the ytt data value `my_var=value`.
    version: 5.0.8
  - name: YTT_LIB_DATA_{dynamic}
    type: string
    allowed: a valid lib data value
    short: ytt lib data
    default: ""
    description: |
      This is not a single variable but rather an infinite amount of variables.  You can set as many as you want.  The dynamic part is the name of the lib data.  For example `YTT_LIB_DATA_MYLIB=values.yml` results in the contents of `values.yml` to be used by ytt in the `mylib` library.
    version: 5.0.8
  - name: PROCESS_MAX_BUFFER
    type: number
    allowed: a valid number
    short: The playbook output an RTE stores per stream
    default: 50 * 1024 * 1024
    description: |
      Read by an RTE (`AF_ROLE=rte`) : past this many bytes on one stream (stdout, stderr), a
      playbook's output is no longer stored - one line in the job says so - and the playbook goes
      on to its end (until 7.0.0 it was stopped there, at 1 MiB by default). Since 7 the app runs
      no playbook itself, so set this in the RTE container's environment ; it is not editable on
      the Settings page.
    version: 5.0.8
  - name: METRICS_TOKEN
    version: 7.0.0
    type: string
    allowed: a long random string
    default: none (metrics off)
    short: The bearer token of the Prometheus metrics
    hint: Unset, /api/v2/metrics answers 404 ; needs a restart
    description: |
      Set, an app node or the worker serves Prometheus metrics at `/api/v2/metrics` and an RTE at
      `/metrics`, to a scraper that sends `Authorization: Bearer <METRICS_TOKEN>`. Unset, they
      answer 404.

      - the process : cpu, memory, event loop lag, garbage collection (`af_process_*`, `af_nodejs_*`) ;
      - `af_http_requests_total{route,method,status}`, `af_http_request_duration_seconds{route}` ;
      - `af_jobs{status}` running and awaiting approval now, `af_jobs_ended_24h{status}` ;
      - `af_nodes{role,alive}` ; `af_login_failures_total`, `af_login_lockouts_total` ;
      - an RTE : `af_rte_running_jobs`, `af_rte_max_jobs`.
  - name: LOG_FORMAT
    version: 7.0.0
    type: string
    allowed: text, json
    default: text
    short: The format of the log lines
    hint: json writes one JSON object a line ; needs a restart
    description: |
      `text` (default) : `<time> <level>: <message>`, colored in the console and the log file.
      `json` : one JSON object a line - `time` (ISO), `level`, `message`, `requestId`, `role` and
      `host` - for a log collector (Loki, ELK, Splunk...). Syslog keeps its own format.

      Every request gets an id : the X-Request-Id a reverse proxy sent, or a new one. It is
      returned in the response's X-Request-Id header and carried by every line written while the
      request is served (`[req <id>]` in text), so a request can be followed through the log and
      matched with the proxy's.
  - name: LOG_LEVEL
    type: string
    allowed: emerg, alert, crit, error, warning, notice, info, debug
    choices:
    - name: error
      description: Error message, something is wrong
    - name: warn
      description: Warning message, something is off, but acceptable
    - name: notice
      description: Notice message, something happened worth mentioning
    - name: info
      description: Info message, just saying, nothing fancy
    - name: debug
      description: Debug message, if you really want to know more details
    default: notice    
    short: Log level
    description: | 
      Ansible Forms logs to logfile called Ansible Forms.log.  
      It does so in multiple levels.  
  - name: LOG_RETENTION_DAYS
    version: 7.0.0
    type: number
    allowed: a whole number where 0 keeps the log files for ever
    short: Log file retention in days
    hint: How many days of server log files are kept (0 keeps them all)
    default: "30"
    description: |
      How many days of server log files are kept: the main log and the errors log, one file a
      day, zipped once the day is over. Older files are deleted. 0 keeps every file. Takes
      effect at once, without a restart.
  - name: LOG_PATH
    type: string
    allowed: a valid folder path
    default: "%PERSISTENT_FOLDER%/logs"
    short: Path for logfiles
    description: | 
      Ansible Forms maintains 2 logfiles.  `ansibleforms.log` and `ansibleforms.errors.log`   
    changelog:
      - version: 4.0.0
        type: added
        description: Make the logfiles rotating with daily timestamp.  30days of logs are kept.
  - name: LOG_CONSOLE_LEVEL
    type: string
    allowed: emerg, alert, crit, error, warning, notice, info, debug
    choices:
    - name: error
      description: Error message, something is wrong
    - name: warn
      description: Warning message, something is off, but acceptable
    - name: notice
      description: Notice message, something happened worth mentioning
    - name: info
      description: Info message, just saying, nothing fancy
    - name: debug
      description: Debug message, if you really want to know more details
    default: notice
