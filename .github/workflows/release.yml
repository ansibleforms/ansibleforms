name: Release

# release-please keeps ONE open pull request per release line, "chore: release x.y.z", up to
# date with every merge into that line : it computes the next version from the Conventional
# Commit titles of the squashed pull requests, bumps server/package.json and writes the
# CHANGELOG section. Merging that pull request is the release : this same workflow then
# creates the tag and the GitHub release, and publishes the image (see publish.yml for the
# tags).
#
# Two lines : main (the next major) and release/<major>.x (patches for the current one).
# Each branch has its own manifest and CHANGELOG ; the tags never collide (6.5.3, 7.0.1).
#
# The token comes from the GitHub App ansibleforms-release, not GITHUB_TOKEN. A pull request
# opened with GITHUB_TOKEN starts no workflows, so the release pull request would never get
# its required checks and could never be merged. See RELEASING.md for the App setup.
#
# A release also rebuilds ansibleforms.com : the site (ansibleforms/website) pulls
# CHANGELOG.md and server/help.yaml from here when it is built. It moves the Helm chart's
# default image (ansibleforms/helm-charts) and releases the installer, the RTE builder and the RTE
# Runner with the same version (ansibleforms/installer, ansibleforms/builder, ansibleforms/runner).

on:
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY - see RELEASING.md
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

      # A patch release on an older line would take GitHub's "Latest release" badge from the
      # newer major. Give it back to the highest final version.
      - name: Keep the Latest badge on the highest release
        if: steps.rp.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          highest=$(gh api "repos/${{ github.repository }}/tags" --paginate --jq '.[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -n "$highest" ] && [ "$highest" != "$TAG" ]; then
            gh release edit "$highest" --repo "${{ github.repository }}" --latest
            echo "Latest stays on $highest (released $TAG)"
          fi

  publish:
    name: Publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
      ref: ${{ needs.release-please.outputs.tag_name }}
      channel: release
    secrets: inherit

  # Tells ansibleforms/website to rebuild, so its changelog page shows this release.
  # GITHUB_TOKEN cannot start a workflow in another repository, so the token comes from the
  # same GitHub App as above, which is installed on ansibleforms/website too. It is asked for
  # that one repository only. Should this job fail, the site still catches up on its nightly
  # run - the release itself is already done.
  website:
    name: Rebuild the website
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: website

      - name: Send app-release to ansibleforms/website
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api repos/ansibleforms/website/dispatches -f event_type=app-release -f "client_payload[tag]=$TAG"
          echo "ansibleforms/website rebuilds for $TAG"

  # Tells ansibleforms/helm-charts about the release, so the chart's default image follows
  # it: its "Follow app release" workflow opens a pull request on the chart line of this
  # major that moves the image, and merges it once the chart's CI passed. It waits for
  # publish because that CI installs the new image. The token comes from the same GitHub
  # App, asked for that one repository. Should this job fail, run "Follow app release" in
  # helm-charts by hand with the version.
  helm-charts:
    name: Tell the Helm chart
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: helm-charts

      - name: Send app-release to ansibleforms/helm-charts
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api repos/ansibleforms/helm-charts/dispatches -f event_type=app-release -f "client_payload[tag]=$TAG"
          echo "ansibleforms/helm-charts follows $TAG"

  # Tells ansibleforms/docker about the release, so it tags its setup of this version as
  # v<version> (the head of the branch of this major): the installer fetches the compose file
  # and the data from that tag. The token comes from the same GitHub App, asked for that one
  # repository. Should this job fail, run "Tag app release" in ansibleforms/docker by hand.
  docker:
    name: Tag the docker setup
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: docker

      - name: Send app-release to ansibleforms/docker
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api repos/ansibleforms/docker/dispatches -f event_type=app-release -f "client_payload[tag]=$TAG"
          echo "ansibleforms/docker tags v$TAG"

  # Attaches the bundles to the release: AnsibleForms built and ready to run with Node.js, for
  # the installer's native mode (directly on a server, no containers). node-jq and bcrypt bring
  # native binaries, so each architecture is built on a machine of its own
  # (scripts/build-bundle.sh). GITHUB_TOKEN uploads to this repository's own release.
  bundle:
    name: Bundle (${{ matrix.arch }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Build the bundle
        run: ./scripts/build-bundle.sh "${{ needs.release-please.outputs.tag_name }}" dist

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"

  # Tells ansibleforms/builder about the release, so the RTE builder is released with the same
  # version : its Follow app release workflow checks the socket contract is still the builder's,
  # moves the builder to the version and merges that once its CI passed ; its release workflow then
  # publishes ghcr.io/ansibleforms/ansibleforms-rte-builder and creates the release. The token comes
  # from the same GitHub App, asked for that one repository. Should this job fail, run "Follow app
  # release" in ansibleforms/builder by hand with the version.
  builder:
    name: Release the RTE builder
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: builder

      - name: Send app-release to ansibleforms/builder
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api repos/ansibleforms/builder/dispatches -f event_type=app-release -f "client_payload[tag]=$TAG"
          echo "ansibleforms/builder releases $TAG"

  # Tells ansibleforms/runner about the release, so the RTE Runner (in Go) is released with the
  # same version : its Follow app release workflow checks the socket contract is still the Runner's,
  # moves the Runner to the version and merges that once its CI passed ; its release workflow then
  # publishes ghcr.io/ansibleforms/ansibleforms-rte-runner and creates the release. The token comes
  # from the same GitHub App, asked for that one repository. Should this job fail, run "Follow app
  # release" in ansibleforms/runner by hand with the version.
  runner:
    name: Release the RTE Runner
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: runner

      - name: Send app-release to ansibleforms/runner
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api repos/ansibleforms/runner/dispatches -f event_type=app-release -f "client_payload[tag]=$TAG"
          echo "ansibleforms/runner releases $TAG"

  # Tells ansibleforms/installer about the release, so the installer is released with the same
  # version: its release workflow builds the binaries with that version written in and creates
  # the release v<version> there. It waits for publish, bundle and docker because the
  # installer installs the new images (or the bundle, on a server without containers) with
  # the compose file and the data of the docker setup's new tag. The token comes
  # from the same GitHub App, asked for that one repository. Should this job fail, run
  # "Release" in ansibleforms/installer by hand with the version.
  installer:
    name: Release the installer
    needs: [release-please, publish, bundle, docker]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: installer

      - name: Send app-release to ansibleforms/installer
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api repos/ansibleforms/installer/dispatches -f event_type=app-release -f "client_payload[tag]=$TAG"
          echo "ansibleforms/installer releases v$TAG"
