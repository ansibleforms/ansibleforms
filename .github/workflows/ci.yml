name: CI

# Runs on every pull request, and on main after a merge.
#
# Client and server are separate jobs so they run in parallel - the server suite is the
# long pole (~1 minute) and the client is a few seconds plus a build.
#
# No secrets are used anywhere in this workflow, which is deliberate : pull requests come
# from forks, and a fork's GITHUB_TOKEN is read-only with no access to secrets. A check
# that needed one would simply never run on the PRs that matter.

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']
  # Daily, because some things break with no commit at all and a PR-triggered run only
  # ever asks about changes. This repository has already had one: a retention test dated
  # its fixtures relative to a fixed day and measured them against the real clock, so it
  # went red on its own and stayed red for ten days - the discovery path was an innocent
  # contributor opening a PR and being unable to tell whether they had broken it.
  # It costs about two minutes and is free on a public repository, so daily rather than
  # weekly : the only difference is whether that sits for a day or for a week.
  # Note GitHub disables scheduled workflows after 60 days of repository inactivity.
  schedule:
    - cron: '40 3 * * *'

permissions:
  contents: read

# A new push to the same PR cancels the run it supersedes. A push to a branch is grouped by
# its commit instead, so every merge gets its own complete run : a group on the branch name
# would let a burst of merges (auto-merged dependabot PRs) cancel each other, and the
# cancelled runs show as a red X on commits that never failed.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      # `npm ci` from client/package-lock.json - the root lockfile is not in the repo
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm run test -- --coverage --coverage.reporter=text --coverage.reporter=json-summary

      # Reported, not enforced. There is no threshold and this step cannot fail the job :
      # a number in the summary lets a reviewer see that a PR added 300 lines of untested
      # model code, while a gate on a 33% baseline would only teach people to raise the
      # gate. `always()` so the figure still appears when a test failed.
      - name: Coverage summary
        if: always()
        run: |
          test -f coverage/coverage-summary.json || exit 0
          {
            echo "### Client coverage"
            echo ""
            echo "| metric | % |"
            echo "| --- | --- |"
            jq -r '.total | to_entries[] | select(.key | test("^(lines|statements|functions|branches)$")) | "| \(.key) | \(.value.pct)% |"' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint:check

      # No database service here on purpose. The suite runs against the stubs in
      # tests/__mocks__, and the schema tests read src/db/*.sql as TEXT rather than
      # executing it. The SQL itself runs in the `database` job below.
      - name: Test
        # The server warns at startup when it has to make up a JWT secret. A fixed, throwaway
        # one keeps that warning out of the test output.
        env:
          ACCESS_TOKEN_SECRET: ci-not-a-real-secret
        run: npm run test -- --coverage --coverage.reporter=text --coverage.reporter=json-summary

      # see the note on the client's copy of this step - reported, never enforced
      - name: Coverage summary
        if: always()
        run: |
          test -f coverage/coverage-summary.json || exit 0
          {
            echo "### Server coverage"
            echo ""
            echo "| metric | % |"
            echo "| --- | --- |"
            jq -r '.total | to_entries[] | select(.key | test("^(lines|statements|functions|branches)$")) | "| \(.key) | \(.value.pct)% |"' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

  # The schema on a real database : the fresh install creates it, the patches run a second time
  # on the next start, and both must leave exactly what the schema manifest says - the unit tests
  # never execute SQL. MySQL and MariaDB, as both are supported.
  database:
    name: Database (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: ["mysql:8.4", "mariadb:11"]
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: ci-not-a-real-password
          MARIADB_ROOT_PASSWORD: ci-not-a-real-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent || mariadb-admin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: server
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci-not-a-real-password
      ACCESS_TOKEN_SECRET: ci-not-a-real-secret-0123456789
      ENCRYPTION_SECRET: ci-not-a-real-secret-0123456789ab
      HTTPS: "0"
      PORT: "8000"
      LOG_PATH: /tmp/af-logs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: First start - the fresh install creates the schema
        run: |
          node ./index.js > /tmp/af-first.log 2>&1 &
          echo $! > /tmp/af.pid
          node scripts/ci-database.mjs http://127.0.0.1:8000
          kill "$(cat /tmp/af.pid)"
          sleep 3

      - name: Second start - the patches run on the existing schema
        run: |
          node ./index.js > /tmp/af-second.log 2>&1 &
          echo $! > /tmp/af.pid
          node scripts/ci-database.mjs http://127.0.0.1:8000
          kill "$(cat /tmp/af.pid)"

      - name: An upgrade - a backup first, then the patches
        env:
          BACKUP_PATH: /tmp/af-backups
          FORMS_BACKUP_PATH: /tmp/af-backups/forms
          # the runner's mysqldump is MySQL's : against MariaDB it must not ask for column statistics
          MYSQLDUMP_COMMAND: ${{ startsWith(matrix.db, 'mariadb') && 'mysqldump --column-statistics=0' || 'mysqldump' }}
        run: |
          # a table 7.0.0 drops : the database looks like an install to upgrade
          node -e "import('mysql2/promise').then(async (m) => { const c = await m.createConnection({ host: '127.0.0.1', user: 'root', password: process.env.DB_PASSWORD }); await c.query('CREATE TABLE AnsibleForms.staging (id int)'); await c.end(); })"
          node ./index.js > /tmp/af-upgrade.log 2>&1 &
          echo $! > /tmp/af.pid
          node scripts/ci-database.mjs http://127.0.0.1:8000
          kill "$(cat /tmp/af.pid)"
          grep -q "Backed up the database before the upgrade" /tmp/af-upgrade.log || { echo "::error::no backup before the upgrade"; exit 1; }
          test -n "$(ls /tmp/af-backups)" || { echo "::error::the backup folder is empty"; exit 1; }
          node -e "import('mysql2/promise').then(async (m) => { const c = await m.createConnection({ host: '127.0.0.1', user: 'root', password: process.env.DB_PASSWORD }); const [r] = await c.query(\"SHOW TABLES FROM AnsibleForms LIKE 'staging'\"); await c.end(); if (r.length) { console.error('staging was not dropped'); process.exit(1); } })"

      - name: No error in the logs
        run: |
          if grep -E " error:" /tmp/af-first.log /tmp/af-second.log /tmp/af-upgrade.log; then
            echo "::error::the app logged errors against ${{ matrix.db }}"
            exit 1
          fi

      - name: The logs, when it failed
        if: failure()
        run: tail -n 200 /tmp/af-first.log /tmp/af-second.log /tmp/af-upgrade.log || true

  schema:
    name: Public schema is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # server/schema/public/*.json is generated but committed, and it is only
      # regenerated inside publish.sh / publish-rc.sh - so it silently goes stale
      # between releases. jq is preinstalled on the runner.
      - name: Regenerate
        run: ./server/schema/build-public-schema.sh

      - name: Fail if the committed copy differs
        run: |
          if ! git diff --quiet -- server/schema/public; then
            echo "::error::server/schema/public is out of date - run ./server/schema/build-public-schema.sh and commit the result"
            git diff -- server/schema/public
            exit 1
          fi
          echo "server/schema/public matches the authoritative schema"

  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      # flags a dependency the PR adds that has a known advisory
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
