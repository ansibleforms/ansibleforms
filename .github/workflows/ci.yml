name: CI

# Runs on every pull request, and on main after a merge.
#
# Client and server are separate jobs so they run in parallel - the server suite is the
# long pole (~1 minute) and the client is a few seconds plus a build.
#
# No secrets are used anywhere in this workflow, which is deliberate : pull requests come
# from forks, and a fork's GITHUB_TOKEN is read-only with no access to secrets. A check
# that needed one would simply never run on the PRs that matter.

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']
  # Daily, because some things break with no commit at all and a PR-triggered run only
  # ever asks about changes. This repository has already had one: a retention test dated
  # its fixtures relative to a fixed day and measured them against the real clock, so it
  # went red on its own and stayed red for ten days - the discovery path was an innocent
  # contributor opening a PR and being unable to tell whether they had broken it.
  # It costs about two minutes and is free on a public repository, so daily rather than
  # weekly : the only difference is whether that sits for a day or for a week.
  # Note GitHub disables scheduled workflows after 60 days of repository inactivity.
  schedule:
    - cron: '40 3 * * *'

permissions:
  contents: read

# A new push to the same PR cancels the run it supersedes. A push to a branch is grouped by
# its commit instead, so every merge gets its own complete run : a group on the branch name
# would let a burst of merges (auto-merged dependabot PRs) cancel each other, and the
# cancelled runs show as a red X on commits that never failed.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      # `npm ci` from client/package-lock.json - the root lockfile is not in the repo
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm run test -- --coverage --coverage.reporter=text --coverage.reporter=json-summary

      # Reported, not enforced. There is no threshold and this step cannot fail the job :
      # a number in the summary lets a reviewer see that a PR added 300 lines of untested
      # model code, while a gate on a 33% baseline would only teach people to raise the
      # gate. `always()` so the figure still appears when a test failed.
      - name: Coverage summary
        if: always()
        run: |
          test -f coverage/coverage-summary.json || exit 0
          {
            echo "### Client coverage"
            echo ""
            echo "| metric | % |"
            echo "| --- | --- |"
            jq -r '.total | to_entries[] | select(.key | test("^(lines|statements|functions|branches)$")) | "| \(.key) | \(.value.pct)% |"' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint:check

      # No database service here on purpose. The suite runs against the stubs in
      # tests/__mocks__, and the schema tests read src/db/*.sql as TEXT rather than
      # executing it. The SQL itself runs in the `database` job below.
      - name: Test
        # The server warns at startup when it has to make up a JWT secret. A fixed, throwaway
        # one keeps that warning out of the test output.
        env:
          ACCESS_TOKEN_SECRET: ci-not-a-real-secret
        run: npm run test -- --coverage --coverage.reporter=text --coverage.reporter=json-summary

      # see the note on the client's copy of this step - reported, never enforced
      - name: Coverage summary
        if: always()
        run: |
          test -f coverage/coverage-summary.json || exit 0
          {
            echo "### Server coverage"
            echo ""
            echo "| metric | % |"
            echo "| --- | --- |"
            jq -r '.total | to_entries[] | select(.key | test("^(lines|statements|functions|branches)$")) | "| \(.key) | \(.value.pct)% |"' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

  # The schema on a real database : the fresh install creates it, the patches run a second time
  # on the next start, and both must leave exactly what the schema manifest says - the unit tests
  # never execute SQL. MySQL and MariaDB, as both are supported.
  database:
    name: Database (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # MySQL 9.7, the current LTS (the docker setup's), 8.4 the one before it (v6, the Helm
        # chart), and MariaDB
        db: ["mysql:9.7", "mysql:8.4", "mariadb:11"]
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: ci-not-a-real-password
          MARIADB_ROOT_PASSWORD: ci-not-a-real-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent || mariadb-admin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: server
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci-not-a-real-password
      ACCESS_TOKEN_SECRET: ci-not-a-real-secret-0123456789
      ENCRYPTION_SECRET: ci-not-a-real-secret-0123456789ab
      HTTPS: "0"
      PORT: "8000"
      LOG_PATH: /tmp/af-logs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: First start - the fresh install creates the schema
        run: |
          node ./index.js > /tmp/af-first.log 2>&1 &
          echo $! > /tmp/af.pid
          node scripts/ci-database.mjs http://127.0.0.1:8000
          kill "$(cat /tmp/af.pid)"
          sleep 3

      - name: Second start - the patches run on the existing schema
        run: |
          node ./index.js > /tmp/af-second.log 2>&1 &
          echo $! > /tmp/af.pid
          node scripts/ci-database.mjs http://127.0.0.1:8000
          kill "$(cat /tmp/af.pid)"

      - name: An upgrade - a backup first, then the patches
        env:
          BACKUP_PATH: /tmp/af-backups
          FORMS_BACKUP_PATH: /tmp/af-backups/forms
          # the runner's mysqldump is MySQL's : against MariaDB it must not ask for column statistics
          MYSQLDUMP_COMMAND: ${{ startsWith(matrix.db, 'mariadb') && 'mysqldump --column-statistics=0' || 'mysqldump' }}
        run: |
          # a table 7.0.0 drops : the database looks like an install to upgrade
          node -e "import('mysql2/promise').then(async (m) => { const c = await m.createConnection({ host: '127.0.0.1', user: 'root', password: process.env.DB_PASSWORD }); await c.query('CREATE TABLE AnsibleForms.staging (id int)'); await c.end(); })"
          node ./index.js > /tmp/af-upgrade.log 2>&1 &
          echo $! > /tmp/af.pid
          node scripts/ci-database.mjs http://127.0.0.1:8000
          kill "$(cat /tmp/af.pid)"
          grep -q "Backed up the database before the upgrade" /tmp/af-upgrade.log || { echo "::error::no backup before the upgrade"; exit 1; }
          test -n "$(ls /tmp/af-backups)" || { echo "::error::the backup folder is empty"; exit 1; }
          node -e "import('mysql2/promise').then(async (m) => { const c = await m.createConnection({ host: '127.0.0.1', user: 'root', password: process.env.DB_PASSWORD }); const [r] = await c.query(\"SHOW TABLES FROM AnsibleForms LIKE 'staging'\"); await c.end(); if (r.length) { console.error('staging was not dropped'); process.exit(1); } })"
          sleep 3

      # The steps below use the DEFAULT dump and restore commands (MYSQLDUMP_COMMAND and
      # MYSQL_COMMAND unset : mariadb-dump and mariadb with --ssl-verify-server-cert=OFF), so the
      # default is what gates the upgrade, against MySQL 8.4 too. The runner only has MySQL's
      # client, and Ubuntu's mariadb-client is an older release than the image's : the binaries
      # are the image's own Debian trixie package (the Dockerfile installs mariadb-client on
      # node:26-trixie-slim), run from a small image through two shims on the PATH.
      - name: The image's client tools - mariadb-dump and mariadb from Debian trixie
        run: |
          docker build -q -t af-ci-mariadb-client - <<'EOF'
          FROM debian:trixie-slim
          RUN apt-get update && apt-get install -y --no-install-recommends mariadb-client && rm -rf /var/lib/apt/lists/*
          EOF
          mkdir -p "$RUNNER_TEMP/af-bin"
          for tool in mariadb-dump mariadb; do
            printf '#!/bin/sh\nexec docker run --rm -i --network host af-ci-mariadb-client %s "$@"\n' "$tool" > "$RUNNER_TEMP/af-bin/$tool"
            chmod +x "$RUNNER_TEMP/af-bin/$tool"
          done
          echo "$RUNNER_TEMP/af-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/af-bin/mariadb-dump" --version

      # A real upgrade : the 7.2.0 schema as that release created it (tests/fixtures), with the
      # rows the 7.3 patches move - an LDAP directory, two SSO providers, the mail settings,
      # runners and a Vault with their own secrets, an environment label, a schedule - then the
      # app starts on it, backs it up, patches it, and every move is checked in SQL
      # (scripts/ci-upgrade.mjs). The build's version is the next minor of package.json, as a
      # release build bakes it (build-info.json, gitignored) : between two releases package.json
      # still names the previous one, and 7.2.0 must read as older than this build.
      - name: An upgrade from 7.2.0 - its data moved, with the default dump command
        env:
          BACKUP_PATH: /tmp/af-backups-72
          FORMS_BACKUP_PATH: /tmp/af-backups-72/forms
        run: |
          node -e "const v = require('./package.json').version.split('.').map(Number); require('fs').writeFileSync('build-info.json', JSON.stringify({ version: v[0] + '.' + (v[1] + 1) + '.0' }))"
          cat build-info.json
          node scripts/ci-upgrade.mjs seed
          node ./index.js > /tmp/af-upgrade72.log 2>&1 &
          echo $! > /tmp/af.pid
          node scripts/ci-database.mjs http://127.0.0.1:8000
          node scripts/ci-upgrade.mjs check
          kill "$(cat /tmp/af.pid)"
          sleep 3
          grep -q "Backed up the database before the upgrade" /tmp/af-upgrade72.log || { echo "::error::no backup before the upgrade from 7.2.0"; exit 1; }
          test -s "$(ls -d /tmp/af-backups-72/[0-9]* | head -n 1)/ansibleforms.sql" || { echo "::error::the backup before the upgrade from 7.2.0 has no dump"; exit 1; }
          if grep -q "Patching failed" /tmp/af-upgrade72.log; then echo "::error::the patches failed on the 7.2.0 schema"; exit 1; fi

      # The backup that upgrade took, restored through the API : the 7.2.0 schema comes back, and
      # the restore must patch it again before it says it completed (every move checked again).
      # Its log is left out of the error check below : between the dump replayed and the patches,
      # a background task can query a 7.3 column of the old tables (a transient Unknown column).
      - name: Restoring the backup taken before that upgrade - upgraded again
        env:
          BACKUP_PATH: /tmp/af-backups-72
          FORMS_BACKUP_PATH: /tmp/af-backups-72/forms
        run: |
          node ./index.js > /tmp/af-restore.log 2>&1 &
          echo $! > /tmp/af.pid
          node scripts/ci-database.mjs http://127.0.0.1:8000
          node scripts/ci-upgrade.mjs restore http://127.0.0.1:8000
          node scripts/ci-upgrade.mjs check
          kill "$(cat /tmp/af.pid)"
          rm -f build-info.json
          if grep -E "Patching failed|could not be upgraded" /tmp/af-restore.log; then echo "::error::the restored 7.2.0 schema was not upgraded"; exit 1; fi

      - name: No error in the logs
        run: |
          if grep -E " error:" /tmp/af-first.log /tmp/af-second.log /tmp/af-upgrade.log /tmp/af-upgrade72.log; then
            echo "::error::the app logged errors against ${{ matrix.db }}"
            exit 1
          fi

      - name: The logs, when it failed
        if: failure()
        run: tail -n 200 /tmp/af-first.log /tmp/af-second.log /tmp/af-upgrade.log /tmp/af-upgrade72.log /tmp/af-restore.log || true

  # The pages in a real browser : the built client served by the server, on a fresh install on a
  # real database, driven by Playwright (client/e2e). A smoke test of what a release must not
  # break - each page opens, does what it is for, and logs no error - not a second unit suite.
  # ADMIN_PASSWORD gives the fresh install's admin a password of its own, so the tests sign in
  # without the forced change of the default one.
  browser:
    name: Browser
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: ci-not-a-real-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci-not-a-real-password
      ACCESS_TOKEN_SECRET: ci-not-a-real-secret-0123456789
      ENCRYPTION_SECRET: ci-not-a-real-secret-0123456789ab
      ADMIN_PASSWORD: E2e-Browser-2026!
      HTTPS: "0"
      PORT: "8000"
      LOG_PATH: /tmp/af-logs
      E2E_BASE_URL: http://127.0.0.1:8000
      E2E_PASSWORD: E2e-Browser-2026!
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install
        run: |
          (cd client && npm ci)
          (cd server && npm ci)

      # the server serves the built client from server/views, as the image does
      - name: Build the client
        run: |
          (cd client && npm run build)
          rm -rf server/views && cp -r client/dist server/views

      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Start the app
        working-directory: server
        run: |
          node ./index.js > /tmp/af-browser.log 2>&1 &
          for i in $(seq 1 90); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v2/ready || true)" = "200" ]; then exit 0; fi
            sleep 2
          done
          echo "::error::the app was not ready after 3 minutes"
          exit 1

      - name: Test
        working-directory: client
        run: npm run test:e2e

      - name: The report, when it failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7

      - name: The app's log, when it failed
        if: failure()
        run: tail -n 200 /tmp/af-browser.log || true

  schema:
    name: Public schema is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # server/schema/public/*.json is generated but committed, and it is only
      # regenerated inside publish.sh / publish-rc.sh - so it silently goes stale
      # between releases. jq is preinstalled on the runner.
      - name: Regenerate
        run: ./server/schema/build-public-schema.sh

      - name: Fail if the committed copy differs
        run: |
          if ! git diff --quiet -- server/schema/public; then
            echo "::error::server/schema/public is out of date - run ./server/schema/build-public-schema.sh and commit the result"
            git diff -- server/schema/public
            exit 1
          fi
          echo "server/schema/public matches the authoritative schema"

  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      # flags a dependency the PR adds that has a known advisory
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
