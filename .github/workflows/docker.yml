name: Docker

# Builds the images (the app and the three RTE layers) without publishing them, and runs a
# playbook on the RTE, so "does the image still assemble and work" is answered at review time
# instead of by hand during publish.sh. Path-filtered because it is the slow
# one - it runs npm ci and a vite build inside the image - and for that reason it is not
# a check worth requiring in branch protection.

on:
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'docker/**'
      - 'server/ansible.cfg'
      - 'server/healthcheck.js'
      - 'client/package.json'
      - 'client/package-lock.json'
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'scripts/generate-build-info.sh'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    # a registry for this job only : the RTE layers build on one another through it
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        with:
          # the builder reaches the job's registry on localhost
          driver-opts: network=host

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/controller/Dockerfile
          push: false
          # Built to prove it builds, never published: say so, or buildx warns that the result
          # goes nowhere.
          outputs: type=cacheonly
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      # The RTE layers build FROM one another : each is pushed to a registry that lives only
      # for this job, and the next one builds on it by digest, as publish.yml does on ghcr
      - name: Build the RTE base (no publish)
        id: rte_base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/rte-base/Dockerfile
          push: true
          tags: localhost:5000/ansibleforms-rte-base:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=rte-base
          cache-to: type=gha,mode=max,scope=rte-base

      - name: Build the RTE (no publish)
        id: rte
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/rte-core/Dockerfile
          push: true
          tags: localhost:5000/ansibleforms-rte-core:ci
          build-args: |
            BASE_IMAGE=localhost:5000/ansibleforms-rte-base@${{ steps.rte_base.outputs.digest }}
          cache-from: type=gha,scope=rte-core
          cache-to: type=gha,mode=max,scope=rte-core

      - name: Build the RTE full (no publish)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/rte-full/Dockerfile
          push: true
          tags: localhost:5000/ansibleforms-rte-full:ci
          build-args: |
            BASE_IMAGE=localhost:5000/ansibleforms-rte-core@${{ steps.rte.outputs.digest }}
          cache-from: type=gha,scope=rte-full
          cache-to: type=gha,mode=max,scope=rte-full

      # An image that builds can still run nothing : a python ansible does not support, a
      # library without a wheel, a collection that fails to load. Run a playbook on both
      # runnable layers, and on -full a collection module and the libraries 6.5 playbooks use.
      - name: Smoke test the RTE images
        run: |
          set -euo pipefail
          mkdir -p smoke
          cat > smoke/core.yml <<'YAML'
          - hosts: localhost
            gather_facts: false
            tasks:
              - ansible.builtin.assert:
                  that: "({'a': 1} | ansible.builtin.dict2items | map(attribute='key') | list) == ['a']"
          YAML
          cat > smoke/full.yml <<'YAML'
          - hosts: localhost
            gather_facts: false
            tasks:
              - community.general.read_csv:
                  path: /etc/passwd
                  delimiter: ':'
                  fieldnames: [user, x, uid]
                register: rows
              - ansible.builtin.assert:
                  that: rows.list | length > 0
          YAML
          for layer in core full; do
            image="localhost:5000/ansibleforms-rte-$layer:ci"
            docker pull -q "$image"
            echo "::group::rte-$layer"
            docker run --rm --entrypoint sh -v "$PWD/smoke:/smoke:ro" "$image" -c \
              'python --version && ansible --version | head -1 && ansible-playbook /smoke/core.yml'
            echo "::endgroup::"
          done
          docker run --rm --entrypoint sh -v "$PWD/smoke:/smoke:ro" localhost:5000/ansibleforms-rte-full:ci -c '
            ansible-playbook /smoke/full.yml &&
            for c in netapp.ontap netapp.elementsw netapp.um_info netapp.storagegrid amazon.aws community.general community.mysql; do
              ansible-galaxy collection list "$c" >/dev/null 2>&1 || { echo "missing collection $c"; exit 1; }
            done &&
            python -c "import pandas, pyVmomi, boto3, netapp_ontap, netapp_lib, solidfire, hvac, lxml, openpyxl, pymysql, bs4, yaml" &&
            echo "rte-full : playbook, collections and libraries ok"'
