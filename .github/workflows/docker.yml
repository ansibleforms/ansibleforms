name: Docker

# Builds the controller's image without publishing it, so "does the image still assemble" is
# answered at review time instead of during a publish. The RTE images are built and tested in
# ansibleforms/rte, against this repository's main. Built on amd64 and on arm64, each on a runner of its
# own, as publish.yml does. Path-filtered because it is the slow one - it runs npm ci and a
# vite build inside the image - and for that reason it is not a check worth requiring in
# branch protection.

on:
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'server/healthcheck.js'
      - 'client/package.json'
      - 'client/package-lock.json'
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'scripts/generate-build-info.sh'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image (${{ matrix.arch }})
    strategy:
      # one architecture failing still lets the other one report
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          # Built to prove it builds, never published: say so, or buildx warns that the result
          # goes nowhere.
          outputs: type=cacheonly
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
