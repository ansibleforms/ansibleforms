version: 2

# Dependabot NEVER proposes a major version : every entry ignores semver-major updates.
# Majors carry breaking changes by definition, so they are done by hand (npm outdated,
# read the changelog, decide) and never arrive through a routine-looking pull request.
# Updates are never grouped : every dependency gets its own pull request, so each one can be
# reviewed, tested and reverted on its own.
#
# Every pull request title here must pass the PR / Title check (Conventional Commits), so
# each entry sets a commit-message prefix : build(deps) for what ships in the image, ci for
# the workflow actions. `build` is hidden in the generated CHANGELOG.

updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Moves the digest pins (one Dockerfile per image folder) : node:26-trixie(-slim) in
  # docker/controller, node:26-trixie-slim in docker/runner/rte-base, and the uv image
  # docker/runner/rte-core takes its python from. rte-core and rte-full otherwise build FROM our
  # own layers (BASE_IMAGE).
  - package-ecosystem: docker
    directories:
      - /docker/controller
      - /docker/runner/*
    schedule:
      interval: daily
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # The python packages of the RTE images (docker/runner/rte-core for ansibleforms-rte-core,
  # docker/runner/rte-full for ansibleforms-rte-full) : pinned, so an image changes only with a commit here
  - package-ecosystem: pip
    directories:
      - /docker/runner/rte-core
      - /docker/runner/rte-full
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    # boto3 pins its own botocore release : bumped apart, each pull request fails to install
    groups:
      boto:
        patterns: ['boto3', 'botocore']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # The maintenance line (release/6.x) : patch updates only - a minor of a dependency is
  # no business of a patch release. Dependabot reads this file from main only, so the
  # entries for the other branch live here.
  - package-ecosystem: npm
    directory: /client
    target-branch: release/6.x
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: npm
    directory: /server
    target-branch: release/6.x
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: docker
    directory: /
    target-branch: release/6.x
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
