version: 2

# Every pending update gets its pull request at once (open-pull-requests-limit: 100 on each
# entry, as Dependabot has no unlimited value), instead of five at a time per entry.

# Dependabot proposes every version, majors included, on main : a major carries breaking
# changes, so its pull request is read against the dependency's changelog before it is merged.
# The maintenance line (release/6.x, below) takes patch updates only.
# Updates are never grouped : every dependency gets its own pull request, so each one can be
# reviewed, tested and reverted on its own.
#
# Every pull request title here must pass the PR / Title check (Conventional Commits), so
# each entry sets a commit-message prefix : build(deps) for what ships in the image, ci for
# the workflow actions. `build` is hidden in the generated CHANGELOG.

updates:
  - package-ecosystem: npm
    open-pull-requests-limit: 100
    directory: /client
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    # vitest and its coverage plugin need each other's major : bumped apart, each pull request
    # fails to install
    groups:
      vitest:
        patterns: ['vitest', '@vitest/*']

  - package-ecosystem: npm

    open-pull-requests-limit: 100
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions

    open-pull-requests-limit: 100
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Moves the digest pins (one Dockerfile per image folder) : node:26-trixie(-slim) in
  # docker/controller, node:26-trixie-slim in docker/runner/rte-base, and the uv image
  # docker/runner/rte-core takes its python from. rte-core and rte-full otherwise build FROM our
  # own layers (BASE_IMAGE).
  - package-ecosystem: docker
    open-pull-requests-limit: 100
    directories:
      - /docker/controller
      - /docker/runner/*
    schedule:
      interval: daily
    commit-message:
      prefix: build
      include: scope

  # The python packages of the RTE images (docker/runner/rte-core for ansibleforms-rte-core,
  # docker/runner/rte-full for ansibleforms-rte-full) : pinned, so an image changes only with a commit here
  - package-ecosystem: pip
    open-pull-requests-limit: 100
    directories:
      - /docker/runner/rte-core
      - /docker/runner/rte-full
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    # boto3 pins its own botocore release : bumped apart, each pull request fails to install
    groups:
      boto:
        patterns: ['boto3', 'botocore']

  # The maintenance line (release/6.x) : patch updates only - a minor of a dependency is
  # no business of a patch release. Dependabot reads this file from main only, so the
  # entries for the other branch live here.
  - package-ecosystem: npm
    open-pull-requests-limit: 100
    directory: /client
    target-branch: release/6.x
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: npm

    open-pull-requests-limit: 100
    directory: /server
    target-branch: release/6.x
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: docker

    open-pull-requests-limit: 100
    directory: /
    target-branch: release/6.x
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
